      pierce:
        # decision batch 8, 8-15 (OQ-150): from the 7 row up, but no instant death: a 1-die penalty on Treat Injury,
        # and no healing while untreated
        - {rows: [leg-wrenched-knee, leg-fractured-leg, leg-opened-artery, leg-shattered-knee, leg-lost-leg], treat_injury: {penalty: 1}, sets: {heals_untreated: false}}
    rows:
      - id: leg-twisted-ankle
