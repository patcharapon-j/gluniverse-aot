        down: false
        lethal: false
        time_limit: null
        death_roll_penalty: 0
        effects:
          - {type: penalty, dice: 1, entries: [dodge]}
        healing_days: 4
      - id: leg-wrenched-knee
        names: {crush: Wrenched Knee, bite: Knee Wrenched in the Jaws, burn: Seared Knee, cut: Hamstring Nicked, pierce: Shot Through the Calf}
        results: {min: 7, max: 7}
        down: false
        lethal: false
        time_limit: null
        death_roll_penalty: 0
        effects:
          - {type: penalty, dice: 1, entries: [fly, ride, dodge]}
        healing_days: 7
      - id: leg-fractured-leg
        names: {crush: Fractured Leg, bite: Shin Cracked in the Jaws, burn: Leg Burned Raw, cut: Calf Split Open, pierce: Thigh Shot Through}
        results: {min: 8, max: 9}
        down: false
        lethal: false
        time_limit: null
        death_roll_penalty: 0
        effects:
          - {type: penalty, dice: 2, entries: [fly, ride, dodge]}
        healing_days: 21
      - id: leg-opened-artery
        names: {crush: Pulped Thigh, bite: Thigh Artery Torn by Teeth, burn: Charred Leg, cut: Opened Artery, pierce: Artery Shot in the Thigh}
        results: {min: 10, max: 11}
        down: false
        lethal: true
        time_limit: engagement
        death_roll_penalty: 0
        effects:
          - {type: penalty, dice: 1, entries: [dodge]}
        healing_days: 10
      - id: leg-shattered-knee
        names: {crush: Shattered Knee, bite: Leg Half Bitten Through, burn: Leg Burned to the Muscle, cut: Leg Hacked to the Bone, pierce: Knee Shattered by Shot}
        results: {min: 12, max: 12}
        down: until_treated
        lethal: true
        time_limit: engagement
        death_roll_penalty: 1
        effects:
          - {type: penalty, dice: 2, entries: [fly, ride, dodge]}
        healing_days: 28
      - id: leg-lost-leg
        names: {crush: Lost Leg, bite: Bitten Off at the Thigh, burn: Leg Burned Away, cut: Leg Severed, pierce: Leg Shot to Ruin}
        results: {min: 13, max: null}
        down: until_treated
        lethal: true
        time_limit: turn
        death_roll_penalty: 1
        effects: []
        healing_days: 28
        permanent_effects:
          - {type: penalty, dice: 2, entries: [fly, ride, dodge, leap-clear]}   # leap-clear: decision batch 8, 8-23
        repeat_row: leg-shattered-knee

  torso:
    injury_location: torso
    non_lethal_cap: torso-caved-chest
    type_riders:   # no Bite rider on the torso (decision batch 7, 7-5)
      burn:
        # decision batch 8, 8-8 (OQ-138): healing doubled and Treat Injury needs a kit or supplies on every row;
        # every lethal row kills by the day
        - {all_rows: true, sets: {healing_days_multiplier: 2}, treat_injury: requires_kit_or_supplies}
        - {lethal_rows: true, sets: {time_limit: day}}
      cut:
        # decision batch 8, 8-15 (OQ-150): every lethal engagement row bleeds on a turn limit
        - {rows: [torso-punctured-lung], sets: {time_limit: turn}}
      pierce:
        # decision batch 8, 8-15 (OQ-150): from the 7 row up, but no instant death: a 1-die penalty on Treat Injury,
        # and no healing while untreated
        - {rows: [torso-deep-bruising, torso-crushed-ribs, torso-caved-chest, torso-punctured-lung, torso-internal-bleeding, torso-torn-open], treat_injury: {penalty: 1}, sets: {heals_untreated: false}}
    rows:
