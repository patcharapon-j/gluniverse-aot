# ------------------------------------------------------------------ lost limbs (ADR-0017; decision batch 7, 7-6)
lost_limb_riders:
  sides_lost: >-
    The sides at which the soldier has gained a grade's row: every entry in critical_injuries with that row id,
    held, treated or not, and every entry in healed_permanent_injuries with it (data/harm/sheet-fields.yaml). A
    later roll of that row at a side already lost uses its repeat_row (gaining, repeat-permanent), so it loses no
    further side.
  applies: >-
    A grade applies from the moment the soldier's sides lost at its row, read with the prosthetics fitted
    (prosthetics, reading), equal its sides_lost, and for as long as that stays true. One grade per limb
    applies: a soldier who loses the second arm moves from one-arm to both-arms. The row's own permanent_effects
    still apply at every side lost, prosthetic or not, and add up with everything else (held_injuries,
    stacking): two lost legs dodge, Fly, and Ride at a 4-die penalty, and two lost arms strike at 4 (decision
    batch 8, 8-11).
  fields:
    penalties: effects of type penalty (data/harm/effect-types.yaml) the grade adds
    forbids_entries: >-
      Action Catalog entry ids the soldier cannot take, make, or use, read as effect type forbids-entries
      (data/harm/effect-types.yaml). The drafter's choice under decision batch 7, 7-6: a new effect type, rather
      than widening Chapter 1's forbids hook, which names Pushing, Help, Covering, and Reactions (ADR-0003,
      item 13).
    forbids_decoys: Break Attention decoy ids the soldier cannot name (data/engagement/attention.yaml, break_attention, decoys)
    no_gear_dice_from: >-
      Items that supply no Gear Dice to the listed entries for this soldier. The entry is still rolled, with Gear
      Dice from any other item it allows (Chapter 1, section 1.3, step 6).
    mount_or_dismount: what the grade does to Mount or Dismount (mount_values)
    moves: what the grade does to each kind of move the soldier makes (move_values)
    keeps: what the grade leaves as it was, as the decision states it; it adds and removes nothing
  move_kinds:
    on_foot: a move that is neither an ODM move nor made mounted (data/engagement/anchor-ratings.yaml, move_kinds)
    mounted: a move made mounted (data/gear/horses.yaml)
    odm: an ODM move (data/gear/odm-gear.yaml, odm_moves)
  move_values:
    unchanged: The move is made as the rules for moves state.
    spends_action: >-
      The move also spends the soldier's action, and cannot be made if that action is already spent, as an
      Overloaded soldier's ODM move does (data/gear/carrying.yaml, overloaded). Outside a Titan Engagement this
      has no effect unless the rule for the procedure under way says so.
    forbidden: The soldier cannot make the move, and holds the Position they are placed at.
  mount_values:
    unchanged: The soldier mounts and dismounts as data/gear/horses.yaml (mounted) states.
    with_help: >-
      A mount or a dismount is made only with a comrade's help, as the grade's mount_with_help states, and
      never otherwise (decision batch 8, 8-11 and 8-25).
  gm_choices: none
  grades:
    - id: one-arm
      name: One arm lost
      row: arm-lost-arm
      sides_lost: 1
      penalties:
        - {type: penalty, dice: 1, entries: [fly, fight, block]}
      forbids_entries: []
      forbids_decoys: []
      no_gear_dice_from: []
      mount_or_dismount: unchanged
      moves: {on_foot: unchanged, mounted: unchanged, odm: unchanged}
      keeps: >-
        Everything else: Ride, the dodge, Read, Rally, Break Attention, Draw Attention, Help, and command from
        the saddle.
    - id: both-arms
      name: Both arms lost
      row: arm-lost-arm
      sides_lost: 2
      penalties: []   # the rows' own penalties, which stack: 4 dice on the strikes, Break Free, Treat Injury, and Field Repair (decision batch 8, 8-11)
      # Every entry whose requirements name ODM Gear, a Blade Set, a firearm, or handling an item or a comrade,
      # enumerated from data/character/action-catalog.yaml.
      forbids_entries: [nape-strike, body-part-strike, break-free, fly, field-repair, treat-injury, lift-comrade, heave, pass-item, take-item, swap-blade-set, change-canister, restock-medical-kit, fight, block, shoot, reload]   # heave: decision batch 8, 8-23
      forbids_decoys: [feint, flare, thrown-cloak]   # decision batch 8, 8-11: the riderless-horse decoy stays allowed
      # decision batch 8, 8-11 and 8-23 (OQ-159): the grade forbids ODM use, so the dodge and Leap Clear take no Gear
      # Dice from ODM Gear, and the horse's while mounted.
      no_gear_dice_from:
        - {item: odm-gear, entries: [dodge, leap-clear]}
      mount_or_dismount: with_help   # decision batch 8, 8-11
      mount_with_help: >-
        In a Titan Engagement, a comrade who holds the soldier's Position and is not Down spends their action to
        help. In a Skirmish, a comrade taking part who is not Down spends their action to help. Anywhere else, a
        comrade in the Squad who is not Down and is on the same Expedition as the soldier, or in the Squad when no
        Expedition is under way, helps, spending nothing. With no such help the soldier does not mount or
        dismount (decision batch 8, 8-11 and 8-25; OQ-161).
      moves: {on_foot: unchanged, mounted: unchanged, odm: forbidden}
      keeps: >-
        Shed Load; Mount or Dismount with a comrade's help, and Ride while mounted; the dodge and Leap Clear, with the horse's Gear Dice while mounted; the riderless-horse decoy; Read; Call It; Rally; Draw Attention; Help; Cover;
        and Swap Initiative Card.
    - id: one-leg
      name: One leg lost
      row: leg-lost-leg
      sides_lost: 1
      penalties: []   # the row's own 2-die penalty on Fly, Ride, and the dodge stands, and a second lost leg's stacks with it (decision batch 8, 8-11)
      forbids_entries: []
      forbids_decoys: []
      no_gear_dice_from: []
      mount_or_dismount: unchanged
      moves: {on_foot: spends_action, mounted: unchanged, odm: unchanged}
      keeps: Everything else, flight included.
    - id: both-legs
      name: Both legs lost
      row: leg-lost-leg
      sides_lost: 2
      penalties: []   # the rows' own penalties, which stack: 4 dice on Fly, Ride, and the dodge (decision batch 8, 8-11)
      forbids_entries: [fly, ride, lift-comrade]
      forbids_decoys: []
      no_gear_dice_from: []
      mount_or_dismount: unchanged   # no move of any kind is made, so no mount is either (moves)
      # "hold the Position they are placed at": no move of any kind (decision batch 7, 7-6)
      moves: {on_foot: forbidden, mounted: forbidden, odm: forbidden}
      keeps: >-
        The dodge and Leap Clear, with the rows' penalties, which stack; Heave; a strike at a Titan at In Reach; Read; Rally; Break
        Attention; Draw Attention; Treat Injury; Field Repair; and being carried by Lift Comrade, at their consent
        (data/gear/carrying.yaml, lifting_a_comrade). They travel across a comrade's saddle or in the wagon.
  # Decision batch 8, 8-10 (OQ-147): the Prosthetic, the alternative to medical Retirement.
  prosthetics:
    kinds: {arm: prosthetic-arm, leg: prosthetic-leg}   # data/gear/items.yaml
    fitted: >-
      A prosthetic of a kind is fitted to one side the soldier has lost at that kind's 13 or more row, at most one
      per side, during a Downtime once the Critical Injury that lost that side has healed (data/harm/healing.yaml;
      Chapter 7, section 7.2). Fitting needs no roll and spends nothing. It stays fitted for as long as the soldier
      lives, and the sheet records it (data/harm/sheet-fields.yaml, prosthetics).
    reading: >-
      A grade's sides_lost is compared with the soldier's sides lost at its row less the prosthetics of that kind
      fitted. So one lost arm with a prosthetic meets no arm grade, and both arms lost with one prosthetic meet the
      one-arm grade.
    limit: >-
      Two prosthetics of a kind never lower the grade past the one-limb grade: a soldier who has lost both sides of
      a kind and has two prosthetics of that kind fitted meets that kind's one-limb grade.
    never_removes: >-
      The 13 or more row's own permanent_effects stay at every side lost, prosthetic or not, and stack
      (held_injuries, stacking). A prosthetic gives no dice to any roll, is never a weapon, and cannot be obtained
      before the loss at that side has healed (Chapter 7, section 7.3).
    squadmates: A player character may obtain one for a Squadmate (Chapter 7, section 7.3).
    retirement: Medical Retirement stays open beside it (data/mind/scars.yaml, retirement, trigger, lost-limbs).
    decided: [OQ-147]
  retirement: data/mind/scars.yaml (retirement, trigger, lost-limbs) applies to both-arms and both-legs
  decided: [OQ-137, OQ-147]
