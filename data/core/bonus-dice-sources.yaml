# The complete list of Bonus Dice sources.
# Source of truth under ADR-0012. docs/rules/01-core-rules.md (section 1.7) references
# this file and does not repeat its rows. A chapter that creates a new source of
# Bonus Dice adds a row here; nothing outside this list adds Bonus Dice.
id: bonus-dice-sources
name: Bonus Dice Sources
chapter: 01-core-rules
adrs: [ADR-0006, ADR-0007, ADR-0010, ADR-0018, ADR-0024]
cap_per_roll: 4
die_type: base
declare: before the roll; no source can be added after the dice are rolled

sources:
  - id: help
    name: Help
    category: help
    dice_per_unit: 1
    unit: helper
    max_units: 3
    applies_to: >-
      any attribute roll except one whose roll_exceptions row in data/core/dice-pool.yaml
      excludes help (the Death Roll, the performance roll, and the passive roll), or whose own
      rule forbids Help (such as the first two Trials of the Graduation Exam)
    condition: >-
      The helper is a soldier other than the roller, is not Down, and is a player
      character or a Squadmate whose Chapter 2 action list includes Help. The helper
      also meets the requirement for the context the roll is made in. No state or
      result the soldier holds forbids it (a forbids field on that state's or result's
      row; Chapter 1, section 1.9).
    condition_in_titan_engagement: >-
      The helper has an unspent action this round (a turn spent in advance by a
      Reaction or a result begins its round with its move and action spent, and an
      action a result spends in advance begins its round spent) and is at the same
      Position as the roller or one Position step away.
    condition_outside_titan_engagement: >-
      On a roll a rule calls for, that rule allows Help and states who qualifies to Help
      and what Help spends. If that rule says nothing about Help, the roll cannot be
      Helped. On a called roll outside a Titan Engagement and a Skirmish (Chapter 1,
      section 1.1), the helper is present and able to help concretely, as the GM rules.
      In a Skirmish, on a called roll as on any roll there, the helper is a comrade
      taking part who is not Down, whether Engaged or Apart (data/skirmish/skirmish.yaml,
      rolls, called-roll; decision batch 9, 9-36 and 9-42).
    spends_in_titan_engagement: the helper's action
    spends_outside_titan_engagement: >-
      On a roll a rule calls for, what that rule states. On a called roll outside a Titan
      Engagement and a Skirmish, nothing, unless the GM names before the dice a cost of
      time or position, which falls when Help is declared, whatever the result (Chapter 1,
      section 1.8; decision batch 9, 9-28). In a Skirmish, the helper's action, and the GM
      names no cost for it (decision batch 9, 9-36 and 9-42).
    rules: [01-core-rules]
    adrs: [ADR-0024, ADR-0010]
    decided: [OQ-03, OQ-08, OQ-13, OQ-17, OQ-18]

  - id: circumstances
    name: Circumstances
    category: circumstances
    dice_per_unit:        # by the plus step the GM named (data/core/circumstances.yaml, steps)
      easy: 1
      routine: 2
      effortless: 3
    unit: plus step of Circumstances
    max_units: 1          # one step per roll
    applies_to: >-
      any attribute roll a soldier or a Squadmate makes, except the rolls
      data/core/circumstances.yaml lists under never
    condition: >-
      The GM named Easy, Routine, or Effortless as the roll's Circumstances, with the stakes
      and before Bonus Dice are declared (Chapter 1, sections 1.1 and 1.4a). It is the one
      source a ruling names.
    declared_by: the GM, with the stakes
    spends: nothing
    rules: [01-core-rules]
    adrs: [ADR-0024, ADR-0006]

  - id: opening
    name: Opening
    category: opening
    dice_per_unit: 1
    unit: Opening spent
    max_units: null   # limited only by the Openings on the Titan and the cap
    applies_to: Nape strike
    condition: >-
      The struck Titan has at least one Opening. The roller did not create the Opening
      (data/engagement/titan-harm.yaml, openings, own_openings).
    spends: the Opening
    rules: [05-titan-engagement]
    adrs: [ADR-0007, ADR-0010]

  - id: grounded-titan
    name: Titan grounded by a Broken leg
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: Nape strike
    condition: The struck Titan has a Broken leg.
    spends: nothing
    rules: [05-titan-engagement]
    adrs: [ADR-0007]

  - id: read-from-distant
    name: Reading from Distant
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: Read
    condition: >-
      The reader holds Distant relative to the Focus Titan they Read
      (data/engagement/read.yaml, read).
    spends: nothing
    rules: [05-titan-engagement]
    decided: [OQ-84, OQ-90]

  - id: call-it
    name: Call It
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: dodge
    condition: >-
      A comrade's Read Called the behavior the dodge is made against, so the reader's own dodge
      gains nothing (data/engagement/read.yaml, call_it).
    spends: nothing
    rules: [05-titan-engagement]
    decided: [OQ-84, OQ-90]

  - id: medical-supplies
    name: Medical supplies
    category: situation
    dice_per_unit: 1
    unit: medical unit of Squad Supply spent
    max_units: 1
    applies_to: >-
      A Treat Injury roll in a care window. Never a roll in a Titan Engagement, and never an
      aftermath roll.
    condition: >-
      The Squad Supply holds at least 1 medical unit (data/gear/squad-supply.yaml,
      medical_uses, care-bonus).
    spends: 1 medical unit of Squad Supply
    rules: [04-gear, 03-harm-and-mind]
    adrs: [ADR-0006]
    decided: [OQ-44, OQ-67]

  - id: ambush
    name: Ambush
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: A Fight or Shoot roll made by a soldier in a Skirmish.
    condition: >-
      The Squad has the ambush in that Skirmish, and the attacked Foe has not yet acted in it
      (Chapter 7, section 7.4).
    spends: nothing
    rules: [07-playtest-rules]
    adrs: [ADR-0018]
    decided: [OQ-143]   # decision batch 7, 7-17
