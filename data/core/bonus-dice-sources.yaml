# The complete list of Bonus Dice sources.
# Source of truth under ADR-0012. docs/rules/01-core-rules.md (section 1.7) references
# this file and does not repeat its rows. A chapter that creates a new source of
# Bonus Dice adds a row here; nothing outside this list adds Bonus Dice.
id: bonus-dice-sources
name: Bonus Dice Sources
chapter: 01-core-rules
adrs: [ADR-0006, ADR-0007, ADR-0010, ADR-0018]
cap_per_roll: 4
die_type: base
declare: before the roll; no source can be added after the dice are rolled

sources:
  - id: help
    name: Help
    category: help
    dice_per_unit: 1
    unit: helper
    max_units: 3
    applies_to: >-
      any attribute roll except one whose roll_exceptions row in data/core/dice-pool.yaml
      excludes help (the Death Roll and the performance roll), or whose own rule forbids
      Help (such as the first two Trials of the Graduation Exam)
    condition: >-
      The helper is a soldier other than the roller, is not Down, and is a player
      character or a Squadmate whose Chapter 2 action list includes Help. The helper
      also meets the requirement for the context the roll is made in. No state or
      result the soldier holds forbids it (a forbids field on that state's or result's
      row; Chapter 1, section 1.9).
    condition_in_titan_engagement: >-
      The helper has an unspent action this round (a turn spent in advance by a
      Reaction or a result begins its round with its move and action spent, and an
      action a result spends in advance begins its round spent) and is at the same
      Position as the roller or one Position step away.
    condition_outside_titan_engagement: >-
      The rule that calls for the roll allows Help and states who qualifies to Help
      and what Help spends. If that rule says nothing about Help, the roll cannot be
      Helped.
    spends_in_titan_engagement: the helper's action
    spends_outside_titan_engagement: what the rule that calls for the roll states
    rules: [01-core-rules]
    adrs: [ADR-0003, ADR-0010]
    decided: [OQ-03, OQ-08, OQ-13, OQ-17, OQ-18]

  - id: opening
    name: Opening
    category: opening
    dice_per_unit: 1
    unit: Opening spent
    max_units: null   # limited only by the Openings on the Titan and the cap
    applies_to: Nape strike
    condition: >-
      The struck Titan has at least one Opening. The roller did not create the Opening
      (data/engagement/titan-harm.yaml, openings, own_openings).
    spends: the Opening
    rules: [05-titan-engagement]
    adrs: [ADR-0007, ADR-0010]

  - id: grounded-titan
    name: Titan grounded by a Broken leg
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: Nape strike
    condition: The struck Titan has a Broken leg.
    spends: nothing
    rules: [05-titan-engagement]
    adrs: [ADR-0007]

  - id: read-from-distant
    name: Reading from Distant
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: Read
    condition: >-
      The reader holds Distant relative to the Focus Titan they Read
      (data/engagement/read.yaml, read).
    spends: nothing
    rules: [05-titan-engagement]
    decided: [OQ-84, OQ-90]

  - id: call-it
    name: Call It
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: dodge
    condition: >-
      A comrade's Read Called the behavior the dodge is made against, so the reader's own dodge
      gains nothing (data/engagement/read.yaml, call_it).
    spends: nothing
    rules: [05-titan-engagement]
    decided: [OQ-84, OQ-90]

  - id: medical-supplies
    name: Medical supplies
    category: situation
    dice_per_unit: 1
    unit: medical unit of Squad Supply spent
    max_units: 1
    applies_to: >-
      A Treat Injury roll in a care window. Never a roll in a Titan Engagement, and never an
      aftermath roll.
    condition: >-
      The Squad Supply holds at least 1 medical unit (data/gear/squad-supply.yaml,
      medical_uses, care-bonus).
    spends: 1 medical unit of Squad Supply
    rules: [04-gear, 03-harm-and-mind]
    adrs: [ADR-0006]
    decided: [OQ-44, OQ-67]

  - id: ambush
    name: Ambush
    category: situation
    dice_per_unit: 2
    unit: roll
    max_units: 1
    applies_to: A Fight or Shoot roll made by a soldier in a Skirmish.
    condition: >-
      The Squad has the ambush in that Skirmish, and the attacked Foe has not yet acted in it
      (Chapter 7, section 7.4).
    spends: nothing
    rules: [07-playtest-rules]
    adrs: [ADR-0018]
    decided: [OQ-143]   # decision batch 7, 7-17
