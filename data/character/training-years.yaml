# Training Years: Lifepath steps three to five. Each Training Year has one D66 event table
# and one performance roll that earns Merit.
# Source of truth under ADR-0012. docs/rules/02-character-creation.md (section 2.3.3)
# references this file and renders its tables from it (tools/render/render.py).
id: training-years
name: Training Years
chapter: 02-character-creation
adrs: [ADR-0003, ADR-0006, ADR-0012]
decided: [OQ-19, OQ-20, OQ-21, OQ-33]

# What an event row gives:
#   attribute: +1 to that attribute (data/character/attributes.yaml, overflow rule applies)
#   talent_choice: +1 level in one listed Talent, subject to talent_cap below. Every event
#     offers at least one Talent that names an entry a current rule uses (OQ-20).
#   merit_change: added to the Cadet's Merit total (can be negative)
event_roll: D66
talent_cap:
  max_level_at_creation: 2
  if_both_capped: >-
    If neither listed Talent can gain a level (each is at level 2, or at its max_level in
    data/character/talents.yaml), the Cadet takes 1 level in any Talent on this Training
    Year's curriculum list that can gain one.
  if_only_dormant_can_gain: >-
    If the only listed Talent that can gain a level names only dormant or reserved entries
    (data/character/action-catalog.yaml), the Cadet may take that level, or instead 1 level
    in any Talent on this Training Year's curriculum list that can gain one (OQ-20).

# The performance roll. It is an attribute roll made for the Action Catalog entry
# performance-roll (data/character/action-catalog.yaml). Its exceptions to the Chapter 1
# pool are listed under roll_exceptions in data/core/dice-pool.yaml.
performance_roll:
  when: after the Training Year's event has been applied
  attribute: the higher of the Training Year's two performance_attributes (the player's choice if equal)
  pool: attribute dice only (no Talent dice, Bonus Dice, Gear Dice, or Stress Dice)
  push_allowed: false
  help_allowed: false
  merit_from_successes:   # successes_max null means no upper bound
    - {successes_min: 0, successes_max: 0, merit: 0}
    - {successes_min: 1, successes_max: 1, merit: 1}
    - {successes_min: 2, successes_max: 2, merit: 2}
    - {successes_min: 3, successes_max: null, merit: 3}
  replaced_by_graduation_exam: year-3   # data/character/graduation-exam.yaml

years:
  - id: year-1
    name: First Year, Conditioning and Discipline
    performance_attributes: [strength, instinct]
    curriculum: [iron-nerve, long-haul, strong-back, hard-to-kill, grip-breaker, quiet-step]
    events:
      - results: [11, 12, 13]
        name: The first inspection
        description: An instructor screamed a finger's width from your face on the first morning, and you did not flinch.
        attribute: instinct
        talent_choice: [iron-nerve, long-haul]
        merit_change: 1
      - results: [14, 15, 16]
        name: Found in the storehouse
        description: You were found stealing bread from the storehouse and ran laps until you collapsed.
        attribute: agility
        talent_choice: [quiet-step, slip-away]
        merit_change: -1
      - results: [21, 22, 23]
        name: Upside down in the harness
        description: You hung upside down in the balance harness on the first day and practiced every night until you could hold it.
        attribute: agility
        talent_choice: [wirework, slip-away]
        merit_change: 0
      - results: [24, 25, 26]
        name: The storm march
        description: On a mountain march in a storm you carried a Cadet who collapsed the last five kilometers.
        attribute: strength
        talent_choice: [strong-back, long-haul]
        merit_change: 1
      - results: [31, 32, 33]
        name: Top of the written test
        description: You placed first in the class on the written tactics test.
        attribute: wits
        talent_choice: [book-learning, titan-reader]
        merit_change: 1
      - results: [34, 35, 36]
        name: A winter in the infirmary
        description: A fall from the obstacle course fractured your wrist, and you spent the winter helping the infirmary staff.
        attribute: wits
        talent_choice: [field-medicine, hard-to-kill]
        merit_change: -1
      - results: [41, 42, 43]
        name: A fight in the barracks
        description: A barracks argument turned into a fight, and you finished it.
        attribute: strength
        talent_choice: [hand-to-hand, grip-breaker]
        merit_change: 0
      - results: [44, 45, 46]
        name: Fire in the stables
        description: On night watch you smelled smoke from the stables before anyone else and raised the alarm.
        attribute: perception
        talent_choice: [keen-eyes, horsemanship]
        merit_change: 1
      - results: [51, 52, 53]
        name: A homesick bunkmate
        description: You talked a homesick Cadet out of deserting on their first winter night.
        attribute: empathy
        talent_choice: [steady-voice, judge-of-character]
        merit_change: 0
      - results: [54, 55, 56]
        name: Stable duty
        description: You were assigned to the stables for a month and learned every horse by name.
        attribute: perception
        talent_choice: [horsemanship, fieldcraft]
        merit_change: 0
      - results: [61, 62, 63]
        name: Three days alone
        description: The survival exercise left you alone in the woods for three days, and you came back first.
        attribute: instinct
        talent_choice: [fieldcraft, iron-nerve]
        merit_change: 1
      - results: [64, 65, 66]
        name: The dismissal list
        description: Your name went on the dismissal list, and you argued your way off it.
        attribute: empathy
        talent_choice: [silver-tongue, iron-nerve]
        merit_change: -1

