        attribute: empathy
        talent_choice: [iron-nerve, steady-voice]
        merit_change: -1
      - results: [61, 62, 63]
        name: The repair drill
        description: In the timed repair drill you found a fault in your gear by feel, with your eyes shut.
        attribute: instinct
        talent_choice: [gearwright, quick-refit]
        merit_change: 0
      - results: [64, 65, 66]
        name: Coaching the course
        description: You coached a struggling squad through the dummy course until every one of them passed.
        attribute: empathy
        talent_choice: [hamstringer, carrying-voice]
        merit_change: 1

  - id: year-3
    name: Third Year, Field Exercises
    performance_attributes: [wits, empathy]
