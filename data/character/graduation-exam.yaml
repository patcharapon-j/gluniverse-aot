# The Graduation Exam: the optional played prologue of three Stages that replaces the
# third Training Year's performance roll. Each Stage rolls D66 for the Trial the class runs
# and the condition it is run under, so no two Exams are the same.
# Source of truth under ADR-0012. docs/rules/02-character-creation.md (section 2.4)
# references this file and renders its tables from it (tools/render/render.py).
id: graduation-exam
name: Graduation Exam
chapter: 02-character-creation
adrs: [ADR-0012, ADR-0024]
decided: [OQ-05, OQ-18, OQ-22, OQ-37]

use:
  optional: true
  decided_by: >-
    the players, before the Lifepath begins, at step campaign-year of
    data/character/lifepath.yaml (group_choices there settles disagreement). A replacement
    character created later decides before rolling their own Lifepath.
  applies_to: >-
    every Cadet being created at the same time; a replacement character created later takes
    the Exam alone
  replaces: the year-3 performance roll (data/character/training-years.yaml)
  keeps: the year-3 event, including its attribute point, Talent level, and merit_change
  timing: after every Cadet has applied their Year 3 event, and before Graduation

conditions:
  titan_engagement: false     # no rounds, turns, Positions, Attention, or Titans
  gas_rolls: false
  blade_sets_counted: false
  circumstances: never   # decision batch 9, 9-2: the Trials are creation, before play (data/core/circumstances.yaml, never)
  exam_issue:
    - item: training ODM Gear
      counts_as: odm-gear
      gear_dice: 1
    - item: training Blade Set
      counts_as: blade-set
      gear_dice: 1
    - item: training medical kit
      counts_as: medical-kit
      gear_dice: 1
    - item: training tool kit
      counts_as: tool-kit
      gear_dice: 1
    - item: a training horse
      counts_as: horse
      gear_dice: 1
    - item: a training musket
      counts_as: musket
      gear_dice: 1
  exam_issue_wear: >-
    Wear from Pushed rolls applies to the exam issue during the Exam and has no effect after
    it. The exam issue is handed back when the Exam ends.
  pools: >-
    Every Trial roll is an attribute roll with the full Chapter 1 pool: attribute, one dice
    Talent that names the entry, Bonus Dice from the squad field exercise's Help and from the
    Trial's condition, Gear Dice from the exam issue item listed for the entry, and Stress
    Dice. A roll can be Pushed only where its Stage's push is true or its condition allows a
    Push; the other Trials forbid a Push by their own rule (Chapter 1, section 1.5). Rule
    Talents that name the entry apply. No Trial roll takes Circumstances (Chapter 1, section
    1.4a).
  requirements_ignored: >-
    Requirements of an entry that need a Titan, a Position, Attention, a Grabbed or Down
    soldier, a patient, a comrade with a Stress Response, or a worn or Jammed item do not
    apply during the Exam. The listed exam issue item always meets the entry's gear
    requirement.
  stress: >-
    Every Cadet starts the Exam at Stress 0. Stress gained during the Exam stays through
    later Trials and adds Stress Dice to their rolls. When the Exam ends, every Cadet's Stress
    returns to 0 (data/core/stress-changes.yaml, row graduation-exam-ends).
  stress_responses: >-
    A Stress Response during the Exam still happens, and the roll cannot be Pushed after it.
    The Exam names its resolution (Chapter 1, section 1.5, Finishing a roll, step 2): it is
    not resolved on the Chapter 3 table, and instead costs the Cadet 1 Merit on the Trial
    whose roll caused it. Nothing else happens. No Chapter 3 result arises during the Exam.
  merit: >-
    The Merit from all three Trials, after any Stress Response costs, is added to the
    Cadet's Merit total in place of the Year 3 performance roll. A Stress Response can make a
    Trial's Merit negative.

# ------------------------------------------------------------------ the exam board
# The three Stages always run in this order, and every Cadet finishes a Stage's Trial before
# the next Stage begins. Which Trial each Stage runs, and the condition it is run under, are
# rolled once for the whole class, not chosen (decision batch 12, 12-2).
order: [individual-assessment, titan-test, squad-field-exercise]

board:
  roll: D66
  rolls: one for each Stage, in the order above
  when: before the Exam's first Trial
  who: >-
    one player, or the GM if the table would rather. The result is the same for every Cadet
    taking the Exam, including a replacement character who takes it alone, and it is not a
    shared choice: group_choices in data/character/lifepath.yaml does not apply to it.
  reads: >-
    The tens die names the Stage's Trial, and the units die names the condition it is run
    under. A Stage's six Trials and the six conditions are listed below.

roll_order_within_a_trial: >-
  Before each Trial, every Cadet taking the Exam rolls a D6. Cadets roll that Trial in
  descending order of result. Cadets tied for the same result roll again among themselves to
  settle their order. The players do not choose the order, and group_choices in
  data/character/lifepath.yaml does not apply to it.

# ------------------------------------------------------------------ the conditions table
conditions_table:
  roll: D6
  applies_to: >-
    every Cadet's roll in that Stage's Trial, for that Stage only. A condition that changes
    the successes the Trial needs changes every bound of its Merit rows by the same amount.
    A condition that does nothing to a Trial, such as taking the Gear Dice from a Trial whose
    entry has no exam issue item, simply has no effect there.
  rows:
    - result: 1
      id: driving-rain
      name: Driving rain
      description: Sheeting rain, a churned yard, and instructors who will not call it off.
      needs_change: 1
    - result: 2
      id: worn-training-gear
      name: Worn training gear
      description: The class before you handed back everything it had, and nothing has been serviced since.
      no_gear_dice: true
    - result: 3
      id: a-fair-run
      name: A fair run
      description: Clear weather, working gear, and an instructor who grades what they see.
    - result: 4
      id: walked-through-it
      name: An instructor walks it with you
      description: An instructor stays at your shoulder the whole way, calling the next move a breath before you need it.
      bonus_dice: 1
    - result: 5
      id: best-of-two
      name: Run it twice, best score
      description: The graders have time for two passes, and a word of correction between them.
      bonus_dice: 1
      extra_pushes: 1
    - result: 6
      id: a-short-course
      name: A short course
      description: Half the class is down with fever, so the graders cut the course to what the hall can run.
      needs_change: -1

# ------------------------------------------------------------------ the three Stages
stages:
  - id: individual-assessment
    order: 1
    name: The individual assessment
    description: >-
      The first Stage is graded alone, in front of the class, on what the Training Corps
      expects of every Cadet whatever they go on to do.
    needs: 2
    push: false     # the Stage's own rule forbids a Push (Chapter 1, section 1.5)
    help: none      # no Help and so no Covering
    merit:          # by the roll's successes; successes_max null means no upper bound
      - {successes_min: 0, successes_max: 1, merit: 0}
      - {successes_min: 2, successes_max: null, merit: 1}
    trials:
      - result: 1
        id: odm-balance-test
        name: The ODM balance test
        description: Hanging from wires in a harness, the Cadet must hold steady and upright while instructors watch.
        entry: fly
        gear_item: training ODM Gear
      - result: 2
        id: the-forced-march
        name: The forced march
        description: A day on the mountain road under full pack, graded on arriving with the column and with your kit on your back.
        entry: endure
        gear_item: null
      - result: 3
        id: the-night-watch
        name: The night watch
        description: Midnight to dawn on the district wall, graded on what you can report when the sun comes up.
        entry: spot
        gear_item: null
      - result: 4
        id: the-written-examination
        name: The written examination
        description: Three hours in the hall on tactics, Titan anatomy, and the regulations, with no notes allowed.
        entry: recall
        gear_item: null
      - result: 5
        id: the-survival-week
        name: The survival week
        description: Seven days in the woods with a knife and a blanket, graded on the state you walk back in.
        entry: survive
        gear_item: null
      - result: 6
        id: the-board-interview
        name: The board interview
        description: Three instructors behind a table who want to hear why the Corps should keep you.
        entry: persuade
        gear_item: null

  - id: titan-test
    order: 2
    name: The Titan test
    description: >-
      The second Stage is graded alone as well, on the one thing the Training Corps exists
      for: what the Cadet does when the shape in front of them is a Titan.
    needs: 2
    push: false
    help: none
    merit:
      - {successes_min: 0, successes_max: 1, merit: 0}
      - {successes_min: 2, successes_max: null, merit: 1}
    trials:
      - result: 1
        id: titan-dummy-course
        name: The Titan dummy course
        description: A timed run through the training forest, cutting the napes of wooden Titans on hidden rails.
        entry: nape-strike
        gear_item: training Blade Set
      - result: 2
        id: the-marksmans-butts
        name: The marksman's butts
        description: Powder, ball, and a painted nape at eighty paces, with the whole class counting your misses.
        entry: shoot
        gear_item: a training musket
      - result: 3
        id: the-grab-drill
        name: The grab drill
        description: An instructor's wooden fist closes around you, and you have until the count of five to be out of it.
        entry: break-free
        gear_item: training Blade Set
      - result: 4
        id: the-decoy-run
        name: The decoy run
        description: A flare, a pole-mounted mask on a cart, and a class watching to see whose eye you can pull.
        entry: break-attention
        gear_item: training ODM Gear
      - result: 5
        id: the-silhouette-drill
        name: The silhouette drill
        description: Boards raised on the range at dusk, to be named by class, height, and gait before they drop again.
        entry: read
        gear_item: null
      - result: 6
        id: the-casualty-drill
        name: The casualty drill
        description: A Cadet playing a soldier cut out of a Titan's hand, bleeding paint, with the clock running.
        entry: treat-injury
        gear_item: training medical kit

  - id: squad-field-exercise
    order: 3
    name: The squad field exercise
    description: >-
      The last Stage is a day-long exercise the Cadets taking the Exam work through as one
      squad, against instructors playing Titans. Each Cadet picks the part they take.
    needs: 3
    push: true
    help: >-
      Every Cadet taking the Exam, other than the roller, qualifies to Help each roll in this
      Stage (Chapter 1, section 1.8). Help given is fixed by this Trial's roll order. The
      Cadet who rolls next in the order Helps the current roller, and the first roller Helps
      the last. Each Cadet Helps exactly one roll, declared before that roll, and that one
      Help is all it spends. A Cadet taking the Exam alone has no Help. No other Help is
      possible in this Stage.
    cover: >-
      Every Cadet who qualifies to Help a roll can Cover its Push, whether or not they Helped
      it (Chapter 1, section 1.5), unless they hold the rolled_state below, which a Cadet
      gains on making their own roll and holds for the rest of the Trial. So only a Cadet
      taking the Exam who has not yet made their own roll in this Trial can Cover. Covering
      spends nothing (Chapter 1, section 1.5).
    rolled_state:
      id: rolled-in-squad-field-exercise
      held_by: a Cadet who has made their own roll in this Trial
      lasts: until this Trial ends
      forbids: [cover]   # Chapter 1, section 1.9 shared hook (OQ-18)
    merit:          # by the roll's successes; needs 3
      - {successes_min: 0, successes_max: 2, merit: 0}
      - {successes_min: 3, successes_max: null, merit: 1}
    squad_bonus: none   # each Cadet's Merit depends only on their own rolls (OQ-22)
    trials:
      - result: 1
        id: the-squad-field-exercise
        name: The squad field exercise
        description: The set piece, with instructors in Titan harness working a wooded valley and a squad ordered to cross it.
        entry_choice:
          - {entry: read, gear_item: null}
          - {entry: break-attention, gear_item: training ODM Gear}
          - {entry: body-part-strike, gear_item: training Blade Set}
          - {entry: treat-injury, gear_item: training medical kit}
          - {entry: field-repair, gear_item: training tool kit}
          - {entry: rally, gear_item: null}
      - result: 2
        id: the-forest-crossing
        name: The forest crossing
        description: Cross the training forest in formation without one instructor's whistle finding you.
        entry_choice:
          - {entry: fly, gear_item: training ODM Gear}
          - {entry: sneak, gear_item: null}
          - {entry: spot, gear_item: null}
          - {entry: read, gear_item: null}
          - {entry: rally, gear_item: null}
          - {entry: field-repair, gear_item: training tool kit}
      - result: 3
        id: the-night-withdrawal
        name: The night withdrawal
        description: Bring a squad of painted casualties back to the beacon line before the graders call dawn.
        entry_choice:
          - {entry: treat-injury, gear_item: training medical kit}
          - {entry: heave, gear_item: null}
          - {entry: survive, gear_item: null}
          - {entry: rally, gear_item: null}
          - {entry: ride, gear_item: a training horse}
          - {entry: spot, gear_item: null}
      - result: 4
        id: the-relief-of-the-gate
        name: The relief of the gate
        description: Hold the mock gate against instructors in Titan harness until the relief column rides in.
        entry_choice:
          - {entry: nape-strike, gear_item: training Blade Set}
          - {entry: break-attention, gear_item: training ODM Gear}
          - {entry: fight, gear_item: training Blade Set}
          - {entry: endure, gear_item: null}
          - {entry: rally, gear_item: null}
          - {entry: treat-injury, gear_item: training medical kit}
      - result: 5
        id: the-supply-run
        name: The supply run
        description: Take the wagons the length of the course and bring them back with the load still on them.
        entry_choice:
          - {entry: ride, gear_item: a training horse}
          - {entry: field-repair, gear_item: training tool kit}
          - {entry: heave, gear_item: null}
          - {entry: persuade, gear_item: null}
          - {entry: spot, gear_item: null}
          - {entry: rally, gear_item: null}
      - result: 6
        id: the-ruined-exercise
        name: The ruined exercise
        description: The graders break the exercise on purpose, with jammed gear, contradicting orders, and a squad leader ruled dead in the first hour.
        entry_choice:
          - {entry: rally, gear_item: null}
          - {entry: persuade, gear_item: null}
          - {entry: field-repair, gear_item: training tool kit}
          - {entry: treat-injury, gear_item: training medical kit}
          - {entry: read, gear_item: null}
          - {entry: survive, gear_item: null}
