# The Action Catalog: every named action and roll a Talent can name, and the procedure for
# actions that are not in it.
# Source of truth under ADR-0012. docs/rules/02-character-creation.md (sections 2.8 and 2.9)
# references this file and renders its tables from it (tools/render/render.py).
# Entries owned by later chapters are defined here only as far as a Talent needs to name them
# and a pool needs to be built. The owning chapter gives the procedure and the full effect.
id: action-catalog
name: Action Catalog
chapter: 02-character-creation
adrs: [ADR-0006, ADR-0010, ADR-0015, ADR-0018, ADR-0019, ADR-0024]
decided: [OQ-11, OQ-25, OQ-26, OQ-27, OQ-33, OQ-35, OQ-141, OQ-142, OQ-143, OQ-146, OQ-176, OQ-179, OQ-191]

# kind:
#   action      Taken as a soldier's action in a Titan Engagement or a Skirmish (Chapter 1,
#               section 1.9; Chapter 7, section 7.4).
#   reaction    Made when a Titan or a Foe acts against the soldier, outside the soldier's own
#               turn; spends a turn (Chapter 1, section 1.9). Not an action.
#   roll        An attribute roll made when a rule calls for it, or, for an entry whose rolled is
#               when_called, when the GM calls one. Not an action, and it spends no turn of its own.
#   option      A use of another entry or rule, such as spending a Read's successes. Not an
#               action and not a roll. It spends nothing of its own unless its notes or its
#               calling rule say so.
#   fixed-roll  A roll that is not an attribute roll (Chapter 1, section 1.3). It never gains
#               Talent dice; only rule Talents can name it.
# rolled:
#   when_taken         Rolled every time the entry is taken or made.
#   when_a_rule_calls  Rolled only when the owning rule calls for it.
#   when_called        Rolled when a rule calls for it, or when the GM calls a roll for an act this
#                      entry fits (Chapter 1, section 1.1; uncatalogued_actions below; decision
#                      batch 9, 9-12). Nine entries: spot, size-up, survive, persuade, endure,
#                      sneak, recall, ride, and fly.
#   never              Never rolled.
# gear: the gear items that can supply Gear Dice (Chapter 1, section 1.3, step 6). Items are
#   defined in Chapter 4.
# requires_gear, without_gear: whether the entry needs one of its gear items, and what
#   happens without one. gear_requirement below is the rule; it applies to every use of the
#   entry (section 2.8).
# dormant: true if no rule in the current chapters calls for the entry. The later rule that
#   calls for it may change its attribute. A Talent that names only dormant or reserved
#   entries does nothing until then.
# reserved: true if the entry exists for Foes or Titans that later rules add.
#   Since decision batch 7 (7-14, 7-16, 7-17) Chapter 7 calls for every entry that was dormant or
#   reserved, so no entry carries either field. Both stay in the format for entries later rules add.
# changes: the tracked values (listed under tracked_values) the entry can change, used by
#   the procedure for actions outside the Catalog as its default order and as an index, not a
#   gate (ADR-0024, limit 12).
# help_outside_titan_engagement: the Help requirement Chapter 1, section 1.8 (OQ-08), asks
#   every rule that calls for a roll outside a Titan Engagement to state.

# Gear an entry needs (section 2.8). This applies every time an entry is taken, made, or
# called for, whether the soldier names it directly or reaches it through the procedure for
# actions outside the Catalog, and whether the soldier is a player character or a Squadmate.
gear_requirement:
  applies_when: >-
    The entry has requires_gear true and the soldier has none of its gear items. An item
    worn down to 0 counts as not had (Chapter 1, section 1.3, step 6; for ODM Gear, a Jam),
    and so does an item in any other state a Chapter 4 rule names as counting as not had.
  attribute_alone: >-
    The roll uses the entry's attribute with no Talent dice and no Gear Dice. Everything else
    about the entry still applies. A rule Talent can change this only by naming it (Make Do).
  not_possible: The entry cannot be taken, made, or used.
  other_entries: >-
    An entry with requires_gear false and no gear item available is rolled without Gear Dice
    (Chapter 1, section 1.3, step 6).

# The values an action outside the Catalog can be meant to change: an index of what soldiers change
# by acting, kept for Talents, the Foundry system, and the menu of effects an improvised act in a
# fight can take (uncatalogued_actions, in_a_fight). It is no longer a gate (ADR-0024, limit 12;
# decision batch 9, 9-12). A later chapter whose rule creates a new value that soldiers change by
# acting adds a row here, or creates it as a rule-named-value.
tracked_values:
  - {id: stress-raise, name: raise a soldier's Stress, rules: [01-core-rules]}
  - {id: stress-response-clear, name: "end a Stress Response, or a pending Fear Roll result (a forced step or a forced strike not yet made)", rules: [03-harm-and-mind]}
  - {id: health-restore, name: restore Health, rules: [03-harm-and-mind]}
  - {id: critical-injury-treat, name: treat or stabilize a Critical Injury, rules: [03-harm-and-mind]}
  - {id: down-end, name: end the Down state, rules: [03-harm-and-mind]}
  - {id: grabbed-end, name: free a Grabbed soldier, rules: [05-titan-engagement]}
  - {id: momentum-gain, name: gain Momentum, rules: [05-titan-engagement]}
  - {id: anchor-wreck, name: take a zone's Anchor Rating one step toward Open, rules: [05-titan-engagement]}
  - {id: gear-restore, name: restore a gear item's Gear Dice rating or end a Jam, rules: [04-gear]}
  - {id: gas-restore, name: restore a Gas Rating, rules: [04-gear]}
  - {id: comrade-carry, name: "pick up and carry a Down comrade, or one the both-legs grade forbids to move", rules: [04-gear, 05-titan-engagement]}
  - {id: item-give, name: give a carried item to a comrade, rules: [04-gear]}
  - {id: item-take, name: take an item from a Down comrade or from where a dead comrade's items lie, rules: [04-gear]}
  - {id: mount-change, name: mount or dismount a horse, rules: [04-gear, 05-titan-engagement]}
  - {id: blade-set-swap, name: fit a carried Blade Set into empty handles, rules: [04-gear]}
  - {id: load-shed, name: "drop a carried item, set down a carried comrade, or stop being carried", rules: [04-gear]}
  - {id: attention-shift, name: shift a Focus Titan's Attention onto a decoy and raise its decoys in a row, rules: [05-titan-engagement]}
  - {id: draw-attention-set, name: become the loudest or brightest stimulus on the Attention Ladder, rules: [05-titan-engagement]}
  - {id: toughness-add, name: add successes toward a Body Part's Toughness, rules: [05-titan-engagement]}
  - {id: body-part-worsen, name: move a Body Part toward Broken, rules: [05-titan-engagement]}
  - {id: openings-create, name: create Openings, rules: [05-titan-engagement]}
  - {id: titan-kill, name: kill a Titan, rules: [05-titan-engagement]}
  - {id: titan-facts-reveal, name: learn a fact about a Titan such as its Next Behavior, rules: [05-titan-engagement]}
  - {id: reaction-dice-add, name: add dice to a comrade's Reaction, rules: [05-titan-engagement]}
  - {id: initiative-swap, name: exchange initiative cards with a comrade, rules: [05-titan-engagement]}
  - {id: squad-tactic-use, name: use a Squad Tactic, rules: [05-titan-engagement]}
  - {id: roll-dice-add, name: add a die to a comrade's roll, rules: [01-core-rules]}
  - {id: behavior-avoid, name: avoid a behavior or attack aimed at oneself, rules: [01-core-rules, 05-titan-engagement, 07-playtest-rules]}
  - {id: position-change, name: "change Position, or become Engaged with or Apart from a Foe in a Skirmish", rules: [05-titan-engagement, 07-playtest-rules], changed_by: "a move, not a Catalog entry"}
  # Decision batch 8, 8-9 (ADR-0024, limit 12; OQ-146): the falling Titan's values.
  - {id: pinned, name: "get out from under a falling Titan's body, or free a soldier it pins", rules: [05-titan-engagement]}
  - {id: heave-count, name: add successes toward the Heave rating of a body that pins a soldier, rules: [05-titan-engagement]}
  # Chapter 7, the playtest rules (decision batch 7; ADR-0024, limit 12). Each is changed only
  # by the entries whose calling rule reads it.
  - {id: leg-outcome, name: "settle what a Leg costs in rations and how its hazard roll is adjusted", rules: [07-playtest-rules]}
  - {id: camp-outcome, name: "settle whether a Night Camp gives Camp Relief and how its night hazard roll is adjusted", rules: [07-playtest-rules]}
  - {id: hazard-outcome, name: "escape the harm a hazard row names for the soldier who rolls against it", rules: [07-playtest-rules]}
  - {id: requisition-grant, name: have Command grant a Requisition, rules: [07-playtest-rules]}
  - {id: ledger-lower, name: lower the ledger for the Squad this Downtime, rules: [07-playtest-rules]}
  - {id: foe-harm, name: deal damage to a Foe, rules: [07-playtest-rules]}
  - {id: held-set, name: hold a Foe with a Grapple, rules: [07-playtest-rules]}
  - {id: held-end, name: "end a hold: break free while Held, or let go of a Foe the soldier holds", rules: [07-playtest-rules]}
  - {id: firearm-load, name: load an empty firearm, rules: [07-playtest-rules, 04-gear]}
  - {id: foe-yield, name: make a Foe group yield, rules: [07-playtest-rules]}
  - {id: foe-intent-reveal, name: "learn a Foe group's Grit, how many more of it must fall before it breaks, and what each of its Foes does on its next card", rules: [07-playtest-rules]}
  - {id: ambush-set, name: give the Squad the ambush against a Foe group, rules: [07-playtest-rules]}
  # Decision batch 8, 8-28 (OQ-153, item d): Downtime Actions and the Squad Action are acts.
  - {id: stress-lower, name: "lower a soldier's Stress in Downtime", rules: [07-playtest-rules]}
  - {id: grief-lower, name: "lower a soldier's Grief in Downtime", rules: [07-playtest-rules]}
  - {id: squad-recruit, name: bring a new Squadmate into the Squad Pool, rules: [07-playtest-rules]}
  - {id: rule-named-value, name: "change a clock, counter, or obstacle that a rule creates and for which that rule names an attribute roll", rules: [the rule that creates the value], changed_by: "the attribute roll its creating rule names, made with the attribute alone, when no Catalog entry changes it"}

entries:
  # ------------------------------------------------ Titan Engagement actions (Chapter 5)
  - id: nape-strike
    name: Nape strike
    kind: action
    rolled: when_taken
    attribute: strength
    gear: [blade-set]
    requires_gear: true
    without_gear: not_possible
    context: titan-engagement
    requirements: >-
      The soldier holds Blind Spot and does not hold the struck Titan's Attention
      (ADR-0010). The soldier is not Grabbed. In a Titan Engagement, the soldier's ODM Gear counts
      as had: not Jammed, and with a Gas Rating above 0 (data/gear/odm-gear.yaml, strikes), unless
      the Titan is grounded (data/engagement/titan-harm.yaml, grounded). No retreat is under way
      (data/engagement/background-titans.yaml, retreat, actions). Making the strike counts as
      hooking into the Titan.
    notes: >-
      Making the strike counts as hooking into the Titan for the Attention Ladder only: it sets the
      hooked-by-strike flag (data/engagement/attention.yaml, flags), the striker's Position does not
      change, and they are still at Blind Spot (data/engagement/positions.yaml, changes_to_position,
      not_changed_by). Because this entry requires that the soldier does not hold the struck Titan's
      Attention, a striker who draws that Attention onto themselves cannot strike again until the
      Attention moves: by a comrade's Draw Attention, by a decoy, or by the Titan retargeting to
      someone it can reach (data/engagement/attention.yaml, evaluation, retargeting; decision batch
      13, 13-7 and 13-9; OQ-191, OQ-192).
    needs: the struck Titan's Nape Depth
    changes: [titan-kill, openings-create]
    help_outside_titan_engagement: not taken outside a Titan Engagement
    rules: [05-titan-engagement, 04-gear]
    decided: [OQ-60, OQ-191]
    adrs: [ADR-0007, ADR-0010]

  - id: body-part-strike
    name: Body Part strike
    kind: action
    rolled: when_taken
    attribute: strength
    gear: [blade-set]
    requires_gear: true
    without_gear: not_possible
    context: titan-engagement
    requirements: >-
      The Position and state requirements in data/engagement/titan-harm.yaml (body_part_strikes)
      and data/engagement/grab.yaml (escapes). In a Titan Engagement, a strike made from On Body or
      Blind Spot also needs the soldier's ODM Gear to count as had (data/gear/odm-gear.yaml,
      strikes), unless the Titan is grounded.
    needs: 1; successes add up toward the Body Part's Toughness (data/engagement/titan-harm.yaml)
    changes: [toughness-add, body-part-worsen, openings-create, grabbed-end, pinned]
    notes: >-
      Striking the hand that holds a Grabbed soldier is a Body Part strike (Chapter 5, ADR-0019). So is cutting
      the Body Part that pins a soldier, which frees them when it becomes Broken (data/engagement/titan-harm.yaml,
      falling_titan, cut_free; decision batch 8, 8-17).
    help_outside_titan_engagement: not taken outside a Titan Engagement
    rules: [05-titan-engagement, 04-gear]
    decided: [OQ-60]
    adrs: [ADR-0007]

  - id: break-attention
    name: Break Attention
    kind: action
    rolled: when_taken
    attribute: perception
    gear: [odm-gear, horse]
    requires_gear: false
    context: titan-engagement
    requirements: data/engagement/attention.yaml (break_attention)
    needs: 1 for the soldier holding the Titan's Attention, otherwise 2, and 2 against a Titan holding a Grabbed soldier; 1 more for a Feint; plus 1 for each decoy the Titan has fallen for since its last card that resolved a behavior; extra successes create Openings (data/engagement/attention.yaml, break_attention, needs_rule)
    changes: [attention-shift, openings-create, grabbed-end]
    notes: Against a Titan holding a Grabbed soldier, a success frees them (data/engagement/grab.yaml)
    help_outside_titan_engagement: not taken outside a Titan Engagement
    rules: [05-titan-engagement]
    decided: [OQ-81, OQ-90]
    adrs: [ADR-0010]

  - id: draw-attention
    name: Draw Attention
    kind: action
    rolled: never
    attribute: null
    gear: []
    requires_gear: false
    context: titan-engagement
    requirements: data/engagement/attention.yaml (draw_attention)
    changes: [draw-attention-set]
    notes: >-
      Not from Distant (decision batch 5, OQ-113). Sets the loudest flag, which lasts until the end
      of the Titan's next card that resolves a behavior; a card that resolves nothing, under a
      decoy's hold, while the Titan holds a Grabbed soldier, or with no one holding its Attention,
      leaves it standing (ADR-0024, limit 2, as first amended in decision batch 3e;
      data/engagement/attention.yaml, flag_duration). While a soldier holds the flag they match
      every ladder rung any other candidate meets except hooked into its body, so the shout takes
      the Titan off any comrade who is not hooked in or On Body (decision batch 10, OQ-184;
      data/engagement/attention.yaml, flags, loudest, matches). It spends the soldier's action;
      Shout Them Off lets the soldier spend their move instead
      (data/character/talents.yaml, shout-them-off).
    rules: [05-titan-engagement]
    adrs: [ADR-0024]
    decided: [OQ-113, OQ-184]

  - id: read
    name: Read
    kind: action
    rolled: when_taken
    attribute: instinct
    gear: []
    requires_gear: false
    context: titan-engagement
    requirements: data/engagement/read.yaml (read)
    needs: 1; each success reveals one fact or pays toward Call It (data/engagement/read.yaml, facts, call_it)
    changes: [titan-facts-reveal]
    help_outside_titan_engagement: not taken outside a Titan Engagement
    rules: [05-titan-engagement]

  - id: call-it
    name: Call It
    kind: option
    option_of: read
    rolled: never
    attribute: null
    gear: []
    context: titan-engagement
    requirements: Spends successes from a Read (data/engagement/read.yaml, call_it)
    changes: [reaction-dice-add]
    rules: [05-titan-engagement]

  - id: break-free
    name: Break Free
    kind: action
    rolled: when_taken
    attribute: strength
    gear: [blade-set]
    requires_gear: false
    context: any
    requirements: >-
      In a Titan Engagement, the soldier is Grabbed and not Down, or holds Pry Loose
      (data/engagement/grab.yaml, escapes). In a Skirmish, the soldier is Held and not Down
      (Chapter 7, section 7.4). It is taken nowhere else.
    needs: >-
      2, with a 2-die penalty once lifted (data/engagement/grab.yaml, escapes); 2 while Held in a
      Skirmish (Chapter 7, section 7.4)
    changes: [grabbed-end, held-end]
    help_outside_titan_engagement: >-
      In a Skirmish, up to three comrades taking part who are not Down may Help, each spending their
      action, whether Engaged or Apart (Chapter 7, section 7.4). Not taken outside a Titan
      Engagement or a Skirmish.
    rules: [05-titan-engagement, 07-playtest-rules]
    decided: [OQ-143]
    adrs: [ADR-0015, ADR-0018, ADR-0019]

  - id: swap-initiative-card
    name: Swap Initiative Card
    kind: option
    option_of: the swap step of a round in a Titan Engagement (data/engagement/round.yaml, round_steps, swap)
    rolled: never
    attribute: null
    gear: []
    context: titan-engagement
    requirements: data/engagement/round.yaml (swapping)
    changes: [initiative-swap]
    notes: Not an action, and spends neither the move nor the action (data/engagement/round.yaml, swapping).
    rules: [05-titan-engagement]

  - id: squad-tactic
    name: Squad Tactic
    kind: option
    option_of: a Squad Tactic the Squad holds (data/engagement/squad-tactics.yaml, rules, held)
    rolled: never
    attribute: null
    gear: []
    context: titan-engagement
    requirements: data/engagement/squad-tactics.yaml (rules, tactics)
    changes: [squad-tactic-use]
    rules: [05-titan-engagement]

  - id: lift-comrade
    name: Lift Comrade
    kind: action
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: >-
      data/gear/carrying.yaml (lifting_a_comrade), in and out of a Titan Engagement. In one, a comrade who
      is Down, or who is not Down, consents, and whom the both-legs grade forbids to move, is in the
      soldier's zone and is not Grabbed, Pinned, or already carried; and the soldier is not Down,
      carries no other comrade, and is not carried (decision batch 8, 8-11 and 8-18).
    changes: [comrade-carry]
    rules: [04-gear, 05-titan-engagement]
    decided: [OQ-64, OQ-137, OQ-146]

  - id: heave
    name: Heave
    kind: action
    rolled: when_taken
    attribute: strength
    gear: []
    requires_gear: false
    context: titan-engagement
    requirements: >-
      data/engagement/titan-harm.yaml (falling_titan, heave): the soldier holds In Reach or On Body
      relative to a body that pins at least one soldier, and is not Down, Grabbed, carried, or
      body-pinned. A limb-pinned soldier may Heave the body that pins them.
    needs: 1; each success adds 1 to the body's heave count, and at its Heave rating every soldier the body pins is freed (data/engagement/titan-harm.yaml, falling_titan, heave)
    changes: [heave-count, pinned]
    notes: Against a corpse the heaver takes 1 Burn damage after the roll, whatever its result (data/engagement/titan-harm.yaml, falling_titan, corpse_heat).
    help_outside_titan_engagement: not taken outside a Titan Engagement
    rules: [05-titan-engagement]
    decided: [OQ-146]
    adrs: [ADR-0024]

  - id: change-canister
    name: Change Canister
    kind: action
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: The soldier carries a spare gas canister. data/gear/odm-gear.yaml (change_canister) states what changing it spends.
    changes: [gas-restore]
    rules: [04-gear]

  - id: pass-item
    name: Pass Item
    kind: action
    rolled: never
    attribute: null
    gear: []
    requires_gear: false
    context: any
    requirements: >-
      In a Titan Engagement, the passer is not Down, and the receiver is a living comrade in the
      passer's zone; the receiver may be Down or Grabbed. Outside a Titan
      Engagement, data/gear/carrying.yaml (passing_items) sets the requirement.
    changes: [item-give]
    notes: data/gear/carrying.yaml (passing_items) lists which items can be passed and what passing spends.
    rules: [04-gear]
    adrs: [ADR-0024]
    decided: [OQ-35, OQ-60, OQ-65]

  - id: take-item
    name: Take Item
    kind: action
    rolled: never
    attribute: null
    gear: []
    requires_gear: false
    context: any
    requirements: >-
      In a Titan Engagement, the taker is not Down, and either a Down comrade who is not Grabbed is
      in the taker's zone, or a dead comrade's left items lie in that zone (data/gear/carrying.yaml,
      leaving_play, death, where_left).
      Outside a Titan Engagement, data/gear/carrying.yaml (taking_items) sets the requirement.
    changes: [item-take]
    notes: data/gear/carrying.yaml (taking_items) lists which items can be taken and what taking spends.
    rules: [04-gear]
    adrs: [ADR-0024]
    decided: [OQ-60, OQ-61, OQ-65, OQ-68]

  - id: mount-or-dismount
    name: Mount or Dismount
    kind: option
    option_of: a move in a Titan Engagement; outside one, the procedure under way, or no procedure when none is under way (data/gear/horses.yaml, mounted, outside_titan_engagement)
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: data/gear/horses.yaml (mounted).
    changes: [mount-change]
    notes: Part of a move in a Titan Engagement, never an action (OQ-35).
    rules: [04-gear, 05-titan-engagement]
    decided: [OQ-35, OQ-61]

  - id: swap-blade-set
    name: Swap Blade Set
    kind: option
    option_of: the soldier's own turn in a Titan Engagement; outside one, no turn (data/gear/blade-sets.yaml, swap)
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: data/gear/blade-sets.yaml (swap).
    changes: [blade-set-swap]
    notes: >-
      In a Titan Engagement it spends the soldier's move and never the action (decision batch 10,
      OQ-185; data/gear/blade-sets.yaml, swap). Outside one it spends nothing.
    rules: [04-gear]
    decided: [OQ-63, OQ-185]

  - id: shed-load
    name: Shed Load
    kind: option
    option_of: the soldier's own turn in a Titan Engagement; outside one, no turn (data/gear/carrying.yaml, shedding)
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: data/gear/carrying.yaml (shedding).
    changes: [load-shed]
    notes: Spends neither the move nor the action.
    rules: [04-gear]
    decided: [OQ-64]

  - id: restock-medical-kit
    name: Restock Medical Kit
    kind: option
    option_of: a care window (data/harm/treat-injury.yaml, care_windows)
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: data/gear/squad-supply.yaml (medical_uses, restock-kit).
    changes: [gear-restore]
    notes: Spends 1 medical unit of Squad Supply, and no roll.
    rules: [04-gear, 03-harm-and-mind]
    decided: [OQ-67]

  # ------------------------------------------------ Core actions and options (Chapter 1)
  - id: help
    name: Help
    kind: action
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: Chapter 1, section 1.8.
    changes: [roll-dice-add]
    notes: >-
      Outside a Titan Engagement, Help is allowed only where the rule that calls for the roll allows it
      (OQ-08), and on a called roll outside a Skirmish as the GM rules, in a Skirmish as the
      Skirmish's Help (Chapter 1, section 1.8; Chapter 7, section 7.4; decision batch 9, 9-12 and
      9-42).
    rules: [01-core-rules]

  - id: cover
    name: Cover
    kind: option
    option_of: a comrade's Push
    rolled: never
    attribute: null
    gear: []
    context: any
    requirements: Chapter 1, section 1.5 (Covering).
    changes: [stress-raise]
    rules: [01-core-rules]

  # ------------------------------------------------ Reactions (Chapters 1 and 5)
  - id: dodge
    name: Dodge
    kind: reaction
    rolled: when_taken
    attribute: agility
    gear: [odm-gear, horse]   # the horse only while mounted (Chapter 4); ADR-0019 (OQ-25)
    requires_gear: false
    context: any
    requirements: >-
      Chapter 1, section 1.9. In a Titan Engagement, against a Titan's behavior. In a Skirmish,
      against a Foe's Fight attack or shot, and never while Held (Chapter 7, section 7.4).
    needs: >-
      none of its own: each success cancels one of the attack's successes, and the attack lands on
      1 or more Net Successes (Chapter 1, section 1.9, Attack and Reaction). Against a Titan the
