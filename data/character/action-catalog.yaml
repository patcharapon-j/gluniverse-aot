# Section 2.9: actions that are not in the Catalog (ADR-0003, item 9). Follow the steps in order.
uncatalogued_actions:
  steps:
    - id: name-the-change
      text: >-
        The player names the one tracked value (tracked_values above) the action is meant to
        change. The description of the action never limits which value the player names; the
        named value alone decides which entries can be used. If it is meant to change none of
        them, the action needs no roll and has no mechanical effect; stop here.
    - id: moves
      text: >-
        If the value is position-change, the action is a move, resolved by Chapter 5; stop here.
    - id: match
      text: >-
        List every entry whose changes include that value. The soldier must meet an entry's
        requirements to use it. If the soldier meets the requirements of at least one listed
        entry, the player picks one of those entries. The action is that entry for every
        purpose: its kind, attribute, gear items, needs, effect, cost, and every Talent that
        names it (Chapter 1, section 1.3).
    - id: without-gear
      text: >-
        Apply gear_requirement (above) to the picked entry, as for any entry. An entry that is
        not_possible for the soldier cannot be used.
    - id: no-match
      text: >-
        If no listed entry can be used and the value is a rule-named-value, make the attribute
        roll its creating rule names, using the attribute alone (rolls_called_by_attribute).
        Otherwise the action cannot change that value. It needs no roll and has no mechanical
        effect.
  rolls_called_by_attribute: >-
    A rule that calls for an attribute roll without naming a Catalog entry calls for that
    attribute alone: no Talent dice, and Gear Dice only from a gear item that rule names.
    Every other pool step in Chapter 1, section 1.3, applies, and the rule states its Help
    requirement (Chapter 1, section 1.8).
  gm_rulings: >-
    The GM does not decide whether an action is possible, which entry it uses, or what it
    changes. The steps above decide. What a soldier does that changes no tracked value is
    described freely and has no mechanical effect.
