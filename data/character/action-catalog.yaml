      A player character, once per Downtime (data/campaign/downtime.yaml, downtime_actions, who). The
      player names one row of downtime_actions: Recover, Visit Haven, Requisition, or Maintain Gear.
    changes: [stress-lower, grief-lower, gear-restore, gas-restore, requisition-grant]
    notes: >-
      The rows are kept in data/campaign/downtime.yaml, as Break Attention's decoys are kept in
      data/engagement/attention.yaml. Requisition spends the Downtime Action on a persuade or recall roll,
      or on Help to one. The Squadmate relief is a result of the procedure, not this option.
    rules: [07-playtest-rules]
    decided: [OQ-153]
