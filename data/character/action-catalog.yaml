# Section 2.9: actions that are not in the Catalog (ADR-0024, limits 9 and 12; decision batch 9, 9-1,
# 9-8, 9-12). Outside a fight, the steps are the default order for an action meant to change a tracked
# value (9-27). An action
# they do not resolve goes to no_value_or_no_match, and in a fight to in_a_fight.
uncatalogued_actions:
  # decision batch 9, 9-27
  where: >-
    Outside a Titan Engagement and a Skirmish. In a fight the steps are not used, and in_a_fight
    applies.
  steps:
    - id: name-the-change
      text: >-
        The player names the one tracked value (tracked_values above) the action is meant to
        change. The description of the action never limits which value the player names; the
        named value alone decides which entries can be used. If it is meant to change none of
        them, the GM rules on it (no_value_or_no_match); stop here.
    - id: moves
      text: >-
        If the value is position-change, the action is a move, resolved by Chapter 5; stop here.
    - id: match
      text: >-
        List every entry whose changes include that value. The soldier must meet an entry's
        requirements to use it. If the soldier meets the requirements of at least one listed
        entry, the player picks one of those entries. The action is that entry for every
        purpose: its kind, attribute, gear items, needs, effect, cost, and every Talent that
        names it (Chapter 1, section 1.3).
    - id: without-gear
      text: >-
        Apply gear_requirement (above) to the picked entry, as for any entry. An entry that is
        not_possible for the soldier cannot be used.
    - id: no-match
      text: >-
        If no listed entry can be used and the value is a rule-named-value, make the attribute
        roll its creating rule names, using the attribute alone (rolls_called_by_attribute).
        Otherwise the steps cannot change that value, and the GM rules on the action
        (no_value_or_no_match).
  no_value_or_no_match: >-
    An action meant to change no tracked value, or one that step no-match leaves unresolved, is a
    ruling under Chapter 1, section 1.1, made before anyone rolls. In a Titan Engagement or a
    Skirmish, in_a_fight applies. Anywhere else the GM says that it happens with no roll, that it
    cannot be done, or that it is a called roll. For a called roll the GM names, before the pool is
    built: the Catalog entry closest to the act, from the entries whose rolled is when_called, or an
    attribute alone if none fits (rolls_called_by_attribute); its Circumstances (Chapter 1, section
    1.4a), Standard if the GM names none; and its stakes, what failure costs from the menu in
    Chapter 1, section 1.1, item 2, and, where it is not obvious, what success gives
    (data/core/dice-pool.yaml, called_roll, success_gives; never a gear item). A called roll
    needs 1 success. It is made for the named entry for every purpose that follows: the entry's
    attribute and gear items, gear_requirement, and every Talent that names the entry. It can be
    Pushed and Covered, and Help on it is as the GM rules (Chapter 1, section 1.8). Once the dice
    are rolled, the entry, the Circumstances, and the stakes do not change, and the result stands.
  in_a_fight: >-
    In a Titan Engagement or a Skirmish the steps are not used. A soldier's action is Help, a
    Catalog entry the soldier names and takes as it is written, or an improvised act: an act the
    soldier describes that is not an entry taken as written, even when a tracked value it would
    change matches an entry (decision batch 9, 9-8 and 9-27). Whether a described act is an entry
    taken as written is part of the GM's ruling on its model entry. When no entry of kind action the
    soldier could take in that fight has an effect the act imitates, and the act would change nothing
    the fight tracks (no value in tracked_values, no Position, Engaged or Apart, Attention, Opening,
    card, clock, or Foe value), it is a called roll (data/core/dice-pool.yaml, called_roll,
    in_a_fight): it spends the action, Help on it is the fight's, and it never gives an effect an
    entry has (decision batch 9, 9-36). If it would change nothing, it
    is described and needs no roll; if the
    GM judges that it cannot be done, the GM says so before anyone rolls (Chapter 1, section 1.1,
    item 1). When an entry of kind action the soldier could take in that fight can model it, before the
    pool is built, the GM names its model entry: the one existing
    entry whose effect the act imitates, with tracked_values above as the menu of effects. A model
    entry is an entry of kind action that the soldier could take in that fight: in a Titan
    Engagement, one whose context is titan-engagement or any; in a Skirmish, one Chapter 7, section
    7.4, allows. It is never an entry of kind reaction, roll, fixed-roll, or option. That
    ruling stands. The act spends the soldier's action. It is made as the model entry is made:
    rolled only if that entry is rolled, with its attribute, gear items, Talents, and needs, and with
    Circumstances as any roll. It meets every requirement and restriction of the model entry (the
    soldier holding a Titan's Attention still cannot strike its Nape; a Feint keeps its Position
    rule; a Foe's Guard still rolls). On a success it produces only the model entry's effect, at
    that entry's size. It never kills a Titan; never changes Nape Depth, Toughness, Attack Dice, or
    a card; never cancels or delays a card; never creates more Openings than the model entry could;
    and never gives an effect that no entry has. Only a Nape strike taken as its entry is written
    kills a Titan; an act modelled on the Nape strike never does. An act modelled on the Nape strike
    is resolved as a Nape strike that falls short, whatever its successes: each success creates 1
    Opening, Relentless adds 1 more on at least 1 success, the act sets the hooked-by-strike flag, and
    successes that reach the Titan's Nape Depth create their
    Openings and nothing else (data/engagement/titan-harm.yaml, nape_strikes, modelled; decision
    batch 9, 9-39). Examples: a supply wagon cut loose
    to roll past a Titan is Break Attention, with its needs; a swung lantern is Draw Attention, never
    from Distant; a chimney dropped on a Titan's leg is a Body Part strike whose successes count
    toward that leg's Toughness; a rope thrown to a comrade is Help or Lift Comrade; an object that
    is not a gear item, hurled at a person, is a Shoot at damage 1 and Crush, with no Gear Dice
    (data/skirmish/skirmish.yaml, improvised_act and weapons). A dive behind a chimney stack is a
    move if it changes the soldier's zone or attachment, and otherwise changes nothing and needs no
    roll; it is never modelled on the dodge and gives no Circumstances to a later dodge, since zones
    and attachments already price where a soldier stands (decision batch 9, 9-27).
  # decision batch 9, 9-24 (OQ-176): the called-roll sentences.
  rolls_called_by_attribute: >-
    A rule that calls for an attribute roll without naming a Catalog entry calls for that
    attribute alone: no Talent dice, and Gear Dice only from a gear item that rule names.
    Every other pool step in Chapter 1, section 1.3, applies, and the rule states its Help
    requirement (Chapter 1, section 1.8). A called roll made with an attribute alone is built the
    same way, with Help as the GM rules outside a fight and as the fight's Help in one (Chapter 1,
    section 1.8; decision batch 9, 9-42). A ruling is not a rule that names a gear item, so a called
    roll made with an attribute alone takes no Gear Dice: a gear item or other object that helps
    counts toward its Circumstances (data/gear/items.yaml, other_objects) and, giving no Gear Dice,
    cannot be worn by a Push on it. A called roll the GM names for `fly` or `ride` takes that entry's
    Gear Dice (decision batch 9, 9-24).
  gm_rulings: >-
    The GM rules, before the dice: whether an action the steps do not resolve happens, cannot be
    done, or is a called roll, and a called roll's entry or attribute, Circumstances, and stakes
    (no_value_or_no_match); and, in a fight, whether a described act is an entry taken as written,
    an improvised act with its model entry, or a called roll (in_a_fight)
    (ADR-0024, limits 9 and 12; decision batch 9, 9-1, 9-8, 9-12). The GM applies as written: the
    steps, outside a fight, as the default order for an action meant to change a tracked value; the entry the player
    picks at step match; gear_requirement; the rule that a Talent adds dice only to a roll made for
    an entry it names; and every roll's needs, which no ruling raises or lowers. Everything else the
    GM applies as written is the list in Chapter 1, section 1.1, item 6.
