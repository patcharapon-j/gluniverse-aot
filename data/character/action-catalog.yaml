      per Downtime (Chapter 7, section 7.3). A roll another rule calls for states its own.
      On a called roll outside a Skirmish, up to three comrades who are present and able to help
      concretely may Help, as the GM rules; in a Skirmish, Help on a called roll is the Skirmish's
      Help, each helper spending their action, at no cost the GM names (data/skirmish/skirmish.yaml,
      rolls, called-roll; decision batch 9, 9-36 and 9-42); Help spends nothing unless the GM names a cost of time or position for it,
      which falls when Help is declared (Chapter 1, section 1.8; decision batch 9, 9-28); a comrade
      who could Help may Cover (Chapter 1, section 1.8; decision
      batch 9, 9-12).
    rules: [07-playtest-rules]
    decided: [OQ-142]

  # ------------------------------------------------ Downtime options (Chapter 7, section 7.2; decision batch 8, 8-28)
