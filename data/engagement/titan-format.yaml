# The data format of a Titan: its stat block, its Behavior Table, each entry's fields, the tier
# rules, the Titan Dice its entries roll, and the closed list of behavior effect types. The playable
# Titans in data/titans/ (Chapter 6) are written in this format.
# Source of truth under ADR-0012. docs/rules/05-titan-engagement.md (section 5.4) references this
# file and does not repeat its rows.
id: titan-format
name: Titan Stat Blocks and Behavior Tables
chapter: 05-titan-engagement
adrs: [ADR-0001, ADR-0005, ADR-0007, ADR-0015, ADR-0017, ADR-0019, ADR-0024]
decided: [OQ-78, OQ-80, OQ-82, OQ-137, OQ-145, OQ-192, OQ-193, OQ-195, OQ-196]

# ------------------------------------------------------------------ stat block
stat_block:
  fields:
    id: The Titan's id.
    name: The Titan's name.
    size_class: small, medium, or large (data/engagement/size-classes.yaml).
    abnormal: true or false (glossary Abnormal).
    tempo: Initiative cards per round.
    nape_depth: Successes one Nape strike needs to kill it.
    regeneration_clock: Segments in its Regeneration clock.
    heave: >-
      Its Heave rating: the heave count at which its body, living or a corpse, frees every soldier it
      pins (data/engagement/size-classes.yaml, heave; data/engagement/titan-harm.yaml, falling_titan,
      heave; decision batch 8, 8-9).
    body_parts: >-
      A list of Body Parts, each with id, kind (eyes, arm, or leg; data/engagement/titan-harm.yaml,
      body_part_kinds), and toughness. The list order matters: it breaks ties for Regeneration and
      decides which arm Grabs.
    attention_ladder: standard, or the id of an Abnormal ladder (data/titans/index.yaml, ladders; format in data/engagement/attention.yaml, abnormal_ladder_format).
    behavior_table: The Titan's Behavior Table (behavior_table).
  standard_titan: >-
    A Titan whose abnormal is false takes tempo, nape_depth, regeneration_clock, heave, each Body
    Part's toughness, and each entry's attack_dice from its Size Class row. Its body_parts list is exactly
    eyes, left-arm, right-arm, left-leg, right-leg, in that order, and its attention_ladder is
    standard.
  abnormal_titan: >-
    An Abnormal's stat block lists every field in full. Values that differ from its Size Class row
    are allowed only there.

# ------------------------------------------------------------------ Frenzy (decision batch 13, 13-10; OQ-193)
# A counter every Focus Titan carries. It is not a stat block field: it is not authored, it is not
# read by a Read, and no Titan in data/titans/ lists it.
frenzy:
  what: A whole number each Focus Titan holds, from 0 to its cap.
  cap: 3
  rate: 2   # rises at the frenzy end step of every even-numbered round of the Titan Engagement; the simulator moved it from 1 (round 3 retune, R1; docs/reviews/round-3-retune-decisions.md)
  starts_at: 0   # when the Titan becomes a Focus Titan, including the first Focus Titan of a Titan Engagement
  rises: >-
    By 1 at the frenzy end step of every even-numbered round of the Titan Engagement, the second,
    the fourth, the sixth, and so on, for every living Focus Titan, never above the cap (rate;
    data/engagement/round.yaml, end_steps, frenzy). At the end of an odd-numbered round the step
    does nothing. It never falls. A Titan that enters at the background-clocks end step enters
    after this step has run, so it stays at 0 through its first full round and first rises at the
    next even-numbered round's end; a Titan a flare brings in mid-round rises with the others at
    that end. The rate was 1 as decision batch 13 first wrote it; the retune halved it (round 3
    retune, R1).
  public: true   # it is on the GM's tracker (data/engagement/round.yaml, gm_tracker, focus_titan_row)
  used_by: >-
    The behavior roll, and nothing else (behavior_table, roll; data/engagement/behavior-procedure.yaml,
    next_behavior, roll). Frenzy adds no dice, changes no Attack Dice, no need, and no effect, and it
    moves no soldier (data/engagement/positions.yaml, changes_to_position, not_changed_by).
  corpse: A corpse holds no Frenzy, as it holds nothing else (data/engagement/positions.yaml, corpse, nothing_else).
  background_titan: >-
    A Background Titan holds no Frenzy. It starts at 0 when the Titan becomes a Focus Titan, however
    late in the Titan Engagement that is (data/engagement/background-titans.yaml).
  gm: >-
    none (ADR-0024, limit 8). The GM never raises, lowers, or spends Frenzy, and never re-rolls a
    behavior roll it fed. It rises only at the end step.
  why: >-
    Every Behavior Table is ordered terrorize to kill by result (behavior_table, escalation), so
    adding Frenzy walks a Titan up its own table as the fight drags: it postures for three rounds and is
    trying to kill from round 4. A Squad that kills in the three rounds ADR-0014 targets never sees
    it, and a Squad that grinds meets Frenzy 3 on the round the retreat clock fills.

# ------------------------------------------------------------------ Behavior Table
behavior_table:
  roll: D6 plus the Titan's Frenzy (frenzy)
  result_above_the_table: >-
    A total above the table's highest result reads as that highest result, which is 6, since every
    result from 1 to 6 belongs to exactly one entry (rows). So a Titan at Frenzy 3 rolling 5 reads 6
    and takes the entry that holds result 6. If that entry cannot be rolled, a frenzied Titan's roll
    turns back down the table and never wraps to 1 (data/engagement/behavior-procedure.yaml,
    next_behavior, move-up).
  rows: >-
    Every result from 1 to 6 belongs to exactly one entry. An entry may cover more than one result,
    but all of an entry's results lie within one tier's pair (escalation), so an entry has exactly
    one tier.
  escalation: >-
    Results rise through the tiers: results 1 and 2 are terrorize entries, 3 and 4 control
    entries, and 5 and 6 kill entries.
  thrash: >-
    Every table has exactly one Thrash entry, with results [] and tier thrash. It is never rolled.
    It is what the table falls back to when no other entry can happen
    (data/engagement/behavior-procedure.yaml). Since decision batch 13 (13-9; OQ-192) a Titan whose
    Attention holder cannot meet a rolled entry's position_requirement retargets down the Attention
    Ladder first, so a table falls back only when no soldier in the Titan Engagement meets it.

# ------------------------------------------------------------------ Titan Dice
# The die kind an entry's attack_dice are rolled with (ADR-0019; decision batch 8, 8-1; OQ-145).
titan_dice:
  success_faces: [5, 6]   # each die showing 5 or 6 is one success; every other face does nothing
  rolled: >-
    By the GM, in the open, when a card resolves the entry (data/engagement/behavior-procedure.yaml,
    resolving_a_card, roll-and-announce). The pool is the entry's attack_dice and nothing else.
  circumstances: never   # data/core/circumstances.yaml, never (decision batch 9, 9-2 and 9-4)
  never: >-
    Titan Dice never Push and never take Bonus Dice, Help, Gear Dice, or Stress Dice, and never take
    Circumstances. The GM never re-rolls or adjusts them (ADR-0024, limits 8 and 16; decision batch
    9, 9-4). A Titan never makes a Reaction.
  colour: A colour no soldier's pool uses, so the Titan's roll never mixes with base, Gear, or Stress Dice.
  successes: >-
    The roll's successes are the card's Severity, the same number for every target of the card
    (Chapter 1, section 1.9, Attack and Reaction).
  whiff: >-
    A roll of 0 successes whiffs against every target, a target who cannot make a Reaction
    included, and no Reaction is made against it.
  lands: >-
    Against each target, each success of that target's dodge cancels one of the roll's successes.
    The card lands on the target on 1 or more Net Successes and whiffs on 0. A target who makes no
    Reaction, or cannot make one, cancels nothing, so every success of the roll is net.

entry_fields:
  id: The entry's id, unique in its table.
  name: The entry's name.
  results: >-
    The behavior roll's totals that give this entry, from 1 to 6. The roll is D6 plus the Titan's
    Frenzy, and a total above 6 reads as 6 (behavior_table, roll, result_above_the_table). [] for
    Thrash.
  tier: terrorize, control, kill, or thrash.
  targets: >-
    holder: only the soldier who holds the Titan's Attention. holder-and-position: that soldier and
    every other soldier who holds the same Position relative to the Titan, except a soldier who is
    Grabbed. Both are read from the Attention holder as the card's choose step leaves them, so an
    entry that retargeted reads the soldier it retargeted onto (data/engagement/attention.yaml,
    evaluation, retargeting).
  position_requirement: >-
    The Positions the Attention holder must hold relative to the Titan for the entry to happen.
    Listing all four means any Position. When the holder does not, the Titan retargets down the
    Attention Ladder over the candidates who do, and falls back only when none does
    (data/engagement/behavior-procedure.yaml, resolving_a_card, choose; decision batch 13, 13-9).
  # an entry a grounded Titan must not resolve lists leg twice (decision batch 4, OQ-109)
  body_parts_used: >-
    A list of Body Part kinds. The entry can happen only while, for each listed kind, the Titan
    has at least that many Body Parts of that kind that are not Broken (a kind listed twice needs
    two). [] means none.
  attack_dice: >-
    The number of Titan Dice (titan_dice) the entry rolls when a card resolves it: 3, 6, 9, or 12,
    which is 3 for each point of the fixed number of dodge successes it needed before decision
    batch 8 (8-1). Every entry whose effects include stress, knock-loose, critical-injury, or grab
    lists it. An entry whose only effect is telegraph lists none and rolls nothing (ADR-0019).
  effects: A list of effects from effect_types, applied in order to each target on which the behavior lands.
  fallback: >-
    The id of another entry in the same table that happens instead when no candidate for the Titan
    meets position_requirement, or thrash. Thrash's own fallback is none. Since decision batch 13
    (13-9; OQ-192) the fallback is reached only after retargeting has found nobody, so no table
    needs re-authoring for it and every fallback value stands as written. The fallback is retargeted
    in its turn, over the candidates who meet its own position_requirement, so a real fallback is
    reachable rather than tested against a holder the rolled entry has already failed against
    (data/engagement/behavior-procedure.yaml, resolving_a_card, choose; round 3 review 1, M1).
  text: >-
    What the soldiers see. Flavour only: no procedure step reads it (ADR-0024). It names none of the
    Titan's own Body Parts of a kind the entry does not list in body_parts_used (added for Chapter 6,
    OQ-100 and OQ-105).

tier_rules:
  terrorize:
    effects_allowed: [stress, telegraph, wreck]
  control:
    effects_allowed: [stress, telegraph, knock-loose, critical-injury, wreck]
    critical_injury: Every critical-injury effect has cannot_be_lethal true.
  kill:
    effects_allowed: [stress, telegraph, knock-loose, critical-injury, grab, wreck]
    grab: >-
      An entry with a grab effect has targets holder, lists arm in body_parts_used, and has no
      other harming effect (ADR-0019: the Grab's harm is its crushing Critical Injury).
  thrash:
    effects_allowed: [stress, knock-loose, critical-injury, wreck]
    critical_injury: Every critical-injury effect has cannot_be_lethal true.
    position_requirement: [distant, in-reach, on-body, blind-spot]
    body_parts_used: []
    attack_dice: The Size Class control pool (data/engagement/size-classes.yaml, attack_dice).
    fallback: none
  every_entry: >-
    ADR-0024, limit 11, as amended in decision batches 7 and 8: every entry lists
    position_requirement, body_parts_used, attack_dice (none for an entry whose only effect is
    telegraph), and fallback, and every harming effect lists its Injury Type. A critical-injury
    effect names it in injury_type. A grab effect's crush is Crush (data/engagement/grab.yaml,
    grab_lands, crush_harm), and a knock-loose fall is Crush (data/gear/falls.yaml, injury_type), so
    neither effect repeats it. No entry names death (data/harm/health.yaml, harm_kinds, death).

# ------------------------------------------------------------------ effect types (closed list)
# Each effect applies to a target on which the behavior landed (titan_dice, lands). Only the
# critical-injury effect reads the Net Successes (decision batch 8, 8-2).
effect_types:
  - id: stress
    fields: {amount: a whole number of 1 or more}
    effect: The target gains that much Stress, once, whatever the Net Successes.
  - id: critical-injury
    fields:
      injury_location: >-
        An Injury Location id (data/harm/critical-injuries.yaml), or rolled. An arm or a leg names no
        side; its side is rolled (data/harm/critical-injuries.yaml, sides, side_roll).
      injury_type: >-
        An Injury Type id (data/harm/critical-injuries.yaml, types). An entry named Bite is bite; every
        other entry is crush (ADR-0017; decision batch 7, 7-5). Required.
      cannot_be_lethal: true or false.
    effect: >-
      The target gains one Critical Injury (data/harm/critical-injuries.yaml, gaining), whose roll
      adds 1 for each Net Success beyond the first (gaining, net-success-rider). It is a Titan
      attack (data/harm/health.yaml, titan_attacks).
  - id: knock-loose
    fields: {}
    effect: >-
      If the target is airborne, or holds on-body or blind-spot relative to the Titan, they fall
      (data/gear/falls.yaml, triggers, rule-named), with the band Chapter 4's height steps give.
      Otherwise nothing happens. A mounted target is not affected. The fall is the same whatever the
      Net Successes.
  - id: grab
    fields: {}
    effect: >-
      The Grab procedure against the target (data/engagement/grab.yaml, grab_lands). It is the same
      whatever the Net Successes: the Grab takes no rider (grab_lands, rider).
  - id: wreck
    fields: {}
    effect: >-
      The Titan Engagement loses 1 Anchor (data/engagement/anchor-ratings.yaml, anchors, wrecking).
      Like telegraph, a wreck effect applies whether the behavior landed or whiffed, and whatever
      the Net Successes: it is the Titan going through the place, not an attack on a person. It
      affects no soldier, no horse, and no Position, and it never falls below 0 Anchors.
  - id: telegraph
    fields: {}
    effect: >-
      The Next Behavior rolled after this card is revealed to every soldier at once
      (data/engagement/behavior-procedure.yaml, resolving_a_card, next). A telegraph effect
      applies whether the behavior landed or whiffed, because it is information, not harm.

# A filled-in example of this format is the reference Titan the simulations used
# (data/engagement/tuning.yaml, simulation_reference_titan). It is not a playable Titan; the playable
# Titans are in data/titans/ (Chapter 6).
example: data/engagement/tuning.yaml (simulation_reference_titan)
