# ADR-0014 tuning for Chapter 5: which values are simulator starting values, the probe scripts that
# measured them, the builds and models they used, the reference Titan they fought, and every figure
# the chapter quotes.
# Source of truth under ADR-0012. docs/rules/05-titan-engagement.md (section 5.13) references this
# file. The probes in tools/probes/chapter-05 are stand-ins until the ADR-0014 simulator in tools/
# exists.
id: tuning
name: Chapter 5 Tuning Figures and Simulator Starting Values
chapter: 05-titan-engagement
adrs: [ADR-0014, ADR-0015, ADR-0019]
decided: [OQ-78, OQ-79, OQ-81, OQ-85, OQ-89, OQ-95, OQ-96, OQ-98, OQ-126, OQ-127, OQ-145, OQ-187, OQ-190, OQ-192, OQ-193]

# The probe figures below were measured with each Behavior Table entry's fixed need of dodge successes,
# before Attack Dice replaced it at 3 dice per point (decision batch 8, 8-1), and stand as that record.
# Every verdict below reads the final full simulator rerun under Attack Dice
# (docs/reviews/simulator-report.md, decision batch 8, 8-14 and 8-31), in which every target, band, and
# bar limit is Met and no fight reached the safety cap.

# Decision batch 10 (OQ-182 to OQ-185) changed how a move works: every ODM move is a Flight, each
# success is 1 Momentum, Anchors cap it and the Titan wrecks them, the loudest flag matches every
# rung but hooked into its body, a mounted step may charge, and Swap Blade Set spends the move.
# EVERY FIGURE IN THIS FILE AND IN docs/reviews/simulator-report.md IS STALE UNTIL THAT RERUN.
# The rerun is a retune, not a sensitivity row, because Flight replaces the move rather than sitting
# beside it. It must answer: prepared_squad_kill with Bite measured separately as the first thing to
# cut; the PC Critical Injury and death targets, which OQ-182's failed-Flight flag, OQ-183's charge
# and OQ-184's matching flag feed together; the wreck rate per table and Size Class; and
# families.route_check with Anchors at 0, which must confirm ADR-0010's legal route still holds.
# Round time is expected to rise by about 1 to 1.5 dice pools a round against the 3.57 measured here.

# Decision batch 11 (OQ-187) changed the Push's gear economy: a Gear Die showing 2 to 5 is re-rolled,
# a 6 is kept and a 1 is locked; a Pushed roll wears its gear item by at most 1 point, however many
# of its Gear Dice show 1; and Standard Issue issues ODM Gear rated 3 from Funding 3 up. The Jam test
# reads the wear rule and the issued rating directly, so IT IS STALE UNTIL THE SAME RERUN, along with
# every figure that a Pushed roll's gear feeds. The exact arithmetic on the Jam test's three-Pushed-
# dodge proxy (tools/probes/round-2/gear_die.out) puts the package at 24.2% against the bar of a
# third, where today's rule reads 17.8% at rating 3 and 26.3% at the rating 2 it replaces; the rerun
# must confirm that on the full model, and must re-read the reference builds, whose Rookie now
# carries ODM Gear 3 (ADR-0014, builds).

# Decision batch 13 (OQ-190, OQ-192, OQ-193) changed Health and what a Titan does with its card.
# Health is now 2 + (strength + agility) / 2, rounded up, so the reference builds read Rookie 6,
# Veteran 6, and Levi-grade 7, and a built soldier's Health runs 4 to 6 rather than 2 to 4 (builds,
# below, carries the new values). A Titan whose Attention holder cannot meet the rolled entry's
# Position requirement now retargets down the Attention Ladder instead of falling to Thrash, and each
# Focus Titan carries Frenzy, rising 1 a round to a cap of 3 and added to its behavior roll.
# EVERY FIGURE IN THIS FILE AND IN docs/reviews/simulator-report.md IS STALE UNTIL THAT RERUN, which
# is the same rerun batches 10 and 11 schedule. It is a retune, and it measures batches A and F
# together: Health pulls every lethality band down and the behavior fixes put lethality back through
# what the monster does rather than through its dice. It must answer: the Expedition PC Critical
# Injury and PC death targets, and every Critical Injury and deaths band of Chapter 6; the share of a
# Titan's cards that resolve Thrash, before and after retargeting; the Frenzy rate and cap, which are
# starting values the simulator moves; and the health_reports rows, whose reachable Health values are
# now 4 to 8 rather than 2 to 6. Round 3 review 1 adds two cases it must also answer: the share of
# retargeted kill-tier cards that land on a Down soldier, who makes no Reaction so every success is
# net and who would have drawn a Thrash before retargeting (m1); and the share of cards on which the
# fallback itself retargets, which is the part of 13-9 that reaches standard-large's Crush and the
# Sprinting Abnormal's Pitch Headlong (M1).

# ------------------------------------------------------------------ starting values
starting_values:
  note: >-
    Every value below is a starting value for the ADR-0014 simulator. The simulator re-measures
    each with the full rules; when it changes one, the YAML file that holds the value changes and
    the chapter follows it.
  values:
    - file: data/engagement/size-classes.yaml
      keys: [tempo, nape_depth, regeneration_clock, toughness, attack_dice]
    - file: data/engagement/grab.yaml
      keys: [escapes.break-free.needs, escapes.break-free.lifted_penalty, escapes.pry-loose.needs, escapes.pry-loose.lifted_penalty, escapes.strike-the-holding-arm.reach_before_lift, escapes.strike-the-holding-arm.reach_after_lift, escapes.strike-the-holding-arm.strike_penalty]
    - file: data/engagement/attention.yaml
      keys: [break_attention.needs]
    - file: data/engagement/read.yaml
      keys: [read.needs, call_it.successes_needed]
    - file: data/core/bonus-dice-sources.yaml
      keys: [read-from-distant.dice_per_unit, call-it.dice_per_unit]
    - file: data/engagement/anchor-ratings.yaml
      keys: [anchors on every rating, terrain_trait on every rating, the Momentum spend list]
    - file: data/engagement/background-titans.yaml
      keys: [ticks]
    - file: data/engagement/engagement-setup.yaml
      keys: [background_titans clock lengths]
  fixed_by_adr:
    - grip_toughness 1 (ADR-0019)
    - One dodge per Titan per round, whose successes cancel each card's successes one for one (ADR-0019; Chapter 1, section 1.9)

# ------------------------------------------------------------------ the probes
probes:
  path: tools/probes/chapter-05
  runs_with: uv run --with pyyaml python
  baseline_policy: >-
    Each target is measured under the baseline policy this file states for it (prepared_squad_kill,
    solo_nape, grab, jam_test, gas): the reference Squad's roles, striking and dodging choices, and
    rescues, with no Read, Call It, Wings, initiative swaps, Squad Tactics, or Background Titans
    unless the target names them, and every full fight runs under the retreat clock of 8 segments
    (prepared_squad_kill, model, retreat; decision batch 5, 5-10). Sensitivity rows are reported beside each target, not tuned:
    every Squad Tactic alone and in pairs (prepared_squad_kill, squad_tactics), decoy screens
    (prepared_squad_kill, decoys), and helper Squadmates. Every value is a starting value until the
    Phase 1 simulator, which models every rule and every reference-build action under published
    policies, re-measures it (ADR-0014, as amended in decision batches 3 and 3b; OQ-98; simulator_cases).
  files:
    - file: core.py
      holds: >-
        Dice pools, Pushes, Covering, Stress Responses, Push wear, Critical Injuries crossing Health
        boxes (read from data/harm/critical-injuries.yaml), turn-limit Death Rolls, falls, Fear Rolls,
        and the reference builds.
    - file: simple.py
      holds: The lone Nape strike, the card-order wait (the upper bound on decoys wasted), the lone and rescued Grab with and without turn debt, the Jam test, and gas.
    - file: run_simple.py
      holds: Runs one simple.py family (jam, jamtable, solo, wait, ba, gas, grab). Its first argument names the family, its second the trials.
    - file: run_tgrab.py
      holds: Template victims alone in a Grab.
    - file: lone.py
      holds: >-
        The full lone-fight model (decision batch 3b, 3b-2): one reference Rookie against one Focus
        Titan's Behavior Table, with cards face up, Positions, dodges, Pushes, Stress Responses, Push
        wear, Jams, gas with a spare canister, Field Repair, falls, Critical Injuries, the Grab
        countdown, and a Rookie's decoys. Break Attention's needs rule, the Feint, the decoy's hold,
        the spare and Field Repair route check (decision batch 3c, 3c-3), Tempo, Nape Depth, the
        Behavior Table, the policy, and the start are switches. So is retreat_clock: 8 by default,
        which ends a lone fight that nothing ended sooner, or null for the 12-round horizon (decision
        batch 5, 5-10). Its argument is the trials per row.
    - file: fight.py
      holds: >-
        The full-fight model. Its first argument is a JSON list of cases, its second the fights per
        case. The flag rule is a switch: flags last until the end of the Titan's next card that
        resolves a behavior (the rule, decision batch 3e, 3e-1), or clear on the card that evaluates
        the ladder and on a card that comes up while the Titan holds a Grabbed soldier (batches 3c and
        3d as applied), or on every card of a hold as well (batch 3b). So is the nearest rung: met by
        the candidates at the closest Position even when it is the highest rung met (the rule, decision
        batch 3e, 3e-6), or, as before, tying every candidate so that the holder step decides. So is the
        last tie-break: a tie no card can break leaves Attention held by nothing until the Titan's next
        card (tie_break "none", the rule, decision batch 4, 4-3), or goes to the soldier listed first on
        the Squad sheet (tie_break "sheet", as before batch 4); sheet_order lists the player characters
        cutters first or strikers first. So is roles: unset, the baseline's two cutters and two
        strikers, or a list such as four strikers, the four-striker row (decision batch 4b, 4b-2). The
        earlier probes pin the tie-break they ran with. So is retreat_clock: 8 by default, the interim
        setup's length, under which a fight the Squad has not won becomes a retreat and runs to its
        end, with max_rounds a safety cap of 60 that no fight should reach (model, retreat); null keeps
        the 12-round horizon the probes ran with before decision batch 5.
    - file: ../batch-3c/lone_b3c.py, flags_b3c.py, onfoot_b3c.py
      holds: >-
        Decision batch 3c's probes, run from the repository. lone_b3c.py runs lone.py's route-check
        switches on the decider's seeds; flags_b3c.py counts the hooked-by-strike flags a hold card that
        is not its last would clear, on tools/probes/chapter-06/fight6.py, with batch 3c's rules pinned
        (superseded by flags_b3e.py); onfoot_b3c.py gives the Rookie's Break Attention rates on foot and
        the screen rows with the on-foot Feint, with batch 3c's rules pinned, or with fight.py's batch 3e
        rules when its second argument is 3e (onfoot_b3e.out). Each writes its .out file beside it.
    - file: ../batch-3e/flags_b3e.py, nearest_b3e.py, abnormal_b3e.py
      holds: >-
        Decision batch 3e's probes, run from the repository. flags_b3e.py fights rows with each flag
        lifetime; nearest_b3e.py with the nearest rung as written before batch 3e and under the rule;
        each pins the other rule and the Squad-sheet tie-break as the decider ran them, and reproduces
        its .out file. abnormal_b3e.py is Chapter 6's (data/titans/tuning.yaml, probes).
    - file: ../batch-4/quarry_b4.py, sweep_b4.py, margin_b4.py, runner_b4.py, abnormal_b4.py
      holds: >-
        Decision batch 4's probes on tools/probes/chapter-06/fight6.py and fight.py: the last tie-break
        and the current-holder test (quarry_b4.py), the Sprinting Abnormal's value changes
        (sweep_b4.py, margin_b4.py), and the most-soldiers test (runner_b4.py). Each pins the rules
        and the Sprinting Abnormal's Severities it ran with, and reproduces its .out file.
        abnormal_b4.py is Chapter 6's (data/titans/tuning.yaml, probes).
    - file: ../batch-3b/screen_b3b.py, screen6_b3b.py
      holds: >-
        Decision batch 3b's screen probes. They import the live fight.py and fight6.py, whose rules have
        changed since, so their .out files are historical snapshots that the scripts no longer
        reproduce; the rows that govern are decoys here and Chapter 6's support rows (decision batch 4,
        4-12).
    - file: cases1.json
      holds: The prepared-Squad, policy, Squad, Size Class, Medium pool, decoy and screen, and Grab-rule cases.
    - file: cases2.json
      holds: The rejected alternative values.
    - file: cases3.json
      holds: Each Squad Tactic alone and in pairs with the Grab escapes, and the Squad rows with tactics.
  commands:
    run_from: tools/probes/chapter-05
    needs: >-
      Python 3 with PyYAML, which uv run --with pyyaml supplies. Seeds are fixed, so each command
      repeats its figures; the three fight.py commands and lone.py repeat the rows re-run under the
      retreat clock after decision batch 5 (prepared_squad_kill, rerun). The probes of decision batches
      3b to 4b pin the 12-round horizon, and loud_b4b.py Draw Attention from any Position, so that each
      repeats its record.
    list:
      - table: prepared_squad_kill (reference, policies, squads, decoys, size_classes, medium_attack_dice)
        command: 'uv run --with pyyaml python fight.py "$(cat cases1.json)" 12000'
      - table: prepared_squad_kill (alternatives_rejected)
        command: 'uv run --with pyyaml python fight.py "$(cat cases2.json)" 12000'
      - table: prepared_squad_kill (squad_tactics)
        command: 'uv run --with pyyaml python fight.py "$(cat cases3.json)" 12000'
      - table: solo_nape
        command: uv run --with pyyaml python run_simple.py solo 100000
      - table: solo_nape (break_attention_by_need, card_order_wait)
        command: uv run --with pyyaml python run_simple.py wait
      - table: solo_nape (lone_fight)
        command: uv run --with pyyaml python lone.py 100000
      - table: grab (lone, comrades_close, turn_debt, health_reports)
        command: uv run --with pyyaml python run_simple.py grab 40000
      - table: grab (templates_alone)
        command: uv run --with pyyaml python run_tgrab.py
      - table: jam_test (table)
        command: uv run --with pyyaml python run_simple.py jamtable 60000
      - table: jam_test (kill, mix)
        command: uv run --with pyyaml python run_simple.py jam 60000
      - table: gas
        command: uv run --with pyyaml python run_simple.py gas 200000
      - table: solo_nape (break_attention_on_foot) and prepared_squad_kill (decoys, on_foot_feint), from the repository root, with fight.py's batch 3e rules
        command: uv run --with pyyaml python tools/probes/batch-3c/onfoot_b3c.py 12000 3e
      - table: prepared_squad_kill (decoys, flags_under_a_hold), from the repository root
        command: uv run --with pyyaml python tools/probes/batch-3e/flags_b3e.py 12000
      - table: prepared_squad_kill (nearest_rung), from the repository root
        command: uv run --with pyyaml python tools/probes/batch-3e/nearest_b3e.py 12000
      - table: solo_nape (lone_fight, batch 3c's staged rows), from the repository root
        command: uv run --with pyyaml python tools/probes/batch-3c/lone_b3c.py 100000
  limits: >-
    Only data/harm/critical-injuries.yaml is read from the data files. Every other value is written
    into the scripts, so a changed YAML value must be copied there before a re-run. The probes are
    not the ADR-0014 simulator and are not kept in step with later rules.

# ------------------------------------------------------------------ builds
# ADR-0014's reference builds, field by field (docs/rules/DECISIONS-2026-09-14.md, Batch 2b).
builds:
  rookie:
    attributes: {strength: 4, agility: 3, wits: 2, every_other_attribute: 3}
    health: 6   # 4 before decision batch 13 (13-1; OQ-190)
    resolve: 3
    scars: 0
    minimum_stress: 0
    stress_when_a_fight_begins: 1
    item_ratings: {odm_gear: 3, horse: 2, every_other_item: 1}   # odm_gear raised from 2 by decision batch 11 (OQ-187); the horse ladder is unchanged
    talent_level: 1
  veteran:
    attributes: {strength: 5, agility: 3, wits: 2, every_other_attribute: 3}
    health: 6   # 4 before decision batch 13 (13-1; OQ-190)
    resolve: 5
    scars: 2
    minimum_stress: 2
    stress_when_a_fight_begins: 2
    item_ratings: {every_item: 2}
    talent_level: 2
  levi_grade:
    attributes: {strength: 6, agility: 4, every_other_attribute: 4}
    health: 7   # 5 before decision batch 13 (13-1; OQ-190)
    resolve: 4
    scars: 0
    minimum_stress: 0
    stress_when_a_fight_begins: 2
    item_ratings: {every_item: 3}
    talent_level: 3
  talent_dice_on: [nape-strike, body-part-strike, break-free, treat-injury]
  no_talent_dice_on: [dodge, fly, break-attention, ride, read]
  common_to_every_model: >-
    Push when short of the successes needed, and only when no Stress Die shows 1; Stress rises by 1
    per Push; Stress Responses from data/mind/stress-responses.yaml, lasting penalties included;
    Gear Dice showing 1 on a Pushed roll wear the item; a Squadmate never Pushes or Covers.

reported_beside_targets:
  rookie_dodge: >-
    Alone, Stress 1, against a fixed need before Attack Dice (decision batch 8, 8-1): needing 3 successes 20.7%, needing 2 49.7%, without Stress Responses
    (docs/rules/DECISIONS-2026-09-14.md, Batch 2b).
  flier_template_dodge: >-
    Alone (Agility 4, Slip Away 1, ODM Gear 2, Stress 1), against a fixed need before Attack Dice: needing 3 successes 38.0%, needing 2 66.6%, without
    Stress Responses (same source). Reported, not tuned.
  template_squad: prepared_squad_kill (template row), grab (templates_alone, the template comrade row).
  health: grab (health_reports).

# ------------------------------------------------------------------ the reference Titan
# A filled-in example of data/engagement/titan-format.yaml. It is not a playable Titan: the playable
# Titans are in data/titans/ (Chapter 6). Small and Large runs used the same table with their Size Class values.
simulation_reference_titan:
  playable: false
  id: reference-medium
  name: Reference Medium Titan (simulation only)
  size_class: medium
  abnormal: false
  tempo: 1
  nape_depth: 4
  regeneration_clock: 3
  body_parts:
    - {id: eyes, kind: eyes, toughness: 2}
    - {id: left-arm, kind: arm, toughness: 2}
    - {id: right-arm, kind: arm, toughness: 2}
    - {id: left-leg, kind: leg, toughness: 2}
    - {id: right-leg, kind: leg, toughness: 2}
  attention_ladder: standard
  behavior_table:
    roll: D6
    entries:
      - id: roar
        name: Roar
        results: [1]
        tier: terrorize
        targets: holder
        position_requirement: [distant, in-reach, on-body, blind-spot]
        body_parts_used: []
        attack_dice: 3
        effects: [{type: stress, amount: 1}]
        fallback: thrash
      - id: lunge
        name: Lunge
        results: [2]
        tier: terrorize
        targets: holder
        position_requirement: [in-reach, on-body]
        body_parts_used: []
        attack_dice: 3
        effects: [{type: stress, amount: 1}]
        fallback: thrash
      - id: swat
        name: Swat
        results: [3]
        tier: control
        targets: holder
        position_requirement: [in-reach, on-body]
        body_parts_used: [arm]
        attack_dice: 6
        effects: [{type: critical-injury, injury_location: rolled, injury_type: crush, cannot_be_lethal: true}]   # decision batch 7, 7-5
        fallback: thrash
      - id: shake-off
        name: Shake Off
        results: [4]
        tier: control
        targets: holder
        position_requirement: [on-body, blind-spot]
        body_parts_used: []
        attack_dice: 6
        effects: [{type: knock-loose}]
        fallback: thrash
      - id: grab
        name: Grab
        results: [5]
        tier: kill
        targets: holder
        position_requirement: [in-reach, on-body]
        body_parts_used: [arm]
        attack_dice: 9
        effects: [{type: grab}]
        fallback: thrash
      - id: bite
        name: Bite
        results: [6]
        tier: kill
        targets: holder
        position_requirement: [in-reach, on-body]
        body_parts_used: []
        attack_dice: 9
        effects: [{type: critical-injury, injury_location: rolled, injury_type: bite, cannot_be_lethal: false}]   # decision batch 7, 7-5
        fallback: thrash
      - id: thrash
        name: Thrash
        results: []
        tier: thrash
        targets: holder
        position_requirement: [distant, in-reach, on-body, blind-spot]
        body_parts_used: []
        attack_dice: 6
        effects: [{type: knock-loose}]
        fallback: none

# ------------------------------------------------------------------ target 1: the prepared Squad
prepared_squad_kill:
  target: A prepared Squad of 4 kills a standard Medium Titan in about 3 rounds (ADR-0014).
  tolerance: {median_kill_round: exactly 3}   # a median target reads exactly (ADR-0014, as amended in decision batch 5; OQ-127)
  probe: tools/probes/chapter-05/fight.py with cases1.json and cases2.json
  model:
    battlefield: Anchor Rating Wooded, one Focus Titan with the reference table at its Size Class values, no Background Titans, and a retreat clock of 8 segments, which ends every fight the Squad has not won (retreat).
    squad: >-
      Four Rookie player characters at Stress 1, starting at distant: two cutters and two strikers.
      Squad rows add Squadmates as helpers or decoyers. The template row uses the Slayer and Flier
      templates as strikers and the Brawler and Hunter as cutters. Every soldier is dealt a card;
      there are no Wings or swaps.
    cutters: >-
      Move to in-reach and strike the more damaged leg, then other Body Parts, Helped by up to 2
      comrades.
    strikers: >-
      Move to blind-spot and make Nape strikes, spending every Opening they did not create and taking
      Help up to the cap of 4 Bonus Dice, refilling gas from a spare canister when dry. Eager
      strikers strike whenever they can. Waiting strikers strike only with at least 2 Bonus Dice from
      others' Openings and the grounded Titan, or from round 3.
    helpers: >-
      A comrade within one Position step who is not Down, Grabbed, or a decoyer and has an unspent
      action: one whose card has already come up (a held action), a helper Squadmate, or a striker
      who began the round at distant.
    decoyers: >-
      Squadmates who take Break Attention with the horse (Perception) from distant while no decoy
      holds, needing what data/engagement/attention.yaml (break_attention, needs, needs_rule) gives:
      1 while the decoyer holds the Titan's Attention and 2 otherwise, plus 1 for each of the
      Titan's decoys in a row, with a decoy holding for as many of the Titan's cards as its Tempo.
      The horse bolts on a success. Rows name any other needs rule they use: batch 3's rule (1 for
      each decoy that has held the Titan's Attention in the fight, never reset), decoys in a row
      without the Feint, the review round 2 rule (1 for the Attention holder or a comrade at the
      holder's Position, otherwise 2, no escalation), needs 1 for the holder only with no
      escalation, the review round 2 rule with batch 3's escalation, or every Break Attention
      needing 1. Rows with the
      rejected decoy cap also bar Break Attention on a Titan whose most recent card a decoy spent;
      the repeatable row keeps the horse and needs 1, as the first draft allowed.
    screen: >-
      Screen from distant (review round 2, Opus finding 2): Squadmates who send their horse from
      distant as decoyers do, then fly to blind-spot, throw their cloak with ODM Gear Dice, and stay
      there. Screen beside the holder (review round 3, Opus Major 1): a mounted Squadmate rides to
      the Attention holder's Position when it is distant or in-reach and sends its horse;
      dismounted, it flies to the holder's Position if that is on-body or blind-spot, otherwise to
      blind-spot, and throws its cloak. Both screens send and throw whatever Break Attention needs.
      Under the rule, a screener beside the holder with no horse at hand and its cloak thrown moves
      to in-reach and takes Break Attention with a Feint and its ODM Gear, never Pushing (decision
      batch 3b). It feints only with working ODM Gear; a screener who could Feint on foot against a
      grounded Titan (decision batch 3c) is the sensitivity row decoys, on_foot_feint.
    dodge_policy: >-
      Harm (the reference) dodges every behavior with a harming effect that targets the soldier; under
      Attack Dice, every such card whose roll scores 1 or more successes, Pushing when short (decision
      batch 8, 8-1).
      Lethal dodges only Grab and Bite.
    grab: >-
      Rule (e) of OQ-85 unless a row says otherwise: the Grab spends the action of the victim's
      first counted turn, and a failed dodge that spent a later turn gets it back
      (data/engagement/grab.yaml, countdown, failed_dodge). On a Grab, every soldier except a striker
      ready to cut with 2 Bonus Dice moves to reach the holding arm and strikes it without Help.
    escapes: >-
      Rows that name escapes add the other ways out a Rookie Squad has: Help on Break Free from any
      comrade within one Position step with a held action, and Break Attention from a rescuer who
      cannot strike the hand that turn (with ODM Gear, or the horse from distant), needing what
      needs_rule gives against a holding Titan (2, plus 1 for each of its decoys in a row). Pry Loose
      is left out because no reference soldier holds it.
    retreat: >-
      Decision batch 5, 5-10 (data/engagement/background-titans.yaml, retreat_clock and retreat). The
      retreat clock fills 1 segment at the end of each round, after Regeneration, and when it is full
      the fight becomes a retreat. Under the retreat every standing soldier who is not Down, Grabbed,
      or carried makes the forced move before the action, except a stay-with-a-comrade move, which
      follows the action taken for the comrade, and a move after a lift (Chapter 5, section 5.10, the
      order of decision batch 5, 5-1 and 5-13). The policy: go for a Grabbed comrade, stepping toward the hand and then
      striking the holding arm, or taking Break Attention in rows with the escapes, or, from the
      victim's Position, acting first and staying; carry a lifted comrade toward distant and out; lift
      the nearest Down comrade, lifting and moving at once when sharing their Position and otherwise
      stepping toward them and lifting on arrival; otherwise step toward distant and leave. A soldier
      at on-body or blind-spot who can make no step lets go. A Rookie carrying a Rookie comrade is
      Overloaded (data/gear/carrying.yaml), so an ODM move also spends the action. No Treat Injury,
      Nape strike, Squad Tactic, or Draw Attention is taken during the retreat, so its deaths are an
      upper reading. A soldier who has left still takes turns and turn-limit Death Rolls. When no
      standing soldier holds a Position the fight ends, and every soldier still holding one dies, left
      to the Titans. max_rounds is a safety cap of 60 rounds, which no fight reached.
    squad_tactics: >-
      Rows that name tactics hold them. Hook and Cut: a cutter takes Break Attention with ODM Gear,
      needing what needs_rule gives, when a striker at blind-spot with an unspent action holds the
      Titan's Attention or has 2 Bonus Dice from others' Openings and the grounded Titan, and any
      Break Attention success is followed by a ready striker's Nape strike. Hamstring Line: declared
      on the first Helped leg strike. Clear the Hand: declared by the first rescuer at in-reach once
      the victim is lifted. Fall Back: declared at a wings step when a soldier at on-body or
      blind-spot has no working ODM Gear and the Titan is not grounded, and only those soldiers take
      in-reach.
    included: >-
      The standard ladder with its tie-breaks and struck-first narrowing, the nearest rung met by the
      candidates at the closest Position (decision batch 3e, 3e-6), flags that last until the end of
      the Titan's next card that resolves a behavior (decision batch 3e, 3e-1), move-up and fallbacks,
      Regeneration, Openings with creators, grounding and its steps on foot, turn debt, Push wear,
      Jams, Blade Set ruin, falls, gas, Critical Injuries crossing Health boxes, Down and a Down
      soldier's crawl, turn-limit Death Rolls, witnesses' Fear Rolls, the retreat clock and the
      retreat, carrying a comrade, and the left-behind ending.
    excluded: >-
      Read, Call It, Draw Attention, Background Titans, Wings, swaps, Treat Injury during the fight,
      and Pry Loose. Squad Tactics, Help on Break Free, and Break Attention rescues appear only in the
      rows that name them (OQ-98).
