        values: [3, 70.0%, 80.7%, 4.6%, 0.40, 0.009, 0.029, 0.130, 0.004]
        titan_cards_resolved_per_round: 0.591
    uses_per_fight: {hook_and_cut: 0.33, hamstring_line: 0.99, clear_the_hand: 0.07, fall_back_soldiers_moved: 0.002}
    escapes: >-
      The 4 player character row with escapes differs from the row without them within sampling, and
      Break Attention rescues numbered at most 0.005 per fight in any row: under this policy a rescuer
      who can reach the hand always strikes it (OQ-98). Under the retreat, a rescuer in a row with the
      escapes also takes Break Attention for a Grabbed comrade whose hand they cannot strike, which draws
      its own dice, so the two rows no longer share every roll.
  grab_dodge_refunds: >-
    A failed dodge had its turn given back on 0.013 of the reference fight's 0.224 Grabs per fight
    (5.7%) (data/engagement/grab.yaml, countdown, failed_dodge).
  withdrawn: >-
    The first draft's figures (77% by round 3 for 4 player characters) came from an uncommitted
    model started at Stress 0. They are withdrawn (OQ-78).
  verdict: >-
    Met on the final full rerun under Attack Dice (docs/reviews/simulator-report.md, sections 1, 6.12,
    and 10). The median kill round is 3, read exactly (tolerance): on the standard Medium Titan's
    reference start 42.0% are killed by round 2 and 62.4% by round 3, and on Chapter 5's reference
    Titan round 3 (62.5% by round 3, 0.70 Critical Injuries, 0.064 deaths during the fight and 0.074
    through the end). Every Medium policy at the reference start keeps round 3 (strikers wait 61.6%,
    dodge only Grab and Bite 65.9%, from Stress 0 60.1%), and so does every one or two Squad Tactics
    held (61.8% to 66.7% by round 3). Regeneration 2 (57.0% by round 3, 0.91 Critical Injuries), Nape
    Depth 3 (median round 2), Nape Depth 5 (median round 5), and Tempo 2 (1.94 Critical Injuries,
    0.393 deaths during the fight) each miss it or trade it for far more harm. No Chapter 5 target
    measures Large; at Nape Depth 4 its median kill is round 3 with nearly twice Medium's Critical
    Injuries and between three and four times its deaths (1.24 and 0.235 during the fight against 0.70
    and 0.064), and 14.1% of its fights end with no kill (OQ-78). Two Squadmates screening beside the
    Attention holder deal 0.45 Critical Injuries per fight against the helpers' 0.62, and kill no
    faster (67.6% by round 3 against 69.6%): a trade, not a dominant play (OQ-81). With helper
    Squadmates the median kill is round 3 on the boundary in the squads row (69.6% by round 3) and in
    the squad_tactics row with the escapes (69.1%), and round 2 with Hook and Cut and Hamstring Line
    held (73.2%). 7.7% of the reference fights end in a retreat, which carries out 0.059 Down comrades
    per fight and leaves 0.021 soldiers to the Titans, and no fight reached the safety cap. The target
    is read under the baseline policy, two cutters and two strikers (ADR-0014, as amended in decision
    batch 4b): four eager strikers and no cutters kill sooner and take less harm (78.2% by round 3,
    median round 3 on the boundary, 0.44 Critical Injuries, 0.021 deaths during the fight), a row
    reported beside the target, not tuned, and an open question (OQ-112). The probes' figures in this
    section, under each entry's fixed need, stand as the record of that measurement (the screen's 0.635
    cards a round against the helpers' 0.836; batch 3's rule 0.669 and 0.47).

# ------------------------------------------------------------------ target 2: the lone Nape strike
solo_nape:
  target: >-
    A lone, average soldier who has used Break Attention succeeds on about 10% of Nape strikes
    against a Medium Titan, between 8% and 14% on a cut made directly after Break Attention from the
    Rookie's fight-start Stress of 1, with the cut a lone soldier makes after the cards they took
    while waiting reported beside it and not tuned; a Levi-grade soldier pushing hard succeeds about
    50% of the time. (ADR-0014, body, second target, quoted word for word as amended in decision
    batches 3 and 3b; OQ-79; decision batch 3c, 3c-6.)
  tolerance: {rookie_fresh_cut: 8% to 14%, levi_grade: 45% to 55%}   # ADR-0014, as amended in decision batch 5 (OQ-127)
  measurement_point: >-
    The band is read on a cut made directly after Break Attention from the Rookie's fight-start
    Stress of 1, with no other Titan card resolved against the soldier (this model: 13.1%). The cut
    a lone soldier makes after the cards they took while waiting is reported beside it and not
    tuned (lone_fight). A simulator value outside the band on the fresh cut is a miss; the in-fight
    figure is a report (decision batch 3b, 3b-2).
  probe: tools/probes/chapter-05/simple.py (solo_trial, solo_wait) and lone.py
  model: >-
    A lone soldier takes Break Attention (Perception with ODM Gear, no Talent dice) up to three
    times until it succeeds, needing 1 because the soldier holds the Titan's Attention and the Titan
    has no decoys in a row (data/engagement/attention.yaml, break_attention, needs), then a Nape strike
    needing the Nape Depth with Talent dice, Pushing when short. Push wear from Break Attention
    carries into the strike. The soldier never spends the Openings they created. No Help, no
    grounded Titan, and no Openings from others. Card order and every Titan card are left out
    here: this is the measurement point, and lone_fight plays the fight. 100,000 trials per cell.
  columns: [start_stress_0, start_stress_1, start_stress_2, start_stress_3]
  fight_start_column: {rookie: start_stress_1, veteran: start_stress_2, levi_grade: start_stress_2}
  chosen_nape_depth_4:
    rookie: [10.0%, 13.1%, 15.9%, 17.4%]
    veteran: [27.4%, 29.7%, 32.3%, 33.9%]
    levi_grade: [46.1%, 47.3%, 47.4%, 46.3%]
  alternative_nape_depth_5:
    rookie: [2.3%, 3.6%, 5.2%, 6.5%]
    veteran: [10.6%, 13.3%, 15.2%, 17.2%]
    levi_grade: [24.6%, 26.9%, 28.6%, 28.7%]
  levers_rejected:
    source: >-
      docs/rules/DECISIONS-2026-09-14.md, Batch 3, OQ-79, measured on this directory's dice core
      at each build's fight-start Stress, 100,000 trials per cell. Not committed as a probe family.
    columns: [rookie, levi_grade]
    one_die_penalty_on_the_lone_cut: [8.1%, 41.9%]
    two_die_penalty_on_the_lone_cut: [4.3%, 35.6%]
    no_push: [2.1%, 19.6%]
    verdict: >-
      Each is a flat penalty for acting alone, which ADR-0010 rules out, and each pulls the
      Levi-grade soldier further below about 50% than it moves the Rookie.
  first_draft_own_openings_spendable_nape_depth_4:
    trials: 40,000 per cell, from the first draft's run
    rookie: [12.2%, 15.9%, 19.2%, 21.1%]
    levi_grade: [50.3%, 51.2%, 51.6%, 51.1%]
  break_attention_by_need:
    model: >-
      One Break Attention for each build, fresh at its fight-start Stress, with ODM Gear, no Talent
      dice, Pushing when short. 100,000 attempts per cell. A lone soldier's need is 1, plus 1 for
      a Feint, plus the Titan's decoys in a row (OQ-81, as revised in decision batch 3b).
    columns: [need_1, need_2, need_3, need_4, need_5]
    rookie: [82.6%, 49.6%, 20.6%, 5.6%, 0.9%]
    veteran: [83.9%, 54.3%, 26.0%, 8.9%, 2.0%]
    levi_grade: [89.7%, 66.0%, 38.3%, 17.1%, 5.8%]
  break_attention_on_foot:
    model: >-
      A Feint on foot against a grounded Titan: the Rookie's Break Attention with no gear item
      (Perception alone), Pushing when short, 100,000 attempts per cell (tools/probes/batch-3c/onfoot_b3c.py;
      decision batch 3c, 3c-2). With ODM Gear or the horse the Rookie's rates are break_attention_by_need.
    columns: [need_1, need_2, need_3, need_4]
    rookie_stress_1: [74.8%, 37.7%, 11.7%, 1.9%]
    rookie_stress_3: [74.8%, 43.9%, 20.0%, 6.5%]
  card_order_wait:
    model: >-
      The upper bound on decoys wasted, kept beside lone_fight (decision batch 3b, 3b-2). Card
      order only: each round the lone Rookie and the Medium Titan (Tempo 1) come up in random
      order, and the Rookie takes Break Attention on every turn no decoy holds, whether or not the
      Titan's card is still to come, with no Positions, no harm, no Feint, and no limit on decoys.
      Break Attention succeeds at the Rookie's rate for its need (break_attention_by_need). A
      success is usable only if the soldier's next turn comes before the Titan's next card, which
      the decoy spends. Counts the rounds until a usable Nape strike, and the Titan cards that
      resolved against the soldier meanwhile. 200,000 trials per row; a trial still waiting after
      1,000 rounds stops there, so a median over a row that often never strikes overstates the wait.
    columns: [median_rounds, usable_by_round_4, usable_by_round_6, usable_by_round_12, titan_cards_against_through_round_12]
    the_rule_decoys_in_a_row: [4, 50.6%, 69.0%, 92.3%, 2.45]
    batch_3_rule_never_reset: [6, 42.3%, 50.8%, 60.8%, 4.93]
    no_escalation: [4, 57.6%, 78.5%, 97.3%, 1.65]
    no_escalation_with_the_rejected_decoy_cap: [5, 44.1%, 61.1%, 86.9%, 3.29]
    the_rule_means: {rounds: 5.80, titan_cards_against: 2.60}
    no_escalation_means: {rounds: 4.84, titan_cards_against: 1.67}
    no_escalation_with_the_rejected_decoy_cap_means: {rounds: 6.84, titan_cards_against: 3.72}
    note: Hook and Cut (data/engagement/squad-tactics.yaml) removes the wait when a comrade makes the Break Attention.
  lone_fight:
    probe: tools/probes/chapter-05/lone.py, 100,000 lone fights per row, seeds fixed
    model: >-
      One reference Rookie at fight-start Stress 1, mounted at distant, against the reference
      Titan's table (simulation_reference_titan, Thrash at a fixed need of 2, now 6 Attack Dice) in Wooded terrain until its
      retreat clock of 8 segments fills, cards face up. The Rookie carries a Rookie's decoys: the horse, two flares from Squad
      Supply at Funding 3, and the Feint; the cloak is carried and not thrown. The waiting line: stay
      at distant until a round in which every card of the Titan has already come up, then move to
      in-reach and take Break Attention with the horse, then a flare, then the Feint; if the decoy
      still holds when the soldier's next turn comes, fly to blind-spot and make the Nape strike;
      if the Titan's card spends the decoy first, try again on the next such round, pulling back to
      distant on a round in which the soldier's card comes first. The hurried line takes Break
      Attention once at least one of the Titan's cards has come up; at Tempo 1 the lines are the
      same. The soldier dodges every harming behavior, Pushes when short, and takes Stress
      Responses, Push wear, Jams, the Gas Roll with one spare canister, falls, Critical Injuries
      crossing Health boxes, turn-limit Death Rolls, and the Grab countdown with Break Free. A dry
      soldier who carries the spare changes it as their action (Change Canister), and a Jammed
      soldier with gas left or a spare takes Field Repair on their ODM Gear as their action (Wits 2
      alone with no tool kit, needing 1, Pushed when short, each success restoring 1 point of the
      current rating, tried again on a later turn; data/gear/field-repair.yaml), so both still count
      as able to Feint (decision batch 3c, 3c-3). A lone fight ends at the first usable Nape strike,
      when the soldier is devoured or Down, when no decoy is usable (no_decoy_usable_first: no horse
      or flare left, no sound horse under the soldier, and a harness that is dry with no spare, or
      Jammed with neither gas nor a spare to change to, the state in which no Nape strike against a
      standing Titan is legal either), or when the retreat clock is full, since under the retreat the
      forced move comes before any action and no cut follows (the escape itself is not modelled;
      decision batch 5, 5-1 and 5-10). The reference Titan is never grounded in
      this model, so the on-foot Feint against a grounded Titan never arises.
    reproduces: >-
      Every row was re-run under the retreat clock after decision batch 5, on its batch 3b seed, and
      these rows govern; the rows before it were measured to a 12-round horizon. tools/probes/batch-3c/
      lone_b3c.py pins that horizon and reproduces decision batch 3c's staged figures exactly (76.9%
      usable and 0.2% with no decoy usable at Tempo 1; 77.4% and 0.0% at Tempo 2). The two rows marked
      batch 3b's route check turn the spare canister and Field Repair off; under the clock they end 5.2%
      of lone fights at Tempo 1 and 1.5% at Tempo 2 with no decoy usable, against 0.0% under the rule.
      The row with a retreat clock of 12 gives, by round 12, what the horizon gave (76.7% usable).
    columns: [usable_strike_before_the_retreat, median_round_of_the_strike, mean_round_of_the_strike, titan_cards_against_before_the_strike, titan_cards_against_per_fight, critical_injuries_per_fight, devoured, down, no_decoy_usable_first, still_waiting_when_the_retreat_begins, stress_at_the_cut, cut_succeeds, lone_fights_that_kill]
    tempo_1_nape_depth_4:
      - case: the rule (decoys in a row, the Feint, a hold of Tempo cards), with a spare canister and Field Repair
        values: [69.9%, 3, 3.84, 2.46, 3.49, 0.16, 2.7%, 2.6%, 0.0%, 24.8%, 2.66, 14.1%, 9.8%]
        jams: {fights_in_which_the_odm_gear_jams: 2.6%, field_repairs_that_succeed_per_fight: 0.017}
      - case: the rule, batch 3b's route check (no spare canister counted, no Field Repair)
        values: [69.5%, 3, 3.83, 2.45, 3.41, 0.14, 2.4%, 2.4%, 5.2%, 20.5%, 2.65, 14.2%, 9.8%]
      - case: decoys in a row, no Feint
        values: [66.9%, 3, 3.70, 2.39, 2.98, 0.09, 1.7%, 1.7%, 21.6%, 8.1%, 2.58, 14.4%, 9.7%]
      - case: no escalation, no Feint (before batch 3)
        values: [76.1%, 3, 3.73, 2.26, 2.66, 0.06, 1.1%, 1.1%, 15.5%, 6.2%, 2.47, 14.1%, 10.7%]
      - case: no escalation, with the Feint
        values: [80.1%, 3, 3.87, 2.28, 2.94, 0.10, 1.7%, 1.7%, 0.0%, 16.4%, 2.53, 14.2%, 11.4%]
      - case: batch 3's rule (decoys never reset), no Feint
        values: [64.6%, 3, 3.62, 2.33, 2.99, 0.09, 1.7%, 1.7%, 24.5%, 7.5%, 2.56, 14.4%, 9.3%]
      - case: the rejected decoy cap, no escalation, no Feint
        values: [64.3%, 4, 4.01, 2.72, 3.86, 0.18, 3.1%, 3.2%, 5.5%, 23.8%, 2.56, 14.2%, 9.1%]
      - case: the rule, from fight-start Stress 0
        values: [69.1%, 3, 3.88, 2.51, 3.55, 0.16, 2.7%, 2.9%, 0.0%, 25.3%, 1.95, 12.2%, 8.4%]
      - case: the rule, dodging only Grabs and lethal harm
        values: [71.0%, 3, 3.84, 2.45, 3.41, 0.19, 2.5%, 3.0%, 0.0%, 23.4%, 2.67, 14.4%, 10.2%]
      - case: the rule, a retreat clock of 12 (69.7% by round 8)
        values: [76.7%, 4, 4.42, 2.94, 4.14, 0.22, 4.1%, 3.9%, 0.2%, 15.1%, 2.85, 14.2%, 10.9%]
    tempo_2:
      - case: the rule, waiting line, Nape Depth 4
        values: [69.4%, 4, 3.99, 5.58, 7.78, 0.20, 3.3%, 4.1%, 0.0%, 23.3%, 2.85, 15.1%, 10.5%]
      - case: the rule, waiting line, Nape Depth 4, batch 3b's route check
        values: [69.3%, 4, 3.99, 5.56, 7.73, 0.19, 3.1%, 3.9%, 1.5%, 22.1%, 2.85, 15.2%, 10.5%]
      - case: the rule, hurried line, Nape Depth 4
        values: [66.0%, 3, 3.29, 3.50, 5.11, 0.56, 9.5%, 12.4%, 0.0%, 12.0%, 2.78, 14.3%, 9.4%]
      - case: the rule with a one-card hold, waiting line, Nape Depth 4
        values: [40.5%, 4, 4.35, 6.33, 10.44, 0.36, 5.8%, 7.3%, 0.0%, 46.3%, 2.99, 15.1%, 6.1%]
      - case: batch 3's rule with a one-card hold, waiting line, Nape Depth 4
        values: [35.6%, 4, 4.15, 6.09, 10.42, 0.37, 6.3%, 7.5%, 11.9%, 38.8%, 2.96, 15.1%, 5.4%]
      - case: the rule, waiting line, Nape Depth 3
        values: [69.2%, 4, 4.00, 5.59, 7.81, 0.20, 3.4%, 4.0%, 0.0%, 23.4%, 2.78, 34.7%, 24.0%]
    chapter_6: Every Chapter 6 table's lone fight, on its own Tempo, Nape Depth, and Behavior Table, is in data/titans/probe-figures.yaml (lone).
  verdict: >-
    Met at its measurement point on the final full rerun under Attack Dice
    (docs/reviews/simulator-report.md, sections 1, 2.2, and 10). The Rookie's fresh cut at its
    fight-start Stress of 1 succeeds 13.0% of the time (standard error 0.1), inside the band of 8% to
    14%, and the Levi-grade soldier's 47.2% (standard error 0.2) is inside about 50%, which reads 45% to
    55% (tolerance; OQ-79, OQ-127). Reported beside it and not tuned, the in-fight cut on Chapter 5's
    reference Titan succeeds 14.1% at a mean Stress of 2.56. Under the rule as revised in decision
    batches 3b and 3c, 70.3% of lone fights reach a usable strike before the retreat clock fills, most
    often in round 3, after 2.47 Titan cards against the soldier, and against a Tempo 2 Titan the
    waiting line gives 70.3% (lone_fight). The probes, under each entry's fixed need, gave 13.1%,
    47.4%, and 69.9%, with 9.8% of lone fights killing and 24.8% still waiting when the retreat began.

# ------------------------------------------------------------------ target 3: the Grab
grab:
  target: >-
    A Grab kills about 1 time in 3 with comrades close, about 2 in 3 when alone. Comrades close
    means one comrade in reach with the reference build and starting state (a Rookie with Talent 1
    on the Body Part strike at in-reach), over the six cells of witness Stress 1, 2, and 3 with
    Grief 0 and 1: every cell under 50%, and the Stress 2, Grief 0 cell near 1 in 3. The share of
    Grabs the reference Squad's victims die from, with every written rescue in play, is reported
    beside it and not tuned (ADR-0014, as amended in decision batch 3; OQ-50, OQ-95).
  tolerance: {alone: 61.7% to 71.7%, stress_2_grief_0: 28.3% to 38.3%, every_cell: under 50%}   # ADR-0014, as amended in decision batch 5 (OQ-127)
  probe: tools/probes/chapter-05/simple.py (grab_trial) and run_tgrab.py
  model: >-
    Rule (e) of OQ-85: the Grab spends the action of the victim's first counted turn, and a failed
    dodge that spent a later turn gets it back. Victim: the
    reference Rookie at the Health, Strength, and Resolve builds, rookie gives it, with Blade Set 1,
    Grip Breaker 1, and Stress 1, and no earlier Critical Injury unless a row says otherwise. The
    Health is read from builds and never restated here, so it cannot go stale again (decision batch
    13, 13-4's reasoning; round 3 review 1, M6). The crush comes from the torso rows with the
    non-lethal cap, with their Break Free penalties and Down. Unless a row says otherwise, the
    victim's dodge against the Grab failed and spent a turn. Break Free needs 2, with a 2-die penalty
    once lifted, Pushing when short. The Medium Titan and every soldier come up in random card order
    each round, and the holding Titan's cards resolve nothing. Rescuers: Rookies with Strength 4,
    Hamstringer 1, Blade Set 1, and Resolve 3 before Grief, at the cell's witness Stress, at a
    Position the hand can be struck from before the lift; after the lift a rescuer moves to on-body
    and strikes in the same turn. The holding arm is Intact unless a row says otherwise. Witnesses
    make Fear Rolls with every row of the re-cut table, and Stress Responses apply. No Help, Covering,
    Drive, Pry Loose, Break Attention rescue, Nape kill, or Squad Tactic.
  lone:
    trials: 80,000 per row (60,000 for templates_alone)
    rows:
      - {case: victim's dodge failed, death: 69.9%}
      - {case: victim did not dodge, death: 73.1%}
      - {case: "victim always dodges, death per Grab card", death: 55.5%}
      - {case: victim with no Grip Breaker, death: 75.1%}
      - {case: victim at Stress 2, death: 68.1%}
    first_draft_rule_a:
      - {case: victim's dodge failed, death: 70.0%}
      - {case: victim did not dodge, death: 42.7%}
      - {case: "victim always dodges, death per Grab card", death: 55.5%}
    templates_alone:
      - {case: "Brawler (Strength 4, Grip Breaker 1)", death: 69.5%}
      - {case: "Slayer (Strength 4, no Break Free Talent)", death: 75.0%}
      - {case: "Flier (Strength 3, no Break Free Talent)", death: 76.3%}
      - {case: "Hunter (Strength 3, no Break Free Talent)", death: 76.3%}
  comrades_close:
    trials: 40,000 per cell
    cells: [stress_1_grief_0, stress_2_grief_0, stress_3_grief_0, stress_1_grief_1, stress_2_grief_1, stress_3_grief_1]
    one_comrade: [28.7%, 33.4%, 39.1%, 34.1%, 39.7%, 45.1%]
    one_comrade_victim_did_not_dodge: [29.9%, 35.2%, 41.6%, 35.7%, 41.4%, 46.9%]
    one_comrade_victim_always_dodges_per_grab_card: [22.9%, 26.7%, 31.7%, 27.2%, 31.6%, 36.1%]
    two_comrades: [13.1%, 17.3%, 23.5%, 17.8%, 24.1%, 30.3%]
    three_comrades: [6.4%, 9.9%, 15.6%, 10.2%, 15.6%, 21.9%]
    one_template_comrade_with_no_strike_talent: [32.0%, 36.3%, 42.0%, 37.4%, 42.6%, 46.9%]
    first_draft_rule_a_one_comrade_victim_did_not_dodge: [17.3%, 20.2%, 24.1%, 20.8%, 24.2%, 27.1%]
    one_comrade_holding_arm_already_wounded: {stress_2_grief_0: 25.0%}
  health_reports:
    model: >-
      As above. The earlier injuries are untreated leg Critical Injuries that give no Break Free
      penalty: two at Health 5 to 8, and one at Health 4 so the victim starts with a box left. The
      comrade row has one comrade at Stress 2 with Grief 0. The rows ran Health 2 to 6 until decision
      batch 13 (13-1; OQ-190) raised the formula and put a built soldier at 4 to 6 and a rolled one at
      4 to 8, so the rows no longer describe Health values a soldier can have (round 3 review 1, M6).
    columns: [lone, one_comrade]
    # Every figure below is stale until the batch 13 rerun (the file header). Each row carries the
    # pre-batch-13 figure measured at the row that played the same part, so the comparison still runs:
    # health_4 is the one-earlier-injury row, as health_2 was, and health_5 to 8 are the two-injury
    # rows, as health_3 to 6 were. The rerun replaces all ten numbers.
    with_earlier_injuries:
      health_4: [100%, 47.9%]
      health_5: [100%, 47.9%]
      health_6: [69.8%, 33.1%]
      health_7: [69.7%, 33.7%]
      health_8: [69.7%, 33.2%]
    fresh_victim_lone: {health_4: 70.0%, health_5: 69.9%, health_6: 69.9%, health_7: 69.5%, health_8: 69.8%}
    history:
      measured_before_batch_13: >-
        The rows as measured when a built soldier ran Health 2 to 4: two earlier injuries at Health 3
        to 6 and one at Health 2. with_earlier_injuries read health_2 [100%, 47.9%], health_3
        [100%, 47.9%], health_4 [69.8%, 33.1%], health_5 [69.7%, 33.7%], health_6 [69.7%, 33.2%], and
        fresh_victim_lone read health_2 70.0%, health_3 69.9%, health_4 69.9%, health_5 69.5%,
        health_6 69.8%.
  turn_debt:
    model: >-
      As the lone and one-comrade rows, but the victim's card comes after the Titan's and their turn
      this round was already spent in advance by an earlier Reaction, so a dodge against the Grab
      spends the next round's turn. 80,000 trials alone, 40,000 with one comrade at Stress 2 and
      Grief 0 (review round 2, Opus finding 1).
    columns: [dodge_failed, did_not_dodge, always_dodges_per_grab_card]
    with_failed_dodge_refund_rule_e:
      lone: [70.1%, 73.0%, 55.4%]
      one_comrade_stress_2_grief_0: [41.5%, 43.4%, 33.2%]
    without_refund_rule_d:
      lone: [100%, 73.1%, 79.3%]
      one_comrade_stress_2_grief_0: [59.9%, 43.8%, 47.4%]
  squad_model:
    source: prepared_squad_kill (grabs_per_fight, devours_per_fight), reported beside the target and not tuned (OQ-95)
    share_of_grabs_that_kill:
      four_player_characters: 11.3%
      four_player_characters_and_two_helper_squadmates: 3.6%
      template_squad: 18.8%
      two_helper_squadmates_hook_and_cut_hamstring_line_and_escapes: 2.6%
      two_squadmates_screening_beside_the_holder: 4.3%
      large_four_player_characters: 17.7%
    note: Under the retreat clock (prepared_squad_kill, rerun); a Grabbed soldier still held when the Squad is out is devoured or left to the Titans.
  first_draft_rejected:
    - {case: strike penalty 1, one_comrade: 31.3% to 46.8%, two_comrades: 14.2% to 32.5%}
    - {case: strike penalty 2, one_comrade: 35.4% to 47.8%}
    - {case: strike penalty 3, one_comrade: "a cell at 50.6%, above the band"}
  verdict: >-
    Met on the final full rerun under Attack Dice, with witnesses' Fear Rolls on every row of the
    re-cut table (docs/reviews/simulator-report.md, sections 1, 2.3, and 10). On Chapter 5's reference
    Titan a Grab kills a lone victim whose dodge failed 70.0% of the time, inside about 2 in 3, which
    reads 61.7% to 71.7%, and one who did not dodge 72.9%, so declining to dodge gains nothing. With one
    comrade in reach, the Stress 2, Grief 0 cell is 33.3%, inside near 1 in 3, which reads 28.3% to
    38.3%, and the six cells run 28.8% to 48.3%, every cell below 50% (tolerance; OQ-50, OQ-95,
    OQ-127). ADR-0014's Target 4, read on the standard Medium Titan, gives 70.1%, 33.8%, and a worst
    cell of 48.3%, each Met. The reference Squad's share is reported beside it: in full fights 12.0% of
    Grabs devour with 4 player characters (13.0% counting any death while held). The probes, under
    each entry's fixed need and the old Fear table, gave 69.9%, 33.4%, and 11.3%.

# ------------------------------------------------------------------ the binding Jam test (OQ-72)
jam_test:
  target: >-
    The Attention holder, dodging for three rounds with Stress Responses, Help, Covering, and turn
    debt applied, Jams in no more than a third of fights (decisions file, Chapter 5 constraints;
    OQ-72). It is accepted on the worst legal support pattern against behaviors a Behavior Table
    deals, with every card at the kill pool reported as an upper bound (OQ-96).
  probe: tools/probes/chapter-05/simple.py (jam_fight)
  model: >-
    The reference Rookie (Agility 3, ODM Gear 2 when these figures were measured, ODM Gear 3 after
    decision batch 11, no dodge Talent, Stress 1 when the fight begins)
    holds the Attention of every Titan in the cell for three rounds. Each Titan is dealt its Tempo in
    cards. The Rookie makes one dodge against each Titan each round, Pushing when short of the first
    card's fixed need, and the dodge is compared with that Titan's other card. Stress rises, Stress
    Responses apply, and a Pushed roll whose Gear Dice show any 1 wears the ODM Gear by 1 point
    (batch 11's cap; these figures were measured under the older rule, 1 point per Gear Die showing
    1, with Gear Dice never re-rolled); the fight counts as Jammed when the rating reaches 0. Help gives the same number of dice to every dodge, and Covered
    columns Cover every Push. Turn debt never removes a dodge, because a Reaction can always spend a
    later turn. 60,000 fights per cell.
  tiers:
    table: >-
      The acceptance reading (OQ-96). Each card's behavior is rolled on the reference table by the
      Behavior Table procedure (move-up, no repeats) with the holder at in-reach, so Shake Off
      resolves as its fallback, Thrash, at the control pool.
    kill: Every card at the kill pool. Reported as an upper bound.
    mix: Each card's tier drawn at random. Reported for comparison.
  columns: [help_0, help_0_covered, help_1, help_1_covered, help_2, help_2_covered, help_3, help_3_covered]
  table:
    small: {one_titan: [6.7%, 8.5%, 5.9%, 7.2%, 5.3%, 6.4%, 4.5%, 5.5%], two_titans: [14.9%, 22.3%, 13.2%, 19.8%, 11.8%, 17.1%, 10.2%, 14.7%]}
    medium: {one_titan: [7.2%, 9.1%, 6.6%, 8.0%, 6.1%, 7.3%, 5.3%, 6.6%], two_titans: [16.4%, 24.5%, 14.8%, 22.0%, 13.5%, 19.9%, 12.3%, 17.7%]}
    large: {one_titan: [10.1%, 12.4%, 9.4%, 11.8%, 8.8%, 11.3%, 8.4%, 10.5%], two_titans: [21.1%, 32.7%, 20.3%, 31.6%, 19.3%, 29.7%, 18.5%, 28.2%]}
  kill:
    small: {one_titan: [8.3%, 10.8%, 7.6%, 9.3%, 6.6%, 8.6%, 5.9%, 7.4%], two_titans: [18.3%, 28.2%, 16.4%, 25.3%, 14.7%, 23.1%, 13.2%, 19.6%]}
    medium: {one_titan: [10.6%, 13.2%, 10.1%, 12.7%, 9.8%, 12.0%, 9.2%, 11.2%], two_titans: [22.2%, 34.6%, 21.6%, 33.3%, 20.7%, 32.3%, 19.6%, 30.3%]}
    large: {one_titan: [10.9%, 13.7%, 11.0%, 13.6%, 10.8%, 13.3%, 10.6%, 13.3%], two_titans: [23.7%, 35.4%, 23.3%, 35.2%, 22.9%, 35.3%, 22.6%, 34.6%]}
  mix:
    small: {one_titan: [6.7%, 8.5%, 6.1%, 7.2%, 5.2%, 6.2%, 4.7%, 5.5%], two_titans: [14.8%, 22.2%, 13.5%, 19.8%, 11.6%, 17.0%, 10.4%, 14.6%]}
    medium: {one_titan: [7.4%, 9.1%, 6.8%, 8.3%, 6.2%, 7.4%, 5.5%, 6.6%], two_titans: [16.2%, 24.9%, 14.7%, 22.4%, 13.6%, 20.3%, 12.5%, 18.1%]}
    large: {one_titan: [10.0%, 12.4%, 9.5%, 11.7%, 9.1%, 11.3%, 8.8%, 10.4%], two_titans: [21.0%, 32.8%, 20.2%, 31.2%, 19.6%, 29.8%, 18.2%, 27.9%]}
  first_draft_withdrawn: >-
    The first draft gave Help and Covering on a coin flip and every Titan 2 cards a round; its worst
    cell was 28.5%. That support pattern is withdrawn (OQ-96).
  verdict: >-
    Met on the final full rerun under Attack Dice, with the holder dodging only a card whose roll
    scores 1 or more successes (docs/reviews/simulator-report.md, sections 4.2 and 10). Under the
    acceptance reading on the reference table every cell is under a third. The worst is two Large
    Titans, Covered, no Help, at 28.3%; two Medium Titans give 20.8% and two Small Titans 22.6%. On
    the every-card-at-the-kill-pool upper bound, two Medium Titans reach 29.6% and two Large Titans
    33.0%, both under a third (OQ-96). The worst pattern is still Covering with no Help. The probes,
    under each entry's fixed need, gave 32.7% for two Large Titans and 34.6% and 35.4% on the upper
    bound. Any change to Attack Dice, a Tempo, or the wear rule re-runs the test before it is accepted.

# ------------------------------------------------------------------ gas
gas:
  target: >-
    A full gas canister lasts about 9 rounds of ODM use (median 8, mean 9.25), about 6 when pushing
    every round (median 6, mean 6.33) (ADR-0014, as amended in decision batch 3b; Chapter 4).
  tolerance: {median_rounds: exactly 8, median_rounds_pushing_every_round: exactly 6}   # a median target reads exactly (ADR-0014, as amended in decision batch 5; OQ-127)
  figures: >-
    This chapter adds no ODM use and changes no gas rule (data/engagement/positions.yaml, moves,
    odm_use_named_by_this_chapter), so Chapter 4's figures stand: medians 8 and 6, the medians the
    target states (docs/rules/04-gear.md, section 4.3). The gas family in
    simple.py reproduces them, re-run after decision batch 5 with 200,000 canisters per case. Read
    exactly, both medians are met (tolerance), and the final full simulator rerun gives medians 8 and
    6 (means 9.24 and 6.34), Met (docs/reviews/simulator-report.md, section 1).

# ------------------------------------------------------------------ what the Phase 1 simulator must model
# ADR-0014 as amended in decision batch 3 (OQ-98); docs/rules/DECISIONS-2026-09-14.md, Constraints on
# the undrafted Phase 1 chapters. This list is the simulator's specification.
simulator_cases:
  - Every Chapter 1 to 5 rule under published policies for each reference-build action, re-measuring every target under its baseline policy with sensitivity rows beside it (probes, baseline_policy; OQ-98).
  - Read and Call It, with a Tactician Reading from distant every round and Calling It, reported against the Jam test and the PC Critical Injury target (OQ-84).
  - Wings under the standing cadence, and initiative swaps (OQ-77, OQ-97).
  - Every Squad Tactic alone and in pairs with the six Grab cells, and tactic policies beyond squad_tactics (OQ-89).
  - Pry Loose, Help on Break Free, and Break Attention rescues, with rescue policies that choose them where a player would (OQ-85, OQ-98).
  - Decoy screens from distant and beside the Attention holder under Break Attention's needs as revised in decision batches 3b and 3c, with the flag and nearest rules of decision batch 3e (decoys in a row, the Feint with its on-foot way against a grounded Titan, a hold of Tempo cards, flags that last until the end of the Titan's next card that resolves a behavior, and the nearest rung met at the closest Position), with Feint policies for Squadmates and player characters, against the Expedition PC Critical Injury target (OQ-81).
  - Background Titans, the retreat clock, and the retreat in the simulator's own round, with the horizon a safety cap no fight may reach, the committed rows re-run under the clock, Background clock lengths measured against a retreat rate per Titan Engagement (8.2% at Medium and 13.8% at Large in decision batch 5's measurement), and a retreat policy that also treats and chooses Pry Loose where a player would (OQ-87, OQ-126).
  - Treatment in the care windows between fights, Death Rolls, and the interim day and interim issue between sessions (decision batch 5, OQ-120), where a horse returns to 2 of 2 and ODM Gear worn at or above the Funding row carries (OQ-93).
  - The targets as amended, each judged Met or Missed against its tolerance with the second-seed rule for a figure past an edge by at most 2 standard errors (OQ-127), namely the lone Rookie's 8% to 14% band on the fresh cut and the Levi-grade soldier's about 50% (OQ-79), with the in-fight lone cut and the Stress it is made at reported beside them and the lone fight at Tempo 1 and 2 on the waiting and hurried lines with Change Canister and Field Repair (solo_nape, lone_fight), and comrades close as one comrade in reach with the reference Squad's Grab death share reported (OQ-95).
  - Eyes and arm Toughness for every Size Class, Large against the PC Critical Injury and PC death targets, and Medium at Tempo 2 and the other rejected alternatives as sensitivity rows (OQ-78).
  - The Jam test inside the full-fight model, with helpers' cards, Positions, and actions deciding who can Help and Cover (OQ-96).
  - The reports ADR-0014 names, namely the lowered-Health Squad (each soldier at Health 5, one below the Rookie's) and the Health 4, 7, and 8 builds, the template Squad, and the Flier template's dodge (ADR-0014, as amended in decision batch 13; the rows read Health 3 and the Health 2, 5, and 6 builds before it).
  - Round-time counters (tracker writes, ladder evaluations, pools, dodges, Fear Rolls, and Gas Rolls per round) for one and for two Focus Titans, beside the timed paper test (data/engagement/round.yaml, round_time; OQ-97).
  - Each Behavior Table's kill share by previous behavior and by Broken parts (data/engagement/behavior-procedure.yaml, move_up_shares; OQ-80).
  - The gap between these probes and the Opus review 1 model on the prepared-Squad kill (OQ-78).
  - Every case Chapter 6 adds (data/titans/tuning.yaml, simulator_cases), including the start-of-fight Fear Rolls for a first Titan Engagement and for an Abnormal, which fight.py does not make (OQ-105).
  - The four-striker Squad (4 eager strikers and no cutters) beside the baseline Squad on the reference Titan and every Chapter 6 table, reported beside every target as a sensitivity row; the prepared-Squad target is read under the baseline policy, and the simulator's report is the input to the open question on cutting legs (ADR-0014, as amended in decision batch 4b; decision batch 4b, 4b-2; OQ-112).
  - Horsemanship's dice on a dodge made with the horse only, never on foot (decision batch 5, OQ-121); Draw Attention only from a Position other than Distant (OQ-113); a Grab's hold before its crush (OQ-124); and a fall read relative to its reference Titan (OQ-123).
  - "Failed Nape strikes: of strikes that fall short, the share whose striker is the target of the Titan's next
    resolved behavior, and the striker's second-strike rate, a second Nape strike before the Titan's Attention
    returns to them, by table and by Anchor Rating, read against the lone-strike band (ADR-0014; round 3
    review 1, C6)."
  - "The behavior roll under Frenzy: the share of rolls resolving each table's result-1 entry by Frenzy, which
    the move-up rule's wrap at Frenzy 0 and its turn back down at Frenzy 1 or more decide (round 3 review 1,
    C3); and the kill share by previous behavior, Broken parts, and Frenzy, read as a figure and not as a pass
    or a fail (round 3 review 1, C4)."
  - The Expedition targets, once the Expedition rules exist.
