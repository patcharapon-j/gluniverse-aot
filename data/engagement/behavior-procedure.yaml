# The Next Behavior and a Focus Titan's card: when the hidden Next Behavior is rolled, how an
# illegal result moves, and the steps of resolving one of the Titan's cards.
# Source of truth under ADR-0012. docs/rules/05-titan-engagement.md (section 5.5) references this
# file and does not repeat its rows.
id: behavior-procedure
name: Next Behavior and Titan Cards
chapter: 05-titan-engagement
adrs: [ADR-0001, ADR-0010, ADR-0015, ADR-0019, ADR-0024]
decided: [OQ-80, OQ-107, OQ-145, OQ-192, OQ-193, OQ-195, OQ-196]

# ------------------------------------------------------------------ the Next Behavior
next_behavior:
  hidden: >-
    The GM rolls the Next Behavior where the players cannot see it and records it face down on the
    tracker (data/engagement/round.yaml, gm_tracker). It is revealed only by a Read
    (data/engagement/read.yaml), by a telegraph effect, or when a card resolves it. The GM never
    re-rolls it, changes its row, or makes any choice this file does not name (ADR-0024, limit 8).
    The roll is D6 plus the Titan's Frenzy at the moment it is rolled (roll; frenzy_when).
  rolled_when:
    - The Titan becomes a Focus Titan.
    - One of its cards has resolved a behavior (resolving_a_card, next).
    - A card came up while a decoy held its Attention (resolving_a_card, decoy).
  kept_when: >-
    A card resolves no behavior because the Titan holds a Grabbed soldier, or because no soldier
    holds its Attention. The Next Behavior stays as it is.
  previous_behavior: >-
    The entry the Titan most recently resolved, or the Next Behavior a decoy's card spent. A Titan
    that has just become a Focus Titan has none.
  frenzy_when: >-
    The Next Behavior is rolled in advance of the card that resolves it, so the roll takes the
    Titan's Frenzy as it stands at the moment of the roll, and nothing re-reads it afterwards
    (data/engagement/titan-format.yaml, frenzy; decision batch 13, 13-11; OQ-193). Three
    consequences, and every step below reads them the same way. A Titan that has just become a Focus
    Titan is at Frenzy 0, so its first Next Behavior is a plain D6. A Next Behavior rolled during one
    round and resolved in the next was rolled at the earlier round's Frenzy, so the escalation
    reaches the table one card late. And the roll, once made, stands as it fell (ADR-0024, limit 14):
    the frenzy end step raises the counter and never touches a Next Behavior already rolled.
  roll:
    - id: roll
      text: >-
        Roll D6 and add the Titan's Frenzy as it stands now (frenzy_when). A total above 6 reads as
        6 (data/engagement/titan-format.yaml, behavior_table, result_above_the_table). Find the entry
        whose results include the total.
    - id: legal
      text: >-
        The entry can be rolled if it is not the previous behavior and the Titan meets its
        body_parts_used (data/engagement/titan-format.yaml, entry_fields).
    - id: move-up
      text: >-
        If it cannot, take the entry that holds the next higher result, skipping entries already
        checked, and test it the same way. Repeat until an entry can be rolled. What happens at the
        top of the table depends on the Titan's Frenzy at the roll. At Frenzy 0, after 6 comes 1, as
        it always has. At Frenzy 1 or more the roll never wraps: if the entry at 6 cannot be rolled,
        turn back down and take the entry that holds the next result below the total, then the next
        below that, to 1 (decision batch 13, as amended after round 3 review 1, C3). A frenzied
        Titan denied the top of its table takes the most dangerous thing left to it, never the
        bottom.
    - id: thrash
      text: If no entry can be rolled, the Next Behavior is Thrash.
  positions_not_checked: >-
    Rolling never checks Positions or Attention, because Attention is evaluated only when a card
    comes up.
  move_up_shares: >-
    For Chapter 6's authors: at Frenzy 0 an entry that cannot be rolled passes its share of results
    to the entry above it, and the entry at 6 passes its share to the entry at 1. At Frenzy 1 or
    more the entry at 6 passes its share to the entry at 5 instead, and so on down, so the faces
    Frenzy piles onto result 6 never land on the table's weakest entry. So the entry after the previous behavior, and the entry after one whose Body
    Parts are Broken, are rolled more often until that changes. On the reference Titan with both
    arms Broken, Bite takes Grab's share. The simulator reports each table's kill share by previous
    behavior and by Broken parts (data/engagement/tuning.yaml, simulator_cases). Chapter 6 reads
    "any state" in its constraint as every previous behavior combined with every count of Broken
    eyes, arms, and legs. Under that reading, at Frenzy 0, the reference Titan's table reaches a kill
    share of 4 in 6 (previous behavior Shake Off, both arms Broken), and every table in
    data/titans/ stays at or under one half (data/titans/tuning.yaml, targets,
    every_standard_table; OQ-101). The constraint is checked at Frenzy 0 only. At Frenzy 1 to 3
    every table's kill share by previous behavior climbs past one half and reaches 6 in 6 at
    Frenzy 3 after its result-4 entry, which is what Frenzy is for; the rerun reports those shares,
    and no author checks them (round 3 review 1, C4).

# ------------------------------------------------------------------ one Titan card
resolving_a_card:
  steps:
    - id: dead
      text: If the Titan has died, its card does nothing.
    - id: holding
      text: >-
        If the Titan holds a Grabbed soldier, the card resolves no behavior. The Attention Ladder is
        not evaluated, the Next Behavior is kept, and the flags for this Titan stay as they are
        (data/engagement/attention.yaml, flag_duration; decision batch 3e). Stop.
    - id: decoy
      text: >-
        If a decoy holds the Titan's Attention, the card resolves no behavior, and the cards the
        hold has left fall by 1 (data/engagement/round.yaml, gm_tracker, focus_titan_row). The Next
        Behavior becomes the previous behavior, any Call It on it ends, and a new Next Behavior is
        rolled (next_behavior, roll). If the hold has no cards left, it ends: evaluate the
        Attention Ladder (data/engagement/attention.yaml, evaluation). Otherwise the decoy keeps the
        Titan's Attention and the ladder is not evaluated. Either way the flags for this Titan stay
        as they are, because the card resolves no behavior (data/engagement/attention.yaml,
        flag_duration; decision batch 3e). The Titan's decoys in a row does not change. Stop.
    - id: attention
      text: >-
        Evaluate the Attention Ladder (data/engagement/attention.yaml, evaluation). If no soldier
        holds its Attention, the card resolves no behavior, the Next Behavior is kept, and the flags
        for this Titan stay as they are. Stop.
    - id: choose
      text: >-
        Take the Next Behavior's entry. If the Titan does not meet its body_parts_used, the
        behavior is Thrash. Otherwise, if the Attention holder does not meet its
        position_requirement, re-evaluate the Attention Ladder over only those of the Titan's
        candidates who do meet it (data/engagement/attention.yaml, evaluation, retargeting;
        decision batch 13, 13-9; OQ-192). The soldier that evaluation returns holds the Titan's
        Attention from that moment, and the entry resolves against them: the entry's targets are
        read from the new holder. Only if no candidate meets the position_requirement is the
        behavior its fallback entry, and the fallback is tested the same way: if it is thrash, is the
        previous behavior, or the Titan does not meet its body_parts_used, the behavior is Thrash;
        otherwise, if the Attention holder does not meet the fallback's own position_requirement, the
        Titan retargets over the candidates who do, by the same evaluation, and the behavior is
        Thrash only when no candidate meets that either (decision batch 13, 13-9, completed after
        round 3 review 1, M1). A fallback tested against a holder the rolled entry has already failed
        against is the inertness 13-9 exists to remove. Thrash can always happen, and it is the only
        entry that can follow itself. The Titan wanted one soldier and could not reach them, so it
        takes what it can catch rather than flailing.
      retarget: >-
        The Ladder's own evaluation and tie-breaks, over the narrowed set and nothing else: no new
        rule of selection is added, the choice stays deterministic, and the GM picks nothing
        (ADR-0024, limit 8; ADR-0010). It changes Attention only, and moves no soldier
        (data/engagement/positions.yaml, changes_to_position, not_changed_by). The flags for this
        Titan stand until the next step, as they do through any evaluation
        (data/engagement/attention.yaml, flag_duration).
    - id: roll-and-announce
      text: >-
        Announce the behavior's name, tier, and targets to every soldier. If the entry lists
        attack_dice, roll that many Titan Dice in the open (data/engagement/titan-format.yaml,
        titan_dice) and announce the successes: the card's Severity, the same number for every
        target. An entry with no attack_dice rolls nothing and harms no one. The roll takes no
        Circumstances, and the GM never re-rolls or adjusts it (ADR-0024, limits 8 and 16; ADR-0019).
    - id: reactions
      text: >-
        If the roll scored 0 successes, the card whiffs against every target, a target who cannot make
        a Reaction included, and no Reaction is made against it. Otherwise each target, knowing the
        Severity, chooses whether to dodge, or cancels with a dodge already made against this Titan
        this round, as Chapter 1, section 1.9 (Attack and Reaction) states: each dodge success
        cancels one of the card's successes, separately for this card, and the card lands on that
        target on 1 or more Net Successes and whiffs on 0 (data/engagement/titan-format.yaml,
        titan_dice, lands). A target whom a state or result forbids a Reaction, or who makes none,
        cancels nothing, so every success is net. A Call It on this Next Behavior adds its Bonus
        Dice to a dodge made against this card (data/engagement/read.yaml, call_it).
    - id: effects
      text: >-
        For each target on which the behavior lands, apply its effects in order, target by target
        in initiative card order (a Wing Squadmate after its player character), reading the Net
        Successes only where an effect names them (data/engagement/titan-format.yaml,
        effect_types). A telegraph effect applies whether the card landed or whiffed. A target who
        dies receives none of the card's later effects; every other target still does (decision
        batch 4, OQ-107). Fear Rolls the effects cause are made as data/mind/fear-rolls.yaml (limits,
        timing) states.
    - id: next
      text: >-
        The card has resolved a behavior whether it landed or whiffed (ADR-0024, limit 2; decision
        batch 8, 8-1). The new Next Behavior rolled here takes the Titan's Frenzy as it stands at
        this moment (next_behavior, frenzy_when).
        The behavior becomes the previous behavior, the Titan's decoys in a row returns to 0
        (data/engagement/attention.yaml, break_attention, needs_rule), and every flag for this Titan
        clears (data/engagement/attention.yaml, flag_duration; decision batch 3e). Roll the new Next Behavior
        (next_behavior, roll). If the behavior had a telegraph effect, reveal the new Next Behavior to every
        soldier. It stays revealed until a card resolves it or a decoy's card spends it.
  gm_choices: none (ADR-0024, limit 8)   # the GM never picks a row, a fallback, a target, or an order
