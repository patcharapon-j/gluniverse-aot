# Skirmishes, the playtest minimum: soldiers against people. Starting one, Engaged and Apart, the
# ambush, rounds and turns, actions, the attack and its cancelling roll, damage, weapons, the Grapple
# and Held, Grit and breaking, Parley, Size Up, ending, and what a Skirmish changes elsewhere.
# Source of truth under ADR-0012. docs/rules/07-playtest-rules.md (section 7.4) references this file
# and renders its tables from it (tools/render/render.py). The Foes, Guard, and the foe rule are in
# data/skirmish/foes.yaml.
# Playtest rule: Phase 2 replaces this file (decision batch 7, 7-17; decision batch 8, 8-4, 8-7, 8-12;
# OQ-143, OQ-145).
id: skirmish
name: Skirmishes
chapter: 07-playtest-rules
status: playtest
adrs: [ADR-0005, ADR-0016, ADR-0017, ADR-0018, ADR-0019, ADR-0024]
decided: [OQ-143, OQ-145, OQ-148, OQ-172, OQ-174, OQ-179]

meaning: >-
  A scene in which soldiers fight people. No Titan takes part. A Titan Engagement rule applies in a
  Skirmish only where this file names it.

# ------------------------------------------------------------------ starting
starting:
  begins_when: >-
    A rule names a Skirmish, such as the Night table's prowlers row (data/expedition/hazards.yaml) or a
    Mission Brief, or the table's scene framing sets the Squad against people, as scene framing starts a
    Titan Engagement (Chapter 5, section 5.1).
  names: >-
    The start names one Foe kind from data/skirmish/foes.yaml, and may name how many, which side has the
    Ambush, whether it is night, and which soldiers take part. One Foe group takes part in a playtest
    Skirmish.
  number: The number the start names, or else the kind's group_size (data/skirmish/foes.yaml).   # decision batch 8, 8-30 (OQ-155, item a); the trooper's group is a fixed 4 under 8-33 (OQ-164)
  night: A Skirmish that begins at a Night Camp is at night.
  taking_part: >-
    The soldiers the start names; if it names none, every living soldier in the Squad on the same
    Expedition, or every living soldier in the Squad when no Expedition is under way.
  steps:
    - id: foes
      text: >-
        Set out the Foe group: its Foes, labelled 1 upward, each at full Health, with its weapons
        (data/skirmish/foes.yaml, foes) and its firearms loaded (data/skirmish/foes.yaml, firearms).
    - id: range
      text: Every soldier taking part is Apart from every Foe, unless the start names otherwise.
    - id: ambush
      text: Settle the Ambush (ambush).
    - id: round-1
      text: Round 1 begins (rounds).

# ------------------------------------------------------------------ Engaged and Apart
engaged_and_apart:
  states:
    - {id: engaged, name: Engaged, meaning: "Within arm's reach of a Foe."}
    - {id: apart, name: Apart, meaning: "Not within arm's reach of a Foe."}
  per_pair: Each soldier is Engaged with or Apart from each Foe separately.
  not_positions: >-
    Engaged and Apart are not Positions. A Skirmish has no Position, no Anchor Rating, no ODM move, no
    Fly roll a rule calls for, and no airborne soldier; the one Fly roll in a Skirmish is a called roll the
    GM names for fly (actions, called_roll), which makes no soldier airborne (decision batch 9, 9-43).
  moves:
    - {id: close-in, text: "The soldier becomes Engaged with one Foe they name."}
    - {id: break-away, text: "The soldier becomes Apart from every Foe they are Engaged with."}
    - {id: stay, text: "The soldier's range does not change."}
  mount: A move may also include one mount or one dismount (data/gear/horses.yaml, mounted).
  held: A Held soldier's move, and the move of a soldier who holds a Foe, change nothing.
  down: A Down soldier's move changes nothing, and they stay Engaged with or Apart from each Foe as they were.   # decision batch 8, 8-30 (OQ-155, item c)
  foes: A Foe becomes Engaged or Apart only through the foe rule (data/skirmish/foes.yaml, foe_rule).
  tracked_value: >-
    position-change (data/character/action-catalog.yaml, tracked_values), changed by a move, which is not
    a Catalog entry, as in a Titan Engagement.

# ------------------------------------------------------------------ the ambush
ambush:
  from_the_start: A start may give the Ambush to the Foes, as the prowlers row does.
  squad_attempt:
    # decision batch 8, 8-30 (OQ-155, item d)
    # decision batch 9, 9-7: the approach is a ruling
    when: >-
      Before round 1 of a Skirmish whose start does not give the Ambush to the Foes, if the GM rules that
      the Squad can approach unseen (data/skirmish/foes.yaml, gm_rulings, ambush_approach).
    approach_not_possible: If the GM rules that the Squad cannot approach unseen, no roll is made and no side has the Ambush.
    roll: sneak-for-the-ambush (rolls)
    on_success: The Squad has the Ambush.
    on_failure: No side has the Ambush.
  has_not_yet_acted: A soldier or a Foe has not yet acted in a Skirmish until its first card of that Skirmish has come up.
  effects:
    - id: order
      text: In round 1, every card of the side with the Ambush comes up before every card of the other side. Cards within a side keep their order.
    - id: dice
      # decision batch 8, 8-30 (OQ-155, item i)
      text: >-
        A soldier's Fight or Shoot roll against a Foe that has not yet acted gains 2 Bonus Dice
        (data/core/bonus-dice-sources.yaml, ambush). A Foe with the Ambush rolls 2 more Attack Dice
        against a soldier who has not yet acted.
    - id: no-cancelling-roll
      text: >-
        An attack by the side with the Ambush on a target that has not yet acted cannot be answered: the
        soldier makes no Reaction and the Foe rolls no Guard, so every success of the attack is net.
  changes: [ambush-set]

# ------------------------------------------------------------------ rounds and turns
rounds:
  cards: >-
    At the start of each round, deal initiative cards as a Titan Engagement does
    (data/engagement/round.yaml, initiative_cards): one to each soldier taking part, living, Down or not,
    and one to the Foe group while any of its Foes is in the Skirmish. Cards come up lowest first. There
    are no Wings and no swap step.
  soldier_card: >-
    The soldier takes one turn of one move and one action (Chapter 1, section 1.9), in the order
    data/engagement/round.yaml (turn_order) gives. A Squadmate takes its turn on its own card.
  foe_card: Each Foe of the group still in the Skirmish acts once, in label order, by the foe rule (data/skirmish/foes.yaml, foe_rule).
  end_of_round:
    - Every Foe of a group that broke leaves (grit).
    - Check the ending (ending).
  turns_count: >-
    A soldier's turn in a Skirmish counts for every rule that counts turns: a turn time limit
    (data/harm/death-rolls.yaml), spending a turn (Chapter 1, section 1.9), and a Drive's turn tests.

# ------------------------------------------------------------------ actions
actions:
  skirmish_entries: [fight, shoot, break-free, reload, release, persuade, size-up]   # persuade as a Parley
  other_entries: [help, treat-injury, rally, lift-comrade, pass-item, take-item, change-canister, swap-blade-set, shed-load, mount-or-dismount]
  never: Every Action Catalog entry whose context is titan-engagement (data/character/action-catalog.yaml).
  # decision batch 8, 8-30 (OQ-155, item h)
  treat_and_rally: >-
    Treat Injury and Rally are actions in a Skirmish, used as in a Titan Engagement (Chapter 3, sections
    3.5 and 3.11) with no Position requirement: the patient or the Rallied comrade is any other soldier
    taking part, or the soldier themselves as Chapter 3 allows. A failed use can be tried again on a later
    turn.
  reload: >-
    Reload loads one empty firearm and spends 1 Shot of Squad Supply, the soldier's action, and, for a
    musket, the soldier's move (data/character/action-catalog.yaml, reload).
  # decision batch 9, 9-8 (ADR-0024, limit 9)
  improvised_act: >-
    A soldier may attempt an act no entry covers. Before the pool is built, the GM names its model entry:
    one entry of kind action this list allows whose effect the act imitates, never a Reaction (Block or
    Dodge), a roll, a fixed roll, or an option, which rules out reload, release, swap-blade-set, shed-load,
    and mount-or-dismount (data/character/action-catalog.yaml, kind). The act spends the soldier's action,
    is rolled as the model entry is, takes Circumstances as any roll, carries the model entry's
    restrictions (a Foe's Guard still rolls against it), and produces only the model entry's effect at
    its size (data/character/action-catalog.yaml, uncatalogued_actions). An object that is not a gear item,
    thrown at a Foe Engaged or Apart, is a Shoot at that object's damage and Injury Type (weapons,
    bare-hands), with no Gear Dice. An act the soldier describes that is not an entry taken as written is
    an improvised act even when a tracked value it would change matches an entry, and whether a described
    act is an entry taken as written is part of the GM's ruling on its model entry
    (data/character/action-catalog.yaml, uncatalogued_actions, in_a_fight; decision batch 9, 9-27 and 9-41).
  # decision batch 9, 9-36 (OQ-179)
  called_roll: >-
    A soldier may make a called roll in a Skirmish only for an act no entry of kind action this list allows
    could model, that would change nothing the Skirmish tracks: no Foe's Health, Guard, Grit, Parley value,
    Attack Dice, or Watch, no Engaged or Apart, no card. It spends the action, on the soldier's turn and
    never in place of a Reaction (reactions), Help on it is the Skirmish's (rolls,
    called-roll), and it never gives an effect an entry has (data/core/dice-pool.yaml, called_roll,
    in_a_fight). The GM may name fly for it (data/character/action-catalog.yaml, fly, requirements): it
    takes the ODM Gear's Gear Dice (decision batch 9, 9-24), makes no soldier airborne, makes no Gas Roll,
    drops no one on a Jam (data/gear/odm-gear.yaml, airborne, jam), and gives no Engaged or Apart; a soldier
    whose ODM Gear is Jammed is named Agility alone (decision batch 9, 9-43).

# ------------------------------------------------------------------ the attack
# Chapter 1, section 1.9 (Attack and Reaction) gives the procedure once, for Titans and people. This
# block adds only what is the Skirmish's: who rolls what, Guard, and damage (decision batch 8, 8-4, 8-5).
attack:
  procedure: Chapter 1, section 1.9 (Attack and Reaction)
  by_a_soldier:
    roll: A Fight or Shoot roll with a full pool, which the soldier may Push before the Foe's Guard is rolled.
    cancelling_roll: the Foe's Guard (data/skirmish/foes.yaml, guard)
  by_a_foe:
    roll: The Foe's Attack Dice as base dice, succeeding on 6, never Pushed, and with no other dice (data/skirmish/foes.yaml, foes, attack_dice).
    cancelling_roll: the target's Reaction, if they make one (reactions)
  announced: The attack's successes are its Severity, announced before any cancelling roll is made.
  cancels: Each success of the cancelling roll cancels one success of the attack.
  lands_on_net_successes: 1
  whiff: On 0 Net Successes the attack does nothing.
  no_cancelling_roll: Against a target who makes no cancelling roll, every success of the attack is net.

reactions:
  entries:
    - {entry: block, against: [fight]}
    - {entry: dodge, against: [fight, shoot]}
  per_foe_per_round: >-
    A soldier makes at most one Reaction against each Foe per round. Its successes cancel against the
    attack it answered and, separately, against each later attack that Foe makes on the soldier that
    round, never used up (Chapter 1, section 1.4, item 4). A Block cancels only Fight attacks.
  spends: one turn, as Chapter 1, section 1.9 gives
  forbidden:
    - A Held soldier cannot Dodge.
    - No Reaction answers an attack the Ambush leaves unanswered (ambush).
    - A state or result whose row forbids Reactions forbids them here too (Chapter 1, section 1.9).
  titans: No Titan takes part in a Skirmish, and no Titan can be blocked (ADR-0019).

# ------------------------------------------------------------------ damage
damage:
  amount:
    base: the weapon's damage (weapons)
    per_net_success_beyond_the_first: 1
  injury_type: the weapon's (weapons)
  on_a_soldier: >-
    Damage in Chapter 3's sense (data/harm/health.yaml, harm_kinds, damage), with the weapon's Injury
    Type and a rolled Injury Location. The Critical Injury it inflicts at 0 current Health takes its
    name and any rider from its Injury Type (data/harm/critical-injuries.yaml, types, type_riders). A
    person never inflicts a Critical Injury directly (ADR-0018).
  on_a_foe:
    health: Damage lowers the Foe's Health, never below 0. A Foe has no Critical Injuries, no Stress, and no Down state.
    at_zero: The Foe is out of the Skirmish.
    killed_by: [cut, pierce, burn]   # decision batch 8, 8-30 (OQ-155, item e): Burn kills; ADR-0018, as amended
    out_cold_by: [crush]
    out: An out-of-the-Skirmish Foe, dead or out cold, takes no further part and is never a target again in it.
  grapple: A Grapple that lands deals no damage (grapple).
  changes: [foe-harm]

# ------------------------------------------------------------------ weapons
# Every row carries its damage and its Injury Type (decision batch 7, 7-17; decision batch 8, 8-4, 8-7).
weapons:
  row_fields:
    id: the weapon's id
    name: the weapon, as printed
    used_with: fight or shoot, the attack it makes
    injury_type: crush, bite, burn, cut, or pierce (data/harm/critical-injuries.yaml, types)
    damage: the base damage of a landed attack
    target: engaged (only a target the attacker is Engaged with), apart (only a target the attacker is Apart from), or either
    gear_item: the gear item that gives its Gear Dice (data/gear/items.yaml), or null for none
    spends: what an attack with it spends beyond the action
    wielded_by: soldiers, Foes, or both
    notes: what else the row states
  rows:
    - id: blade-set
      name: Blade Set
      used_with: fight
      injury_type: cut
      damage: 2
      target: engaged
      gear_item: blade-set
      spends: nothing
      wielded_by: [soldier]
      notes: The Blade Set in the handles gives the Gear Dice. A Pushed roll whose Gear Die shows 1 ruins it (Chapter 4, section 4.4).
    - id: bare-hands
      name: Bare hands, or an object that is not a gear item
      used_with: fight
      injury_type: crush
      damage: 1
      target: engaged
      gear_item: null
      spends: nothing
      wielded_by: [soldier, foe]
      notes: >-
        A Grapple is made with it and deals no damage. Bare hands never kill a Foe. Thrown at a Foe Engaged
        or Apart, such an object is an improvised act with Shoot as its model entry, at this damage and
        Injury Type, with no Gear Dice (Chapter 2, section 2.9).
    - id: flintlock-pistol
      name: Flintlock pistol
      used_with: shoot
      injury_type: pierce
      damage: 2
      target: either
      gear_item: flintlock-pistol
      spends: its load; the firearm is empty after the roll
      wielded_by: [soldier, foe]
      notes: A soldier's firearm gives its Gear Dice, and a Pushed 1 wears it (Chapter 4, section 4.1).
    - id: musket
      name: Musket
      used_with: shoot
      injury_type: pierce
      damage: 4
      target: apart
      gear_item: musket
      spends: its load; the firearm is empty after the roll
      wielded_by: [soldier, foe]
      notes: >-
        Reload also spends the move. A ball that lands at 1 Net Success deals 4, which brings a Health 4
        Rookie to 0 current Health: Down, with a Pierce Critical Injury.
    - id: fired-flare
      name: Flare, fired at a person
      used_with: shoot
      injury_type: burn
      damage: 1
      target: either
      gear_item: null
      spends: 1 flare of Squad Supply; no Shot and no firearm
      wielded_by: [soldier]
      notes: A flare is a signal first. Firing one at a person is a Shoot roll with no Gear Dice. Fire kills a Foe it brings to 0 Health.
    - id: sabre
      name: Sabre
      used_with: fight
      injury_type: cut
      damage: 2
      target: engaged
      gear_item: null
      spends: nothing
      wielded_by: [foe]
      notes: none
    - id: knife
      name: Knife
      used_with: fight
      injury_type: cut
      damage: 1
      target: engaged
      gear_item: null
      spends: nothing
      wielded_by: [foe]
      notes: none
    - id: club
      name: Club
      used_with: fight
      injury_type: crush
      damage: 1
      target: engaged
      gear_item: null
      spends: nothing
      wielded_by: [foe]
      notes: none
    - id: firebrand
      name: Firebrand
      used_with: fight
      injury_type: burn
      damage: 1
      target: engaged
      gear_item: null
      spends: nothing
      wielded_by: [foe]
      notes: A Bandit at night carries it in place of a club. Fire kills; against a soldier it is Burn damage.

# ------------------------------------------------------------------ the Grapple and Held
grapple:
  what: >-
    A Fight roll against a Foe the soldier is Engaged with, declared as a Grapple before rolling. It takes
    no Gear Dice. Talents that name fight apply to it.
  lands: The Foe is Held by the soldier. It deals no damage (decision batch 8, 8-12).
  changes: [held-set]
held:
  a_held_foe: A Held Foe cannot move, and attacks only its holder, bare-handed (data/skirmish/foes.yaml, foe_rule). It still rolls Guard.
  the_holder: >-
    A soldier who holds a Foe cannot move, cannot Shoot or Reload, and takes no action but a bare-handed
    Fight against the Held Foe or Help. Release, which spends nothing, lets go at any point of their turn.
  # decision batch 8, 8-30 (OQ-155, item g): a Down holder
  ends: >-
    The holder takes Release, the holder becomes Down or dies, or the Foe is out of the Skirmish. A Foe
    never Breaks Free and never releases.
  a_held_soldier: >-
    A soldier Held by a person cannot move, cannot Dodge, and attacks only the holder, bare-handed. Break
    Free ends it. No Foe Grapples in the playtest (data/skirmish/foes.yaml, foe_rule), so no playtest rule
    makes a soldier Held; these rules stay written for later Foes (decision batch 8, 8-30).
release:
  entry: release   # data/character/action-catalog.yaml
  what: An option on the holder's turn, with no roll, that spends nothing and ends the hold.
  changes: [held-end]

# ------------------------------------------------------------------ Grit and breaking
grit:
  # decision batch 9, 9-7: Grit is the latest point at which a group breaks
  breaks_when: The number of the group's Foes out of the Skirmish reaches its Grit (data/skirmish/foes.yaml), at the latest.
  sooner: >-
    The GM may break the group sooner, or have it surrender, with a reason said aloud as it happens (the
    officer falls; the sergeant sees the flare), never later (data/skirmish/foes.yaml, gm_rulings,
    breaking_sooner). A group broken sooner breaks as on_breaking gives. A group that surrenders yields as
    the Parley's Surrender ask gives (parley, asks), and the Skirmish ends.
  # decision batch 8, 8-30 (OQ-155, item g): a Held Foe
  on_breaking: >-
    At once, every Foe of the group still in the Skirmish that is not Held becomes Apart from every
    soldier and takes no further turn; each leaves at the end of the round. A Held Foe stays Held and
    leaves at the end of the round its hold ends.
  # decision batch 9, 9-22 (OQ-174): 9-14 moved the Parley need off Grit; a failed threat still hardens later Parleys
  failed_threat: >-
    A failed Parley made as a threat raises the group's Grit by 1, and its Parley value by 1, for the rest
    of this Skirmish (parley).

# ------------------------------------------------------------------ Parley
parley:
  when: On the soldier's action, against the group; each soldier at most once per Skirmish.
  roll: parley (rolls)
  threat: The soldier may make it a threat, rolling Strength in place of Empathy. It is still a roll for persuade, so a Talent that names persuade adds its dice.
  # decision batch 9, 9-14 (OQ-172): the Foe kind's parley value, not its Grit
  needs: >-
    The group's Parley value (data/skirmish/foes.yaml, parley) plus 1, minus 1 for each of its Foes out of
    the Skirmish, never below 1; then add the ask's needs_add.
  asks:
    - {id: stand-down, name: Stand down, needs_add: 0, effect: "The group leaves."}
    - {id: let-us-pass, name: Let us pass, needs_add: 0, effect: "The group lets the Squad go its way."}
    - {id: answer, name: Answer, needs_add: 0, effect: "The group answers one question truthfully, from what its Foes know."}
    - {id: surrender, name: Surrender, needs_add: 1, effect: "The group lays down its arms and gives itself up to the Squad."}
  on_success: The group yields, does what the ask says, and the Skirmish ends.
  on_failure: Nothing happens, except that a failed threat raises the group's Grit and its Parley value by 1 each for the rest of this Skirmish (grit, failed_threat).
  changes: [foe-yield]
  outside_a_skirmish:
    when: >-
      A Mission Brief or scene framing sets the Squad before a Foe group from the list with no Skirmish
      under way. Each soldier may make one Parley with that group.
    roll: parley-outside-a-skirmish (rolls)
    needs: The group's Parley value (data/skirmish/foes.yaml, parley), plus the ask's needs_add.
    other_people: Talking with anyone who is not a Foe group from the list is a called roll (Chapter 1, section 1.1).
    on_success: The group does what the ask says.
    on_failure: Nothing happens.

# ------------------------------------------------------------------ Size Up
size_up:
  when: On the soldier's action, once per Foe group per Skirmish, for the whole Squad.
  roll: size-up (rolls)
  # decision batch 9, 9-22 (OQ-174): the answer stays true when the GM already means to direct a Foe (9-7)
  on_success: >-
    The GM states the group's Grit, how many more of its Foes must be out before it breaks, and what each
    of its Foes will do on the group's next card under the foe rule as things stand, or, for a Foe the GM
    already means to direct, what it will do and the reason (data/skirmish/foes.yaml, gm_rulings).
  holds: >-
    Each Foe does what the GM stated on its turn on that card, unless something happens after the Size
    Up that changes it: for a Foe stated under the foe rule, a change in what the rule tests, after which
    the rule picks again, or a new reason the fiction gives it, said aloud; for a Foe stated as directed,
    a new reason, said aloud, or an action it can no longer take, after which the foe rule picks unless
    the GM directs it again with a reason said aloud. The GM never directs a Foe on that card for a reason
    held back at the Size Up (data/skirmish/foes.yaml, gm_rulings, directed_by_ruling).
  on_failure: Nothing happens.
  changes: [foe-intent-reveal]

# ------------------------------------------------------------------ ending
ending:
  tests:
    - id: foes-gone
      text: Every Foe of the group is out of the Skirmish, has left, or has yielded.
    - id: squad-leaves
      # decision batch 8, 8-30 (OQ-155, item f)
      text: >-
        At the end of a round, if every soldier taking part who is not Down is Apart from every Foe, is not
        Held, and holds no Foe, and every Down soldier taking part is carried by a comrade, the players may
        declare that the Squad leaves.
    - id: no-soldier-standing
      # decision batch 8, 8-30 (OQ-155, item f)
      text: >-
        Every soldier taking part is Down or dead. The Foe group leaves, and takes nothing.
  when_it_ends: >-
    Resolve the end steps of data/harm/engagement-end.yaml for a Skirmish (procedures, skirmish). They are
    resolved outside the Skirmish.

# ------------------------------------------------------------------ Fear Rolls, Drives, Talents, Squadmates
fear_rolls:
  comrade-dies: Every other soldier taking part who is alive rolls; a Down soldier makes none (data/mind/fear-rolls.yaml, comrade-dies).
  first-human-kill: >-
    A soldier kills a person when damage of Injury Type Cut, Pierce, or Burn they deal brings a Foe to 0
    Health (damage, on_a_foe; decision batch 8, 8-30). If they have never killed a person before, they roll (data/mind/fear-rolls.yaml,
    first-human-kill).
  comrade-grabbed: never, since no Titan takes part
drives_and_talents:
  drive_turn_tests: A Drive's turn tests count Skirmish turns (OQ-36). A Drive's Position triggers need a Titan Engagement and are never met in a Skirmish.
  # decision batch 8, 8-39: a Skirmish nested in a Leg or a Night Camp has its own use
  once_per_titan_engagement: >-
    A Skirmish is a procedure with a start and an end: a Talent whose limit is once per Titan Engagement
    can also be used once per Skirmish (data/character/talents.yaml, talent_rules, limit_terms). A
    Skirmish that begins inside a Leg or a Night Camp is its own procedure with its own use, and neither
    use spends the other, as limit_terms states.
  positions: A Talent whose effect reads a Position or a Position step does nothing in a Skirmish unless its row says what it does there, as Carrying Voice's does.
squadmates: >-
  A Squadmate takes part like a player character, on its own card, directed as
  data/character/squadmates.yaml states, and never Pushes or Covers.
# decision batch 9, 9-11 (ADR-0012, as amended)
gm: >-
  The GM rules on a Foe's target or action when the fiction gives it a reason said aloud, on a group
  breaking or surrendering sooner than its Grit, and on whether the Squad can approach unseen for the
  Ambush (data/skirmish/foes.yaml, gm_rulings); names the Circumstances of the soldiers' rolls (Chapter 1,
  section 1.4a); and names the model entry of an improvised act (actions, improvised_act). The GM applies
  as written, in the open: every Foe's Attack Dice and Guard, never adjusted; damage and Net Successes; the
  ban on attacking a Down soldier; and the tests that end a Skirmish (ending). The rest is the list in
  Chapter 1, section 1.1, item 6 (ADR-0024, limit 8).

# ------------------------------------------------------------------ rolls
rolls:
  - id: sneak-for-the-ambush
    name: Sneak for the Ambush
    who: One soldier taking part who is not Down, chosen by the players, using Chapter 2's roll-off if they disagree.
    entry: Sneak
    needs: the Foe group's Watch
    help: Never.
    push: Allowed (Chapter 1, section 1.5); no one can Cover it, since no one qualifies to Help.
    retry: Never.
