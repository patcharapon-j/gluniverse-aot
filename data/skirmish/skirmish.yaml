    push: Allowed, before the Foe's Guard is rolled; a comrade who qualifies to Help may Cover it.
    retry: On a later turn, once the firearm is loaded again or with another flare.
    changes: [foe-harm]
  - id: reaction
    name: Block or Dodge against a Foe
    who: The soldier a Foe's attack targets.
    entry: Block (against a Fight attack only) or Dodge
    needs: none of its own; each success cancels one success of the attack
    help: Up to 3 comrades taking part who are not Down, each spending their action, whether Engaged or Apart.
    push: Allowed, after the Foe's roll is known; the reacting side Pushes last. A comrade who qualifies to Help may Cover it.
    retry: Never against the same Foe that round; its successes stand against that Foe's later attacks that round.
    notes: >-
      Takes the Circumstances step in force when the Foe group's card came up; no step is named or changed
