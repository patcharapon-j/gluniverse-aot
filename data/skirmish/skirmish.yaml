    changes: [ambush-set]
  - id: fight
    name: Fight, or a Grapple
    who: A soldier on their action, against a Foe they are Engaged with.
    entry: Fight
    needs: 1 Net Success after the Foe's Guard
    help: Up to 3 comrades taking part who are not Down, each spending their action, whether Engaged or Apart.
    push: Allowed, before the Foe's Guard is rolled; a comrade who qualifies to Help may Cover it.
    retry: On a later turn.
    changes: [foe-harm, held-set]
  - id: shoot
