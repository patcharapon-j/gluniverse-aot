# The playtest Foes: each kind's Attack Dice, Guard, Health, Grit, Watch, group size, and weapons; the
# Foe's firearms; Guard, the Foe's cancelling roll; and the closed foe rule every Foe acts by.
# Source of truth under ADR-0012. docs/rules/07-playtest-rules.md (section 7.4) references this file
# and renders its tables from it (tools/render/render.py). Each weapon's damage and Injury Type is in
# data/skirmish/skirmish.yaml (weapons).
# Playtest rule: Phase 2 replaces this file (decision batch 7, 7-17; decision batch 8, 8-4, 8-7;
# OQ-143, OQ-145).
id: foes
name: Foes
chapter: 07-playtest-rules
status: playtest
adrs: [ADR-0014, ADR-0016, ADR-0018, ADR-0019, ADR-0024]
decided: [OQ-143, OQ-145, OQ-155, OQ-164, OQ-172]

row_fields:
  attack_dice: base dice the Foe rolls for every attack it makes, succeeding on 6, never Pushed, with no other dice and no Circumstances
  guard_dice: base dice the Foe rolls as its cancelling roll against each attack on it (guard), with no Circumstances
  health: the damage it takes before it is out of the Skirmish
  grit: >-
    how many of the group must be out of the Skirmish before it breaks: the latest point at which it breaks,
    since the GM may break it sooner with a reason (gm_rulings)
  # decision batch 9, 9-14 (OQ-172): the Parley need reads this value, not Grit
  parley: the base successes a Parley against a group of this kind needs (data/skirmish/skirmish.yaml, parley)
  watch: the successes a Sneak roll needs for the ambush against the group
  group_size: how many Foes the group has when the Skirmish's start names no number
  fight_weapon: the weapon its Fight attacks use (data/skirmish/skirmish.yaml, weapons)
  shoot_weapon: the firearm its Shoot attacks use, or null

foes:
  - id: bandit
    name: Bandit
    who: A salvager or a deserter living outside the Walls.
    attack_dice: 4
    guard_dice: 3
    health: 3
    grit: 1
    parley: 1   # decision batch 9, 9-14: equal to its Grit, so nothing changes for a Bandit
    watch: 1
    group_size: {fixed: 3}
    fight_weapon:
      roll: D6 for each Bandit as the Skirmish begins   # decision batch 8, 8-30 (OQ-155, item b)
      rows:
        - {results: [1, 2, 3], weapon: club}
        - {results: [4, 5, 6], weapon: knife}
      at_night: {replaces: club, with: firebrand}   # decision batch 8, 8-7: the prowlers row and any Bandit group at night
    shoot_weapon: null
  - id: military-police-trooper
    name: Military Police trooper
    who: A soldier of the Military Police, the commonest human Foe.
    # decision batch 8, 8-33 (OQ-164): Attack Dice 7, Grit 4, and a patrol of 4 that fights to the last,
    # from the Skirmish sweep. History: Attack Dice 5, Grit 2, and 8-30 (a)'s D3+1 group (OQ-155, item a).
    attack_dice: 7
    guard_dice: 4
    health: 4
    grit: 4
    # decision batch 9, 9-14 (OQ-172): the trooper's Grit before 8-33 raised it to 4 for breaking. At Grit 4
    # a Parley read its Grit and Stand down needed 5 in a Skirmish, 2.0% Pushed with two helpers. The owner
    # may set 3 or higher if the Military Police are meant to stand firm.
    parley: 2
    watch: 2
    group_size: {fixed: 4}
    fight_weapon: sabre
    shoot_weapon: flintlock-pistol
  - id: garrison-sentry
    name: Garrison sentry
    who: A Garrison soldier on picket duty.
    attack_dice: 4
    guard_dice: 3
    health: 4
    grit: 1
    parley: 1   # decision batch 9, 9-14: equal to its Grit, so nothing changes for a sentry
    watch: 2
    group_size: {fixed: 2}
    fight_weapon: bare-hands   # decision batch 8, 8-30 (OQ-155, item b): a musket is never fired at an Engaged target
    shoot_weapon: musket

# The Skirmish probe's reported figures (decision batch 8, 8-33; OQ-164). Each is reported beside its
# probe row, with the Cut and Pierce riders on, and each range is read exactly. They are reported
# figures, not ADR-0014 targets (ADR-0014, as amended for 8-31 and 8-33), and no rule reads them.
reported_figures:
  status: reported
  riders: on
  rows:
    - id: squad-against-a-patrol
      case: The reference Squad against a Military Police patrol, four troopers (the kind's group_size).
      deaths_per_skirmish: {min: 0.02, max: 0.04}   # deaths through the end steps
      squad_win_percent: {min: 90}
      sweep: {deaths_per_skirmish: 0.024, squad_win_percent: 97.6}
      final_rerun: {deaths_per_skirmish: 0.020, squad_win_percent: 97.5, reading: inside the range}
    - id: bandit-night-ambush
      case: The reference Squad against three Bandits with their ambush at night, with firebrands.
      deaths_per_skirmish: {min: 0.01, max: 0.03}   # deaths through the end steps
      sweep: {deaths_per_skirmish: 0.015}
      final_rerun: {deaths_per_skirmish: 0.016, reading: inside the range}
    - id: rookie-against-a-trooper
      case: One Rookie against one Military Police trooper.
      rookie_win_percent: {min: 50, max: 70}
      sweep: {rookie_win_percent: 56.2}
      final_rerun: {rookie_win_percent: 57.5, reading: inside the range}
  source: >-
    The simulator agent's Foe sweep after the full rerun: 8,000 Skirmishes a row, the Cut and Pierce
    riders on, fixed seeds (decision batch 8, 8-33). The final full rerun reports each figure at the
    probe's own count.

firearms:
  start: A Foe's firearm is loaded when the Skirmish begins.   # decision batch 8, 8-30 (OQ-155, item b)
  reload: A Foe's Reload spends its turn and no shot; a Foe never runs out.
  empty: A Foe's firearm is empty after it Shoots.

# Guard is the Foe's cancelling roll (decision batch 8, 8-4; Chapter 1, section 1.9).
guard:
  what: >-
    A Foe's Guard is its cancelling roll. When a soldier's Fight or Shoot roll against the Foe is final,
    the GM rolls the Foe's Guard dice in the open as base dice. Each success cancels one of the attack's
    successes, and the attack lands on 1 or more net successes.
  every_attack: Guard is rolled against every attack on the Foe, however many come in a round. A Held Foe still rolls it.
  never: [push, help, bonus-dice, stress-dice, gear-dice]
  spends: nothing
  ambush: No Guard is rolled against an attack the ambush leaves unanswered (data/skirmish/skirmish.yaml, ambush).

# The foe rule's preface (decision batch 9, 9-7; ADR-0018, as amended; ADR-0024, limit 8). Playtest rule:
# Phase 2 replaces the direction rule with the rest of this file.
gm_rulings:
  default: Every Foe acts by the foe rule (foe_rule). It is the default and the Skirmish probe's baseline.
  directed_by_ruling:
    when: >-
      On a Foe's turn, when the fiction gives that Foe a reason, the GM may direct its target or its action
      in place of the foe rule's pick.
    reason: >-
      The GM says the reason aloud before the Foe acts, such as "the sergeant goes for the medic who shot
      his man". A reason the table cannot hear is not a reason.
    limits: >-
      A directed Foe still takes only a turn the foe rule's steps can give (it Fights, Shoots, reloads,
      closes in and Fights, or does nothing), with its kind's weapons, and never attacks a Down soldier.
      A directed Foe never leaves the Skirmish alone: a Foe leaves only at 0 Health or when its group breaks
      or surrenders, and a GM who wants a Foe to run breaks its group sooner (breaking_sooner; decision batch
      9, 9-34).
    # decision batch 9, 9-22 (OQ-174)
    after_size_up: >-
      On the group's next card after a successful Size Up, each Foe does what the GM stated unless
      something that happens after the Size Up changes it (data/skirmish/skirmish.yaml, size_up, holds).
  breaking_sooner: >-
    The GM may break a group, or have it surrender, before it reaches its Grit, with a reason said aloud
    (the officer falls; the sergeant sees the flare); never later (data/skirmish/skirmish.yaml, grit).
  ambush_approach: >-
    The GM rules whether the Squad can approach a group unseen at all (data/skirmish/skirmish.yaml, ambush,
    squad_attempt).
  stands: >-
    A Foe's Attack Dice and Guard, rolled in the open from its row and never adjusted; damage and Net
    Successes; whether a Foe at 0 Health is dead or out cold; that a Foe never Pushes, Helps, or Covers;
    that a Foe never attacks a Down soldier; a Held Foe's rule; and a failed threat's rise. The rest the
    GM applies as written is the list in Chapter 1, section 1.1, item 6.
  # decision batch 9, 9-7, item 5 (ADR-0016, as amended): none ships in the first playtest
  table_made: >-
    A Foe kind a table makes waits for Phase 2: none ships in the first playtest, and no chapter gives the
    GM the power to add one (docs/rules/07-playtest-rules.md, section 7.4). When Phase 2 adds one, it uses
    these row fields, with Attack Dice no higher than 7 and Guard no higher than 4 (the Military Police
    trooper's), and is played as unmeasured (decision batch 9, 9-7, item 5, and 9-41, item 7; ADR-0016, as
    amended).

# A Foe's Attack Dice and Guard take no Circumstances (decision batch 9, 9-2 and 9-7; Chapter 1, section 1.4a).
circumstances: never

# The foe rule (ADR-0018, as amended; ADR-0024, limit 8): the steps every Foe acts by unless the GM directs it
# (gm_rulings).
foe_rule:
  when: On the Foe group's card, each Foe still in the Skirmish that has not broken takes one turn, in label order.
  # decision batch 8, 8-30 (OQ-155, item c): a Foe never targets a Down soldier
  candidates: >-
    Every soldier taking part who is alive and not Down.
  last_attacker: Of the candidates, the one who most recently made a Fight or Shoot roll against this Foe, landed or not.
  lowest_card: Of the candidates a step names, the one whose initiative card this round is lowest.
  steps:
    - id: held
      test: The Foe is Held.
      does: It Fights its holder, bare-handed.
    - id: engaged
      test: The Foe is Engaged with a candidate.
      does: >-
        It Fights with its Fight weapon: its last attacker, if they are Engaged with it; otherwise the
        Engaged candidate with the lowest card.
    - id: loaded
      test: The Foe has a loaded firearm and at least one candidate.
      does: It Shoots with its Shoot weapon at its last attacker, if any; otherwise at the candidate with the lowest card.
    - id: empty
      test: The Foe has an empty firearm.
      does: It reloads.
    - id: close-in
      test: The Foe has at least one candidate.
      does: It becomes Engaged with the candidate with the lowest card and Fights them with its Fight weapon.
    - id: none
      test: None of the above.
      does: Nothing.
  first_match: Take the first step whose test the Foe meets.
  never: [push, help, cover, grapple, break-free, release, parley, size-up, reaction]
  no_stress: A Foe has no Stress, makes no Fear Roll, and has no Stress Response.
