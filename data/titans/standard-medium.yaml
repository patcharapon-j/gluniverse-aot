# The standard Medium Titan: its stat block and Behavior Table, in the format of
# data/engagement/titan-format.yaml.
# Source of truth under ADR-0012. docs/rules/06-standard-titans.md (section 6.3) renders this file
# with tools/probes/chapter-06/render.py and never writes its rows by hand.
id: standard-medium
name: Standard Medium Titan
chapter: 06-standard-titans
adrs: [ADR-0001, ADR-0005, ADR-0007, ADR-0014, ADR-0015, ADR-0017, ADR-0019, ADR-0024]
decided: [OQ-78, OQ-80, OQ-100, OQ-101, OQ-137, OQ-145]   # Chapter 5's Size Class values and Behavior Table procedure; the Grab mark and this table (decision batch 4, 4-1 and 4-2); each harming effect's Injury Type (decision batch 7, 7-5)
format: data/engagement/titan-format.yaml (stat_block, behavior_table, entry_fields, tier_rules)
grab_mark: data/titans/index.yaml (grab_mark)

# ------------------------------------------------------------------ stat block
# A standard Titan takes every number below from its Size Class row
# (data/engagement/size-classes.yaml, medium). tools/probes/chapter-06/titans.py checks that they match.
size_class: medium
abnormal: false
tempo: 1
nape_depth: 4
regeneration_clock: 3
heave: 3   # its Size Class row's Heave rating (data/engagement/size-classes.yaml, heave; decision batch 8, 8-9)
body_parts:
  - {id: eyes, kind: eyes, toughness: 2}
  - {id: left-arm, kind: arm, toughness: 2}
  - {id: right-arm, kind: arm, toughness: 2}
  - {id: left-leg, kind: leg, toughness: 2}
  - {id: right-leg, kind: leg, toughness: 2}
attention_ladder: standard

# ------------------------------------------------------------------ Behavior Table
behavior_table:
  roll: D6
  entries:
    - id: fixed-grin
      name: Fixed Grin
      results: [1]
      tier: terrorize
      targets: holder
      position_requirement: [distant, in-reach, on-body, blind-spot]
      body_parts_used: [eyes]
      attack_dice: 3
      effects:
        - {type: stress, amount: 1}
        - {type: telegraph}
      fallback: thrash
      text: >-
        It stops dead, its eyes wide and empty above a fixed grin, and the way
        its weight shifts shows what it will do next.

    - id: snap-short
      name: Snap Short
      results: [2]
      tier: terrorize
      targets: holder
      position_requirement: [in-reach, on-body]
      body_parts_used: []
      attack_dice: 3
      effects:
        - {type: stress, amount: 1}
      fallback: thrash
      text: Its head swings down at the soldier, and its jaws snap shut on the air a moment too late.

    - id: swat
      name: Swat
      results: [3]
      tier: control
      targets: holder
      position_requirement: [in-reach, on-body]
      body_parts_used: [arm]
      attack_dice: 6
      effects:
        - {type: critical-injury, injury_location: rolled, injury_type: crush, cannot_be_lethal: true}
        - {type: wreck}
      fallback: thrash
      text: It swings the back of its hand at the soldier, as a person swats at a fly.

    - id: shake-off
      name: Shake Off
      results: [4]
      tier: control
      targets: holder
      position_requirement: [on-body, blind-spot]
      body_parts_used: []
      attack_dice: 6
      effects:
        - {type: knock-loose}
      fallback: thrash
      text: It hunches and rolls its shoulders to shake off whatever clings there.

    - id: bite
      name: Bite
      results: [5]
      tier: kill
      targets: holder
      position_requirement: [in-reach, on-body]
      body_parts_used: []
      attack_dice: 9
      effects:
        - {type: critical-injury, injury_location: torso, injury_type: bite, cannot_be_lethal: false}
      fallback: thrash
      text: It lunges with its jaws wide and closes them on the soldier's body.

    - id: grab
      name: Grab
      results: [6]
      tier: kill
      targets: holder
      position_requirement: [in-reach, on-body]
      body_parts_used: [arm]
      attack_dice: 9
      effects:
        - {type: grab}
      fallback: thrash
      text: Its fingers close around the soldier and do not let go.

    - id: thrash
      name: Thrash
      results: []
      tier: thrash
      targets: holder
      position_requirement: [distant, in-reach, on-body, blind-spot]
      body_parts_used: []
      attack_dice: 6
      effects:
        - {type: knock-loose}
      fallback: none
      text: It jerks and twists at everything near it, with no aim at all.
