# The standard Small Titan: its stat block and Behavior Table, in the format of
# data/engagement/titan-format.yaml.
# Source of truth under ADR-0012. docs/rules/06-standard-titans.md (section 6.2) renders this file
# with tools/probes/chapter-06/render.py and never writes its rows by hand.
id: standard-small
name: Standard Small Titan
chapter: 06-standard-titans
adrs: [ADR-0001, ADR-0005, ADR-0007, ADR-0014, ADR-0015, ADR-0017, ADR-0019, ADR-0024]
decided: [OQ-78, OQ-80, OQ-100, OQ-101, OQ-137, OQ-145]   # Chapter 5's Size Class values and Behavior Table procedure; the Grab mark and this table (decision batch 4, 4-1 and 4-2); each harming effect's Injury Type (decision batch 7, 7-5)
format: data/engagement/titan-format.yaml (stat_block, behavior_table, entry_fields, tier_rules)
grab_mark: data/titans/index.yaml (grab_mark)

# ------------------------------------------------------------------ stat block
# A standard Titan takes every number below from its Size Class row
# (data/engagement/size-classes.yaml, small). tools/probes/chapter-06/titans.py checks that they match.
size_class: small
abnormal: false
tempo: 2
nape_depth: 3
regeneration_clock: 2
heave: 2   # its Size Class row's Heave rating (data/engagement/size-classes.yaml, heave; decision batch 8, 8-9)
stride: 1   # its Size Class row's Stride (data/engagement/size-classes.yaml, stride; decision batch 16, 16-16)
body_parts:
  - {id: eyes, kind: eyes, toughness: 1}
  - {id: left-arm, kind: arm, toughness: 1}
  - {id: right-arm, kind: arm, toughness: 1}
  - {id: left-leg, kind: leg, toughness: 1}
  - {id: right-leg, kind: leg, toughness: 1}
attention_ladder: standard

# ------------------------------------------------------------------ Behavior Table
behavior_table:
  roll: D6
  entries:
    - id: gape
      name: Gape
      results: [1]
      tier: terrorize
      targets: holder
      position_requirement: [distant, in-reach, on-body, blind-spot]
      body_parts_used: []
      attack_dice: 3
      effects:
        - {type: stress, amount: 1}
      fallback: thrash
      text: Its jaw drops open far wider than any face should and hangs there, as if the soldier were already in it.

    - id: lurch-closer
      name: Lurch Closer
      results: [2]
      tier: terrorize
      targets: holder
      position_requirement: [distant, in-reach]
      body_parts_used: []
      attack_dice: 3
      effects:
        - {type: stress, amount: 1}
        - {type: telegraph}
      fallback: thrash
      text: >-
        It lurches at the soldier head first, however it can, and the way it leans shows what it
        will try next.

    - id: clutch-at-the-legs
      name: Clutch at the Legs
      results: [3]
      tier: control
      targets: holder
      position_requirement: [in-reach]
      body_parts_used: [arm]
      attack_dice: 6
      effects:
        - {type: critical-injury, injury_location: leg, injury_type: crush, cannot_be_lethal: true}
      fallback: thrash
      text: It drops low and snatches at the soldier's legs and wrenches at whatever it gets hold of.

    - id: scrabble
      name: Scrabble
      results: [4]
      tier: control
      targets: holder
      position_requirement: [on-body, blind-spot]
      body_parts_used: []
      attack_dice: 6
      effects:
        - {type: knock-loose}
        - {type: wreck}
      fallback: thrash
      text: It throws itself down and rolls in the dirt to scrape the soldier off its back.

    - id: bite
      name: Bite
      results: [5]
      tier: kill
      targets: holder
      position_requirement: [in-reach, on-body]
      body_parts_used: []
      attack_dice: 6
      effects:
        - {type: critical-injury, injury_location: leg, injury_type: bite, cannot_be_lethal: false}
      fallback: thrash
      text: It ducks its head low and sinks its teeth into the soldier's nearest leg.

    - id: grab
      name: Grab
      results: [6]
      tier: kill
      targets: holder
      position_requirement: [in-reach, on-body]
      body_parts_used: [arm]
      attack_dice: 6
      effects:
        - {type: grab}
      fallback: thrash
      text: It clutches the soldier in one small hand and drags them toward its mouth.

    - id: thrash
      name: Thrash
      results: []
      tier: thrash
      targets: holder
      position_requirement: [distant, in-reach, on-body, blind-spot]
      body_parts_used: []
      attack_dice: 6
      effects:
        - {type: knock-loose}
      fallback: none
      text: It writhes and rolls in every direction at once.
