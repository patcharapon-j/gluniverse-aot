# ADR-0014 tuning for Chapter 6: the targets each Titan's stat block and Behavior Table must hold, the
# probes that measured them, and the verdict for each. The figures themselves are generated into
# data/titans/probe-figures.yaml; this file states what they must show.
# Source of truth under ADR-0012. docs/rules/06-standard-titans.md (section 6.6) references this file
# and renders its figure tables from data/titans/probe-figures.yaml.
id: titan-tuning
name: Chapter 6 Tuning Targets and Verdicts
chapter: 06-standard-titans
adrs: [ADR-0014, ADR-0015, ADR-0019]
decided: [OQ-78, OQ-79, OQ-80, OQ-95, OQ-96, OQ-98, OQ-101, OQ-102, OQ-103, OQ-104, OQ-107, OQ-109, OQ-113, OQ-126, OQ-127, OQ-145, OQ-190, OQ-192, OQ-193, OQ-195]   # Chapter 5's values and readings, applied here; Chapter 6's entries (decision batch 4)

starting_values: >-
  Chapter 6 changes no Size Class value. Every number in a standard Titan's stat block is Chapter 5's
  simulator starting value (data/engagement/size-classes.yaml; data/engagement/tuning.yaml,
  starting_values). What Chapter 6 adds and tunes is each Behavior Table, and the Abnormal's values,
  which are reported and not tuned. The Phase 1 simulator re-measures all of them
  (data/engagement/tuning.yaml, simulator_cases; cases below).

# Decision batch 13 (OQ-190, OQ-192, OQ-193): Health becomes 2 + (strength + agility) / 2, rounded up, so
# every soldier carries two more boxes; a Titan whose Attention holder cannot meet the rolled entry's Position
# requirement retargets down the Attention Ladder rather than falling to Thrash; and each Focus Titan carries
# Frenzy, added to its behavior roll, with a total above the table's highest result reading as that result,
# rising 1 every third round to a cap of 3 (the round 3 retune halved the first rate, R1; the zone retune
# moved it to every third round, Z2). No Behavior Table in data/titans/ is re-authored for any of it. Decision
# batch 16 (ADR-0029) put every Titan Engagement on zones, with the Stride, Flights, and wrecks, and the zone
# retune took Pitch Headlong's wreck off the Sprinting Abnormal's table (Z3). THE CONFIRMING RUN OF THE ZONE
# RETUNE HAS HAPPENED (2026-09-21, 949 cases and 3 second-seed runs, 55,528,000 trials, rules hash
# 54e147e73e8d0852; docs/reviews/zone-retune-decisions.md, Z5): it measured batches 10, 11, 13, and 16 and the
# zone retune's rulings together, every ADR-0014 target, every band, and every limit of the Sprinting
# Abnormal's bar is Met on it, and it reads no missed result. Every figure and verdict in this file, in
# data/titans/probe-figures.yaml, and in docs/reviews/simulator-report.md is read from it. Health pulled every
# Critical Injury and deaths band down and the two behavior fixes put lethality back through what the monster
# does rather than through its dice; the Medium bands were re-set to what the owner's rules measure (round 3
# retune, R2), and the zone retune kept them. Each table's kill share by previous behavior and by Broken parts
# is read under the Frenzy roll and the retarget.

# ------------------------------------------------------------------ the probes
probes:
  path: tools/probes/chapter-06
  runs_with: uv run --with pyyaml python
  reads: >-
    data/titans/*.yaml, data/engagement/titan-format.yaml, size-classes.yaml, attention.yaml,
    engagement-setup.yaml (its Size Class and medium_abnormal rows, for the setup mix), and tuning.yaml
    (only its simulation_reference_titan, for the port check), and data/harm/critical-injuries.yaml
    through the Chapter 5 dice core. Unlike the Chapter 5 probes, no Titan value is written into a
    script, so a changed stat block or table is re-measured by re-running the commands below.
  imports: >-
    tools/probes/chapter-05/core.py, fight.py, simple.py, and lone.py. The Chapter 6 files replace only what reads
    a Titan (its stat block, the Next Behavior roll, a Titan's card, and the Attention Ladder) and add
    what a fight's start calls for. simple.py's grab_trial takes the fixed need of the victim's dodge as a
    parameter (default 3, the kill pool of 9 before Attack Dice), so Chapter 5's own Grab figures are unchanged.
  baseline_policy: >-
    Each target is measured under the baseline policy Chapter 5 states for it
    (data/engagement/tuning.yaml, probes, baseline_policy; prepared_squad_kill, model): 4 Rookie player
    characters at Stress 1 in Wooded terrain, two cutters striking the more damaged leg with Help and
    two eager strikers at Blind Spot, dodging every harming behavior, going for the hand on a Grab, with
    no Read, Call It, Draw Attention, Wings, swaps, Squad Tactics, or Background Titans, and every fight
    runs under the retreat clock of 8 segments (data/engagement/tuning.yaml, prepared_squad_kill, model,
    retreat; decision batch 5, 5-10). Sensitivity rows name what they add. The Sprinting Abnormal's reference start adds what any rule that names it
    begins with: every soldier mounted, and the abnormal Fear Roll (targets, abnormals).
  start_of_fight: >-
    Before round 1, after the first Attention Ladder evaluation, every soldier holding a Position makes
    each Fear Roll the start calls for (data/mind/fear-rolls.yaml): abnormal whenever the Sprinting
    Abnormal is the Focus Titan, and first-titan-engagement in the case that names it. Turns and
    actions a Fear Roll spends are spent in round 1. A soldier who starts mounted dismounts as part of
    their first move. With every soldier at Distant and no cards dealt, the first evaluation of a Squad
    of two or more leaves nothing holding the Titan's Attention until its first card
    (data/engagement/attention.yaml, evaluation, none; decision batch 4, 4-3).
  port_check: >-
    fight6.py fighting Chapter 5's reference Titan must reproduce fight.py's reference row within
    sampling (62.0% by round 3, 0.72 Critical Injuries per fight, under the retreat clock after decision
    batch 5). It is the first case in cases6.json.
  telegraph: >-
    A telegraph effect is counted but changes no choice in the model, because the baseline policy acts
    on no revealed Next Behavior. The simulator's Read and Call It case covers revealed behaviors.
  files:
    - file: titans.py
      holds: >-
        Loads each Titan and checks it against the format and the Chapter 6 constraints, including a
        text check that fails an entry whose text names the Titan's arm, leg, or eyes when its
        body_parts_used does not list that kind, or that shows the Titan seeing a holder its row allows
        at Blind Spot or touching one it allows at Distant, and a check that an entry on a two-legged
        Titan that uses a leg lists both legs (OQ-109). Enumerates the move-up shares for every previous
        behavior and every count of Broken eyes, arms, and legs.
    - file: fight6.py
      holds: >-
        The full-fight model against a Chapter 6 Titan: start-of-fight Fear Rolls, a mounted start,
        the fall of a mounted soldier who goes Down or whose horse goes lame, Chapter 5's Grab
        countdown for every Grabbed soldier including a rider, and the sensitivity cases (rider
        Squadmates, Draw Attention, another ladder). Each horse is mounted, stands at the Position
        where its soldier dismounted, or has bolted; a riderless-horse decoy needs the soldier mounted
        or at the horse's Position, dismounts them on success, and wears the horse, so a Pushed roll
        can lame it. The beside-the-holder screen's Squadmates start mounted, ride to the holder's
        Position when it is distant or in-reach, and send the horse from the saddle. Its selftest
        checks those cases. Each fight summary carries standard errors for Critical Injuries, deaths,
        and no kill. The retreat clock and the retreat are fight.py's; a mounted soldier makes a
        retreat step mounted where the row allows it. Its resolve_card and evaluate follow Chapter 5's fight.py: only a
        hold's last card evaluates the ladder; a flag lasts until the end of the Titan's next card that
        resolves a behavior, so a card under a hold, a card that comes up while it holds a Grabbed
        soldier, and a card with no one holding its Attention leave it standing; the nearest rung is
        met by the candidates at the closest Position, including when it is the highest rung met; a
        tie no card can break leaves Attention held by nothing; and an Abnormal ladder's
        current-holder rung is met by the soldier holding its Attention only while they are not at
        Distant (decision batch 3e, 3e-1 and 3e-6; decision batch 4, 4-3; OQ-111, as revised in
        decision batch 3e). The switches tie_break "sheet" and quarry "anywhere" run the rules as they
        stood before decision batch 4, and sheet_order lists the player characters cutters first or
        strikers first. roles names the player characters' roles (fight.py's switch, unset for the
        baseline's two cutters and two strikers): four strikers is the four-striker row (decision batch
        4b, 4b-2). Cutters who take Draw Attention do so only from a Position other than Distant, and
        the summary counts the attempts the rule bars (decision batch 5, OQ-113); DRAW_FROM_DISTANT
        restores the earlier reading for decision batch 4b's record probes, and the loud rider of
        that batch is no longer a role here. The ladder is read from
        data/titans/index.yaml, so the Sprinting Abnormal's rows run under the swapped ladder; a row
        with rungs runs another ladder.
    - file: jam6.py
      holds: >-
        The Jam test on a Chapter 6 Titan's own table, and its mounted reading: a holder on horseback
        at Distant, dodging with the horse, counted when the horse goes lame.
    - file: lone6.py
      holds: >-
        The lone Nape strike at each Titan's Nape Depth; the lone fight, Chapter 5's lone.py against
        each Titan's Tempo, Nape Depth, and Behavior Table, on the waiting line and, at Tempo 2, the
        hurried line and a one-card hold, with the abnormal Fear Roll for an Abnormal; and the Grab
        cells with the victim's dodge Pushed toward, and tested against, each Titan's own Grab
        fixed need, a third of its Attack Dice. The lone fight counts a spare canister and Field Repair, and ends when no decoy is
        usable (decision batch 3c, 3c-3).
    - file: run6.py
      holds: >-
        Runs one family (check, fight, jam, solo, grab, lone, bar) and writes results/<family>.json.
        fight N PREFIX and bar N PREFIX run only the cases or bar rows whose label starts with PREFIX
        and merge them in, each with its own seed. check
        also runs fight6.py's selftest. bar runs every Sprinting Abnormal case with its standard
        Medium and Large twins (the row with the same support, or the reference row) for the
        Abnormal's bar (targets, abnormals), in both Squad sheet orders: cutters first on seeds 800
        onward, and strikers first on seeds 1800 onward (decision batch 4, 4-4). A row whose reading
        fails a part read within sampling is re-run, the Abnormal row and both twins, on a second seed
        in the same order (cutters first on seeds 2800 onward, strikers first on 3800 onward), and
        results/bar.json keeps both runs and the pooled figures under second_seed, which render.py
        reads (targets, abnormals, sampling; decision batch 4b, 4b-4). A row that names the player
        characters' roles (the four-striker rows) is read against the standard Titans' rows with the
        same roles; Draw Attention's rows against the reference rows. check
        also checks every ladder's format, the first rung hooked-into-its-body and the last nearest
        (decision batch 4b, 4b-1).
    - file: render.py
      holds: >-
        collect writes data/titans/probe-figures.yaml from results; write and check render the chapter's
        tables from YAML, including the setup mix, which weights each Focus Titan's reference row by the
        interim setup table's odds, and the bar in both Squad sheet orders.
    - file: ../batch-3e/abnormal_b3e.py
      holds: >-
        Decision batch 3e's Sprinting Abnormal probe, kept as that batch's record: its ladder without
        current-holder in the helper, screen, and screen-with-pair rows, and Nape Depth 4 at the
        reference start, with helpers, and with the template Squad, each at 120,000 fights beside the
        standard Large Titan's twins as results/bar.json held them in that batch (written into the
        script); the share of resolved cards that are Thrash on every table; and, at its reference
        start, how often its current-holder rung kept a holder who was not the closest soldier. It pins
        batch 3e's rules (the Squad-sheet tie-break, current-holder met wherever the holder stands) and
        the Grab and Headlong Lunge at a fixed need of 3, and repeats abnormal_b3e.out.
    - file: ../batch-4/abnormal_b4.py
      holds: >-
        The Sprinting Abnormal's reports under decision batch 4 that run6.py does not write, on
        fight6.py's defaults and the committed YAML: the Thrash share on every table; at its reference
        start, how often current-holder keeps a holder who is not the closest soldier and how many cards
        land on a holder at Distant while someone stands closer or on a Down holder; the Grab alone at
        a fixed need of 2 and the ladder without current-holder on the bar's seeds in both orders, against
        results/bar.json's twins; and the parked rider against the standard Medium Titan. Run after
        run6.py bar. Its output is abnormal_b4.out beside it.
    - file: cases6.json
      holds: >-
        The full-fight cases, port check first; a case marked reference is its Titan's reference start.
        Cases labelled support are ADR-0014's support rows for every table, and cases labelled tactics
        the standard Medium Titan's Squad Tactic rows (decision batch 3b). Decision batch 4b appended four eager strikers and
        no cutters on Chapter 5's reference Titan (labelled four strikers) and on every Chapter 6 table
        (4b-2). The loud-rider cases it also appended left the file in decision batch 5 (OQ-113), which
        moved the seeds of the cases after them; every case was re-run under the retreat clock.
  commands:
    run_from: tools/probes/chapter-06
    needs: Python 3 with PyYAML, which uv run --with pyyaml supplies. Seeds are fixed, so each command repeats its figures.
    list:
      - {family: check, command: uv run --with pyyaml python run6.py check}
      - {family: fight, command: uv run --with pyyaml python run6.py fight 12000}
      - {family: jam, command: uv run --with pyyaml python run6.py jam 60000}
      - {family: solo, command: uv run --with pyyaml python run6.py solo 100000}
      - {family: grab, command: uv run --with pyyaml python run6.py grab 40000}
      - {family: lone, command: uv run --with pyyaml python run6.py lone 100000}
      - {family: bar, command: uv run --with pyyaml python run6.py bar 120000}
      - {family: "fight, bar, jam, solo, grab, and lone, decision batch 4's re-run of every family (the six full commands above)", command: uv run --with pyyaml python run6.py fight 12000 && uv run --with pyyaml python run6.py jam 60000 && uv run --with pyyaml python run6.py solo 100000 && uv run --with pyyaml python run6.py grab 40000 && uv run --with pyyaml python run6.py lone 100000 && uv run --with pyyaml python run6.py bar 120000}
      - {family: "decision batch 4's Sprinting Abnormal probe (verdicts, sprinting_abnormal; thrash_share), from the repository root, after bar", command: uv run --with pyyaml python tools/probes/batch-4/abnormal_b4.py}
      - {family: "decision batch 4b's probes (the loud rider under both ladders and the bar under the swapped ladder; four strikers and the two levers), from the repository root; they pin the 12-round horizon and Draw Attention from any Position, and the committed rows above govern", command: uv run --with pyyaml python tools/probes/batch-4b/loud_b4b.py explore && uv run --with pyyaml python tools/probes/batch-4b/loud_b4b.py bar && uv run --with pyyaml python tools/probes/batch-4b/strikers_b4b.py}
      - {family: "decision batch 3e's Sprinting Abnormal probe, its record, from the repository root", command: uv run --with pyyaml python tools/probes/batch-3e/abnormal_b3e.py}
      - {family: figures, command: uv run --with pyyaml python render.py collect}
      - {family: chapter, command: uv run --with pyyaml python render.py write}
  limits: >-
    The probes are Chapter 5's stand-ins, not the ADR-0014 simulator. A mounted soldier dismounts on
    their first move, except a screening Squadmate, who rides to the holder's Position first, and dodges
    with a horse rated 2; no soldier remounts or strikes eyes, and a soldier carries a comrade only in a
    retreat, so Broken eyes never arise in a fight and the carrying-a-comrade test arises only there
    (titans.py covers Broken eyes in the move-up shares). The probes of decision batches 3e to 4b pin the
    12-round horizon, so abnormal_b4.py's comparisons with results/bar.json's current twin rows mix two
    readings; its committed figures below are the ones it measured. A card's later effects skip a target who has died (OQ-107); no Chapter
    6 entry reaches that case. The setup mix counts only the Focus Titan's fight at its reference start,
    not Background Titans.

# ------------------------------------------------------------------ targets per table
# docs/rules/DECISIONS-2026-09-14.md, Constraints on the undrafted Phase 1 chapters, Chapter 6.
targets:
  medium:
    titan: standard-medium
    at_the_reference_start:
      median_kill_round: 3
      killed_by_round_3: 55% to 75%   # 55% to 70% before the round 3 retune (R2): retargeting's second-strike effect adds five points at every Frenzy setting
      critical_injuries_per_fight: 0.5 to 0.9
      deaths_per_fight: at most 0.15, deaths through the end of the Titan Engagement; deaths during the fight reported beside it   # round 3 retune, R2 (docs/reviews/round-3-retune-decisions.md): re-set to what the owner's batch 13 rules measure at Frenzy's halved rate, as 8-31 re-set it to 0.08; history: at most 0.08 under decision batch 8, 8-31, 0.06 under decision batch 7, 7-13, and 0.05 under decision batch 5, 5-19; re-set again under OQ-140
      grabs_per_fight: 0.15 to 0.45   # 0.15 to 0.30 before the round 3 retune (R2): Frenzy puts up to four faces on the Grab by design; the one-Grab-result guard is checked directly (every_standard_table)
  small:
    titan: standard-small
    at_the_reference_start:
      median_kill_round: 2
      critical_injuries_per_fight: at most 1.0
  large:
    titan: standard-large
    at_the_reference_start:
      median_kill_round: 3
      no_kill: at most 15%   # decision batch 5, 5-10
  every_standard_table:
    - The Jam test's worst cell stays under a third, for one and for two Titans of that class (OQ-72, OQ-96).
    - >-
      No kill share by previous behavior exceeds one half at any state at Frenzy 0. Chapter 6 reads
      "any state" as every previous behavior with every count of Broken eyes, arms, and legs, not
      only an unbroken Titan (decision batch 4, OQ-101). At Frenzy 1 to 3 the kill share rises past
      one half by design, since that is the escalation decision batch 13 (13-10) intends: those
      shares are figures the rerun reports by table, previous behavior, Broken parts, and Frenzy,
      not constraints an author checks, and Frenzy's rate and cap are the levers if they read too
      high (round 3 review 1, C4).
    - At most one result gives a grab effect and at most one a Critical Injury that can be lethal.
    - A holder at In Reach meets the Position requirement of at least four results in six.
  adr_0014_targets_quoted:
    bands:   # ADR-0014, as amended in decision batch 5 (OQ-127)
      prepared_squad: the median kill round is exactly 3
      lone_strike: {rookie_fresh_cut: 8% to 16%, levi_grade: 45% to 55%}
      grab: {alone: 61.7% to 71.7%, stress_2_grief_0: 28.3% to 38.3%, every_cell: under 50%}
      per_table: Each range or limit in targets is its own band, read exactly, and a median is read exactly.
      second_seed: A figure past a band's edge by at most 2 standard errors is re-run on a second seed and judged on the figure pooled over both runs.
    prepared_squad: A prepared Squad of 4 kills a standard Medium Titan in about 3 rounds.
    lone_strike: >-
      A lone, average soldier who has used Break Attention succeeds on about 10% of Nape strikes against a
      Medium Titan, between 8% and 16% on a cut made directly after Break Attention from the Rookie's
      fight-start Stress of 1, with the cut a lone soldier makes after the cards they took while waiting
      reported beside it and not tuned; a Levi-grade soldier pushing hard succeeds about 50% of the time.
      The solo figures are that fresh cut; the lone-fight figures report the in-fight cut.
    grab: >-
      A Grab kills about 1 time in 3 with comrades close (one comrade in reach, the six cells), about 2 in
      3 when alone.
    not_table_dependent: >-
      The lone strike, the Grab cells, and gas do not read the Behavior Table. Chapter 6 re-runs the first
      two at each stat block's Nape Depth and Grab so the figures quoted for each Titan come from
      its own values; gas is unchanged (data/engagement/tuning.yaml, gas). The lone fight does read the
      table, and is run for every Titan (decision batch 3b).
  abnormals:
    rule: >-
      Reported under the same probes; its values are chosen within the bounds and held against this
      bar, not tuned to a target. Values stay within Tempo 1 to 2, Nape Depth 3 to 4, Regeneration 2 to
      4, Toughness 1 to 3, and Attack Dice 3 to 12. Each limit below is a figure a standard Titan measured
      under the same probes: the standard Medium Titan is the floor, and the standard Large Titan, the
      hardest standard fight Phase 1 accepts, gives the winnable limit and the ceiling (read with its
      Bite reaching In Reach, as the round 3 retune set it, R5; before that the Large read below the
      Medium at Health 6 and the bar had no solution). Every part is
      read the same way, row against row, as decision batch 3b reads every table: each Abnormal row
      against the standard Medium and Large Titans' rows with the same support, or their reference
      rows where they have none (twins). A row's support is what it adds to the 4 player characters
      that another Titan's row can share: Squadmates and their role, the template Squad, Squad Tactics,
      and the Grab escapes. A row that adds Draw Attention, a rider Squadmate, or another
      ladder has no twin of its own. A row that names the player characters' roles, such as four
      strikers and no cutters, is read against the standard Titans' rows with the same roles (decision
      batch 4b, 4b-2). A row that gives the Abnormal a ladder it does not have, the standard ladder
      instead of its own and its earlier ladder, loudest-or-brightest then nearest, is run with its
      twins and reported beside the bar, not judged by it (reported_rows): the bar holds the published
      creature's values, its ladder among them, and a row that swaps one measures a design
      alternative, as the Grab-alone variant does (round 3 retune, R7;
      docs/reviews/round-3-retune-decisions.md). The bar is read under Chapter 5's last tie-break, which leaves a tie no card
      can break held by nothing, in both Squad sheet orders, the player characters listed cutters first
      and strikers first, with each twin run in the same order (decision batch 4, OQ-103, 4-4).
    reference_start: >-
      4 Rookie player characters at Stress 1 in Wooded terrain under the baseline policy, every one
      mounted at the start and making the abnormal Fear Roll.
    sampling:
      fights_per_row: 120000
      standard_errors: 2
      rule: >-
        The bar is measured by run6.py bar: every Abnormal row and its twins at 120,000 fights each,
        with standard errors, in both Squad sheet orders. A limit holds when the Abnormal's figure is on
        the permitted side of its twin's. It holds within sampling when it is past the twin's by no more
        than 2 standard errors of the difference (the square root of the sum of the two squared
        standard errors) at 120,000 fights a row. A row past that on one seed is re-run on a second
        seed in the same order, the Abnormal row and both twins, and it fails only if the figure pooled
        over the two runs is past 2 standard errors (run6.py bar, second_seed; decision batch 4b, 4b-4;
        ADR-0014, as amended in decision batch 4b). The same tolerance applies to the floor, the
        winnable limit, and the ceiling, and a row holds only when it holds in both orders. The median
        kill round is read exactly, on the first seed.
    reported_rows:   # round 3 retune, R7: run with the twins and rendered in the bar's tables with their z, past or not, and never a Missed result
      - 'sprinting-abnormal: the standard ladder instead of its own'
      - 'sprinting-abnormal: its earlier ladder, loudest-or-brightest then nearest'
    not_trivial:
      - In every row, the median kill round is 2 or later.
      - In every row, Critical Injuries per fight are at least those of the standard Medium Titan's twin.
      - >-
        In the reference row, deaths per fight, deaths through the end of the Titan Engagement with
        deaths during the fight reported beside them, are more than the standard Medium Titan's
        reference row (decision batch 5, 5-19).
    winnable:
      - In every row, the median kill round is 4 or sooner.
      - In every row, no kill is at most the standard Large Titan's twin (decision batch 5, 5-10).
    ceiling:
      - >-
        In every row, deaths per fight, deaths through the end of the Titan Engagement with deaths
        during the fight reported beside them, are at most the standard Large Titan's twin (decision
        batch 5, 5-19).
    oq_199:   # round 3 retune, R7; closed on the confirming run of the zone retune (Z5)
      - >-
        The Critical Injuries floor in the screen with Hook and Cut and Hamstring Line, with the escapes,
        in both orders, was Missed on the confirming run of the round 3 retune (rules hash
        0e5b7591a58a8d85): 0.491 against the standard Medium Titan's 0.522 pooled over two seeds with the
        cutters first (+11.1 standard errors) and 0.492 against 0.523 with the strikers first (+10.9), on
        both death readings. It was logged as OQ-199 and not retuned. On the confirming run of the zone
        retune (rules hash 54e147e73e8d0852) it holds in both orders: 0.514 against 0.513 with the cutters
        first (z -0.3) and 0.513 against 0.511 with the strikers first (z -0.7), on both death readings
        (docs/reviews/simulator-report.md, sections 5.1 and 5.2), and OQ-199 is closed.
    report: >-
      The setup mix: Critical Injuries and deaths per Titan Engagement the interim setup table sets up,
      with and without its Abnormal roll (OQ-104).
    decided: OQ-103   # decision batch 4, 4-4

# ------------------------------------------------------------------ Phase 1 simulator cases Chapter 6 adds
# Also listed in data/engagement/tuning.yaml (simulator_cases).
simulator_cases:
  - >-
    Each Chapter 6 table with every Squad Tactic alone and in pairs, decoy screens, and helper Squadmates
    under the full rules. The probes now report the support rows for every table and every Squad Tactic
    for the standard Medium Titan (verdicts; decision batch 3b), so the simulator re-measures them.
  - The lone fight on each table at its Tempo, with the fresh and the in-fight cut and the Stress at the cut.
  - Broken eyes in the full fight, with a policy that strikes eyes, for every table whose entries use eyes.
  - >-
    The Sprinting Abnormal against the PC Critical Injury and PC death targets at the setup table's
    rate (OQ-104), with Draw Attention and a Read revealing its ladder.
  - Two Focus Titans of different Size Classes in the Jam test, and a standard Titan with the Abnormal.
  - >-
    The four-striker Squad (4 eager strikers and no cutters) beside the baseline Squad on every table,
    reported beside every target, whose report is the input to the open question on cutting legs
    (ADR-0014, as amended in decision batch 4b; decision batch 4b, 4b-2; OQ-112).
  - >-
    The start-of-fight Fear Rolls (first-titan-engagement, abnormal) in every case whose start calls for
    them, and mounted starts, which Chapter 5's fight.py does not model.

# ------------------------------------------------------------------ verdicts
# Every verdict below reads the confirming run of the zone retune (decision batch 8, 8-1, 8-14, and 8-31; the
# zone retune, Z5; docs/reviews/simulator-report.md, cited by section), in which every ADR-0014 target, every
# band above, and every limit of the Abnormal's bar is Met, no fight reached the safety cap, and OQ-199 is
# closed (targets, abnormals, oq_199); probe-figures.yaml is re-committed from that run. A figure a verdict
# gives as the probes' was measured with each entry's fixed need of dodge successes, before Attack Dice
# replaced it at 3 dice per point, and stands as the record of the measurement that chose a value
# (tools/probes/chapter-06 and tools/probes/batch-4 where named, under the retreat clock after decision batch
# 5 unless it says the 12-round horizon). If the report and a verdict differ, the report governs and the
# verdict is re-written.
verdicts:
  port_check: >-
    Met within sampling on the confirming run of the zone retune (docs/reviews/simulator-report.md,
    sections 9 and 10). The simulator's Chapter 6 port-check case on Chapter 5's reference Titan gives
    median kill round 3, 70.3% by round 3, and 0.79 Critical Injuries per fight, and its Chapter 5
    reference case the same median, 71.0% and 0.81, all under the retreat clock: the two models agree
    within sampling, which is what the port check asks. Both sit well above the figures committed before
    decision batch 13 (62.5% and 0.70 for the Chapter 6 case; 62.0% and 0.72 for fight.py's, z +14.8 and
    +5.4 on this run), because retargeting and Frenzy shortened the fight and made the Titan's cards
    count.
  medium: >-
    Met on every band on the confirming run of the zone retune, each band a range or limit read exactly
    and the median read exactly (ADR-0014, as amended in decision batches 5, 5c, 7, and 8, and by the
    round 3 retune, R2; docs/reviews/simulator-report.md, section 3). At the reference start: median kill
    round 3 (44.8% killed by round 2), 69.9% by round 3 (55% to 75%), 0.8313 Critical Injuries (standard
    error 0.0120; 0.5 to 0.9), and 0.3292 Grabs (standard error 0.0062; 0.15 to 0.45) per fight, under the
    retreat clock; on the bar's two runs of that start, round 3, 70.3% and 70.2%, 0.8356 and 0.8341
    Critical Injuries, and 0.3250 and 0.3247 Grabs, each Met. The killed-by-round-3 band's top moved from
    70% to 75% and the Grabs band's from 0.30 to 0.45 under the round 3 retune (R2): retargeting frees a
    striker who fell short to cut again, worth about five points at every Frenzy setting, and Frenzy piles
    up to four faces on the entry at result 6, which on every standard table is the Grab; the
    one-Grab-result guard the band once carried is now read directly (every_standard_table; section 4.1).
    Deaths per fight (at most 0.15, re-set by the round 3 retune, R2, to what the owner's batch 13 rules
    measure at Frenzy's halved rate, which decides OQ-132 anew again, and kept by the zone retune, which
    slowed Frenzy to every third round because zones and wrecks had carried the deaths past it, Z2; at
    most 0.08 under decision batch 8, 8-31, 0.06 under decision batch 7, 7-13, and 0.05 under decision
    batch 5, 5-19) read deaths through the end of the Titan Engagement (decision batch 5, 5-19), which the
    probes do not count: the confirming run gives 0.1373 (standard error 0.0052) at the reference start
    and 0.1463 and 0.1460 (standard error 0.0017) in the bar's two sheet orders, Met
    (docs/reviews/simulator-report.md, section 3). Deaths during the fight are reported beside it: the
    confirming run gives 0.1292, 0.1385, and 0.1388; the probes, under each entry's fixed need, give 0.046
    (standard error 0.003) at 12,000 fights, and the bar's twin rows 0.0487 (standard error 0.0009) with
    the cutters first and 0.0501 with the strikers first, pooled over a second seed 0.0494 (standard error
    0.0006). Jam test worst cells on the table reading, which is the acceptance reading (section 4.2),
    1.6% for one Titan and 17.2% for two, both Met; the mounted reading, reported beside them, 11.0% and
    35.7%. Highest kill share 0.500 in any state at Frenzy 0 (section 4.1). Sensitivity rows (section 9):
    strikers wait (63.0% by round 3, 0.95 Critical Injuries), dodge only lethal harm and Grabs (71.8%,
    1.00), helper Squadmates, template Squad (median round 3, 60.5%, 1.13), a mounted start (70.0%, 0.86,
    0.143 deaths during the fight and 0.150 through the end), and a first Titan Engagement with its Fear
    Roll (median 3, 66.3%, 0.97 Critical Injuries, 0.383 Grabs, 0.195 deaths during the fight and 0.202
    through the end, so its deaths still pass the Medium band's limit, and it is reported, not tuned;
    decision batch 8, 8-31). Support rows (decision batch 3b; section 9): helpers median round 2, 77.1% by
    round 3, 0.68 Critical Injuries; the screen beside the holder round 2, 74.1%, 0.56; Hook and Cut and
    Hamstring Line round 3, 72.2%, 0.72; the screen with that pair round 2, 76.8%, 0.50, 0.043 deaths
    during the fight. Every Squad Tactic alone and in pairs: median kill round 3, 70.1% to 72.2% by round
    3, 0.72 to 0.82 Critical Injuries. On the confirming run the helpers resolve 0.776 Titan cards a round
    and the screen 0.603; the probes, under each entry's fixed need, gave 0.837 and 0.634.
  small: >-
    Met on the confirming run of the zone retune (docs/reviews/simulator-report.md, sections 3, 4, 7, and
    9). Median kill round 2 (67.7% killed by round 2) and 0.8153 Critical Injuries per fight (standard
    error 0.0128; at most 1.0), with steam; 0.79 without steam, the same within sampling (section 7). Jam
    test worst cells on the table reading 1.5% and 16.6%, both Met; on the mounted reading, reported
    beside them, 12.4% and 38.9%. Highest kill share 0.500 at Frenzy 0. Support rows, each median kill
    round 2: helpers 89.2% by round 3, 0.69 Critical Injuries; the screen 89.5%, 0.52; Hook and Cut and
    Hamstring Line 85.9%, 0.69; the screen with that pair 90.6%, 0.46. Under retargeting and Frenzy the
    Small Titan sits level with the standard Medium Titan's same-support Critical Injuries with helpers
    (0.69 against 0.68) and below them in every other row, where before decision batch 13 it sat above: a
    retarget moves its Attention on 19.1% of its cards at the reference start against the Medium's 33.4%,
    and on 19.3% against 34.9% with the screen (section 6.15). It is reported, not a bar: the Small
    Titan's own bands are the median kill round and the Critical Injuries limit above, and both are Met.
    On the confirming run the helpers resolve 1.376 Titan cards a round and the screen 1.046; the probes,
    under each entry's fixed need, gave 1.485 and 1.098.
  large: >-
    Met on the confirming run of the zone retune (docs/reviews/simulator-report.md, sections 3, 4, 6.2, 9,
    and 10). Median kill round 3 (43.2% killed by round 2) and 6.8% of fights with no kill (standard error
    0.2; at most 15%; decision batch 5, 5-10), and 6.8% and 6.9% on the bar's runs of that start, with
    1.24 Critical Injuries and 0.221 deaths per fight during the fight (0.233 through the end), above
    Chapter 5's reference Large Titan (1.09 and 0.179; 0.196 through the end), because the round 3 retune
    let its Bite reach In Reach as well as On Body (R5), which the Large's row needed once Health 6 and
    retargeting had taken away the fall from a flail as its only kill. Heavy Tread needs both legs
    (OQ-109); with one leg the probes' row gave 13.0%, 1.38, and 0.162 before decision batch 3e, to the
    12-round horizon. Template Squad: median round 3, 12.2% with no kill, 1.64 Critical Injuries, 0.392
    deaths during the fight and 0.406 through the end, still the hardest standard fight Phase 1 accepts.
    Jam test worst cells on the table reading 2.8% and 26.7%, both Met; on the mounted reading, reported
    beside them, 15.8% and 46.0%. The two-Titan table cell is under a third by 6.6 points, and any change
    to the Large table that the Jam test reads re-runs it; the Jam test breaks no Body Part, so Heavy
    Tread's legs do not reach it. Highest kill share 0.500 at Frenzy 0. Support rows: helpers median round
    2, 75.2% by round 3, 3.5% with no kill, 1.03 Critical Injuries, 0.101 deaths during the fight; the
    screen round 3, 71.9%, 3.5%, 0.86, 0.090, so Heavy Tread does not make it a trap; Hook and Cut and
    Hamstring Line round 3, 69.0%, 6.2%, 1.08, 0.194; the screen with that pair round 2, 74.5%, 3.0%,
    0.75, 0.074.
  lone_strike: >-
    Met on the standard Medium Titan at the measurement point on the confirming run of the zone retune
    (docs/reviews/simulator-report.md, sections 1, 2.2, and 9): the Rookie's fresh cut succeeds on 15.0%
    at Stress 1 (standard error 0.1; 8% to 16%, the top re-set by the round 3 retune, R4, because decision
    batch 11's Push re-rolls the blade's Gear Dice and lifted the cut from 13.0% to 15.0%; 11.6% from
    Stress 0), the Veteran 35.9% at Stress 2, and the Levi-grade soldier 52.0% at Stress 2 (standard error
    0.2; about 50%, read as 45% to 55%). The standard Large Titan shares Nape Depth 4 and gives the same;
    the standard Small Titan's Nape Depth 3 gives the Rookie 35.9%, and the Sprinting Abnormal's 35.9%.
    Reported beside it and not tuned, the lone fight on the waiting line, under the retreat clock and on
    the field: a usable strike before the retreat in 36.0% of lone fights against the standard Medium
    Titan, with the in-fight cut at 21.2% and a mean Stress of 3.05; Large 30.8%; Small 17.3%, after 4.43
    Titan cards, with 35.0% devoured; the Sprinting Abnormal 9.9%, with 43.9% Down and 2.04 Critical
    Injuries per lone fight. Each counts a spare canister and Field Repair (decision batch 3c, 3c-3), and
    no decoy is usable first in any lone fight on any table or line (0.0%). The Abnormal's own table,
    whose Run Past and Trample reach Distant, gives fewer strikes than decision batch 3b's starting row
    for Tempo 2 and Nape Depth 3 on the reference table (69.2% in the probes). The hurried line: Small
    33.5% (29.3% devoured), Abnormal 22.3% (29.1%). A one-card hold would give 8.3% and 4.5%. On the
    confirming run 7.3% of the Small Titan's lone fights end with the Titan dead, and 12.5% of the
    Abnormal's are still waiting when the retreat begins. The lone model reads the Abnormal's Grab, which
    rolls 6 Attack Dice (decision batch 4). The Abnormal's rows are rendered only in its GM subsection
    (OQ-108).
  grab: >-
    Met on every Titan on the confirming run of the zone retune, with each victim dodging the Titan's own
    Grab Attack Dice and witnesses' Fear Rolls on every row of the re-cut table
    (docs/reviews/simulator-report.md, sections 1 and 9). On the standard Medium Titan (9 Attack Dice) a
    lone victim whose dodge failed dies 67.6% of the time (standard error 0.2; about 2 in 3, read as 61.7%
    to 71.7%) and one who did not dodge 70.0%; with one comrade in reach the six cells run 25.9% to 45.9%,
    with the Stress 2, Grief 0 cell at 30.8% (near 1 in 3, read as 28.3% to 38.3%). Small (6 Attack Dice)
    runs 26.0% to 45.9%, Large (12) 25.4% to 45.6%, and the Sprinting Abnormal (6 since decision batch 4)
    25.9% to 45.6%, with 67.7% alone after a failed dodge; every cell is under 50%. The worst cell on
    every Titan is Stress 3, Grief 1; the probes, under each entry's fixed need and the old Fear table,
    gave it 44.4% to 45.3%. The Grab family reads no clock and no Behavior Table, so decision batch 13
    moved it only through the Fear Rolls and Health; on this run the one-comrade cells sit about a point
    under the round 3 retune's (the Medium's Stress 2, Grief 0 cell 30.8% against 31.8%).
  sprinting_abnormal: >-
    Reported, not tuned to a target, and holding every part of the Chapter 6 bar (targets, abnormals) in
    every judged row and both Squad sheet orders, which closes OQ-199 (targets, abnormals, oq_199; the
    zone retune, Z5). The bar is read row against row at 120,000 fights a row under the retreat clock on
    the confirming run of the zone retune (docs/reviews/simulator-report.md, section 5; decision batch 4,
    4-4; decision batch 5, 5-10). Two rows are run with their twins and reported beside the bar rather
    than judged by it, because they give the Abnormal a ladder it does not have and the bar holds the
    published creature's values (reported_rows; round 3 retune, R7): the standard ladder instead of its
    own, and its earlier ladder, loudest-or-brightest then nearest. Its ladder begins with
    hooked-into-its-body, as every ladder does, so noise, its second rung, never turns it off a striker
    who fell short (decision batch 4b, 4b-1), and it names current-holder, met only by a holder not at
    Distant; Chapter 5's last tie-break leaves a tie no card can break held by nothing, so the Squad
    sheet's order chooses nothing and the two orders differ by sampling alone (decision batch 4, 4-3). Its
    Grab and Headlong Lunge roll 6 Attack Dice, and its Pitch Headlong wrecks no zone (the zone retune,
    Z3). Draw Attention needs a Position other than Distant, so decision batch 4b's loud-rider rows are no
    longer legal policies and have left the bar (decision batch 5, OQ-113). On the confirming run
    (docs/reviews/simulator-report.md, sections 2.3, 5, and 9), at its reference start: median kill round
    2, 74.8% by round 3, 5.3% of fights with no kill, 0.89 Critical Injuries, 0.155 deaths during the
    fight (0.161 through the end), and 0.452 Grabs per fight, 24.5% of them devouring (27.3% counting any
    death while held). The bar, read on deaths through the end of the Titan Engagement, cutters first then
    strikers first, gives the same verdict under deaths during the fight (sections 5.1 and 5.2): at the
    reference start a median kill in round 2 in both orders, 0.917 and 0.916 Critical Injuries against the
    standard Medium Titan's 0.836 and 0.834, and 0.1673 and 0.1653 deaths against the Medium Titan's
    0.1463 and 0.1460; every row has a median kill in round 2 or 3; Critical Injuries at least the Medium
    twin's in every judged row, the closest the screen with Hook and Cut and Hamstring Line, with the
    escapes, the row OQ-199 held open (0.514 against 0.513 with the cutters first, z -0.3, and 0.513
    against 0.511 with the strikers first, z -0.7, on both death readings), then the template Squad (1.178
    against 1.153 with the strikers first, 3.3 standard errors). No kill under the Large twin's in every
    row by 5.5 standard errors or more, the closest the helpers row (3.26% against 3.67% with the cutters
    first); deaths under the Large twin's in every row by 23.8 standard errors or more, the closest the
    start on foot (0.1685 against 0.2387 with the cutters first) and then its reference start (0.1673
    against 0.2387 and 0.1653 against 0.2420). A figure past a limit by more than 2 standard errors is
    re-run on a second seed in the same order, with its twins, and judged on the pooled figure (targets,
    abnormals, sampling; decision batch 4b, 4b-4). Of the two reported ladder rows, the standard ladder
    instead of its own sits at the Critical Injuries floor with the cutters first (0.821 against 0.830
    pooled over two seeds, +2.3) and holds every other limit in both orders, and its earlier ladder holds
    every limit in both orders by 5.9 standard errors or more; a limit past on either is reported and is
    never a Missed result. The standard-ladder row is also the measurement that shows the ladder is not
    what keeps retargeting off the runner: with it the Abnormal is retargeted on 19.1% of its cards
    against 23.8% under its own ladder (section 6.15). Four strikers hold their part against the standard
    Titans' four-striker rows (0.0336 and 0.0335 deaths against the Large Titan's 0.0787 and 0.0763; 0.411
    and 0.410 Critical Injuries against the Medium Titan's 0.301 and 0.304). The Grab alone at 6 Attack
    Dice, with Headlong Lunge at 9, is a variant of the creature's values and is reported beside the bar,
    not judged by it; on the confirming run it holds every limit in every row in both orders, on deaths
    through the end and during the fight alike (sections 5.3 and 5.4), where on the run before the round 3
    retune's confirming run it had failed the ceiling with helpers in both orders through the end. The
    probes' records below, under each entry's fixed need, stand as the measurements that chose its values;
    those measured to the 12-round horizon before decision batch 5 stand as measured. The probes' figures
    at its reference start (12,000 fights) were median kill round 2, 69.3% by round 3, 8.9% with no kill,
    0.85 Critical Injuries, 0.104 deaths, and 0.328 Grabs, 19.4% of them fatal; on the bar 0.0352 against
    0.0454 and 0.0336 against 0.0465 for helpers. The same variant on the bar's seeds (abnormal_b4.py):
    helpers 0.0219 against 0.0200 (2.2 standard errors) and 0.0218 against 0.0194 (2.8), which the
    2-standard-error tolerance counts as failures; it sits above its twin's rate, not at it (pooled over
    seven runs 0.0217 against 0.0206 with helpers, +3.5 standard errors, and 0.0108 against 0.0103 with
    the screen, +2.6; decision batch 4b, 4b-4), and decision batch 4 had seen it fail one of two seeds
    (quarry_b4_grab2_bar.out: the screen with the pair, 2.1). Without current-holder (abnormal_b4.py, both
    orders): helpers 0.0208 and 0.0209 against 0.0200 and 0.0194 (0.9 and 1.7 standard errors), the screen
    0.0111 and 0.0112 against 0.0099 and 0.0106 (2.4 and 1.2), and the screen with the pair 0.0087 and
    0.0091 against 0.0079 and 0.0081 (1.9 and 2.4), so it fails narrowly; under decision batch 3e, with
    the kill entries at a fixed need of 3, it failed by 8.0 to 12.7 (abnormal_b3e.py). At its reference
    start the current-holder rung kept a holder who was not at the closest Position 0.98 times a fight, no
    card resolved against a holder at Distant while a candidate stood closer, and 0.18 cards a fight
    resolved against a Down holder (abnormal_b4.py, 60,000 fights). The parked rider, listed first and
    never leaving the saddle at Distant: 0.177 deaths and 1.38 Critical Injuries against the standard
    Medium Titan's 0.082 and 0.95 with the same Squad (abnormal_b4.py, 120,000 fights), so parking a
    silent rider buys nothing. Values chosen against the bar (OQ-103): under decision batch 4's tie-break
    the Grab and Headlong Lunge at a fixed need of 3 failed the ceiling in every supported row (3.4 to 5.9
    standard errors at 24,000 fights; tools/probes/batch-4/quarry_b4.py and sweep_b4.py); with the round 2
    ladder and Pitch Headlong at a fixed need of 2 the helpers row gave 0.026 deaths against 0.019, about
    6 standard errors at 60,000 fights, and at a fixed need of 1 it holds; with leg Toughness 3 the
    template Squad row gave 0.296 deaths against 0.268 (round 1). At Nape Depth 4 (abnormal_b3e.py, under
    decision batch 3e, not re-measured) every row read failed the winnable limit and the ceiling: the
    reference start 18.5% with no kill against 13.0% and 0.172 deaths against 0.164; helpers 12.6% against
    9.3% and 0.051 against 0.020; the template Squad median kill round 6, 37.0% against 20.0%, and 0.344
    against 0.278. Sensitivity rows on the confirming run (section 9, under the retreat clock; deaths
    during the fight): template Squad median round 3, 69.4% by round 3, 8.7% with no kill, 1.19 Critical
    Injuries, 0.266 deaths; Draw Attention from a Position other than Distant, median round 2, 76.9%, 4.7%
    with no kill, 0.97, 0.149, with 0.19 attempts a fight by a cutter still at Distant barred (section
    6.7); four strikers and no cutters median round 2, 95.3%, 0.4%, 0.41, 0.030 (4b-2); two mounted
    Squadmates at Distant 76.1%, 0.94, 0.143 deaths; the standard ladder 78.8%, 4.0%, 0.82, 0.131; on foot
    with the Fear Roll 74.7%, 0.92, 0.169; its earlier ladder (loudest-or-brightest, nearest) median round
    2, 77.2%, 4.2% with no kill, 0.84, 0.127. Support rows: helpers 79.8%, 0.79, 0.059; the screen 82.3%,
    0.58, 0.037; Hook and Cut and Hamstring Line 78.9%, 0.80, 0.130; the screen with that pair 85.3%,
    0.51, 0.030. On the confirming run the screen resolves 1.129 Titan cards a round; the probes gave
    1.211. Jam test worst cells on the table reading (section 4.2) 1.6% and 16.9%; on the mounted reading,
    reported beside them, 12.2% and 39.3%. Highest kill share 0.500 at Frenzy 0 (section 4.1); fewest
    legal entries besides Thrash 1. Retargeting moves its Attention on 23.8% of its cards at the reference
    start against the standard Medium Titan's 33.4%, and on 21.9% against 33.0% in the screen with Hook
    and Cut and Hamstring Line, with Thrash 14.9% of its cards against 9.4%: its cards fail for want of
    anyone to reach rather than for a holder out of Position, which is the failure retargeting answers. On
    the round 3 retune's run that gap left the Critical Injuries floor Missed in that row (OQ-199); on
    this run the floor holds there (section 6.15).
  thrash_share: >-
    Reported, not tuned (decision batch 4, OQ-101). The confirming run reports it directly
    (docs/reviews/simulator-report.md, section 6.15), and its kill-share states match the committed shares
    in every state (section 4.1). Under decision batch 13's retarget, on the field, at each reference
    start, Thrash is 8.9% of the standard Small Titan's resolved cards, 7.3% of the standard Medium
    Titan's, 11.9% of the standard Large Titan's, and 13.7% of the Sprinting Abnormal's; a retarget moves
    the Titan's Attention on 19.1%, 33.4%, 31.1%, and 23.8% of those cards, and the rolled entry reaches
    no one at all on 8.4%, 6.9%, 8.0%, and 8.7%. That is what the rule set out to do: the standard Medium
    Titan's Thrash share fell from 41.2% to 7.3%, and the Sprinting Abnormal's, whose cards fail for want
    of anyone to reach rather than for a holder out of Position, from 33.7% to 13.7%. Before the rule, at
    each reference start (tools/probes/batch-4/abnormal_b4.py, 12,000 fights a table, to the 12-round
    horizon), Thrash was 30.9% of the standard Small Titan's resolved cards, 41.2% of the standard Medium
    Titan's, 40.9% of the standard Large Titan's, and 33.7% of the Sprinting Abnormal's. Nearly all of it
    came from a holder at a Position the rolled entry excludes, or a fallback that repeats, rather than a
    Broken part: 1.27 of 1.30 Thrash cards a fight, 1.34 of 1.37, 1.34 of 1.49, and 1.66 of 2.00. The
    commonest case is a Nape striker who fell short and holds Attention at Blind Spot.
  setup_mix: >-
    Reported, not tuned. Weighted by the interim setup table, the Focus Titan's fight at its reference
    start, under the retreat clock, deals on the confirming run of the zone retune 0.894 Critical Injuries
    and 0.127 deaths during the fight per Titan Engagement without the Abnormal roll (0.137 through the
    end), and 0.899 and 0.129 with it (0.139 through the end; 1 Titan Engagement in 12; decision batch 4,
    OQ-104; docs/reviews/simulator-report.md, section 6.9), so the roll adds 0.005 Critical Injuries and
    0.002 deaths during the fight. The probes, under each entry's fixed need, gave 0.83 and 0.065, and
    0.85 and 0.070. Background Titans are not counted (OQ-115).
  four_strikers: >-
    Reported beside the prepared-Squad target, not tuned (ADR-0014, as amended in decision batch 4b;
    decision batch 4b, 4b-2; OQ-112). The target is read under the baseline Squad, two cutters and two
    strikers. On the confirming run of the zone retune (docs/reviews/simulator-report.md, sections 5.1,
    6.8, and 9; under the retreat clock; deaths during the fight) four eager strikers and no cutters beat
    it on every table: Chapter 5's reference Titan median round 2, 89.6% by round 3, 0.30 Critical
    Injuries, 0.036 deaths, against its baseline's 71.0%, 0.81, 0.111; the standard Small Titan median
    round 1, 96.4%, 0.31, 0.023, against 84.0%, 0.82, 0.077; the standard Medium Titan median round 2,
    89.0%, 0.31, 0.042, against 69.9%, 0.83, 0.129; the standard Large Titan median round 2, 88.5%, 1.5%
    with no kill, 0.48, 0.075, against 66.7%, 6.8%, 1.24, 0.221; the Sprinting Abnormal median round 2,
    95.3%, 0.41, 0.030, against 74.8%, 0.89, 0.155. The Medium and Large medians sit off the boundary of
    rounds 2 and 3, at the reference start and in both of the bar's twin runs, where on the round 3
    retune's run they sat on it. The Sprinting Abnormal's four-striker row holds its bar against the
    standard Titans' four-striker rows in both orders. The probes, under each entry's fixed need, gave the
    standard Medium Titan's row 77.3%, 0.44, 0.016 against 61.7%, 0.69, 0.046.
  gas: Unchanged from Chapter 5 (medians 8 and 6 rounds, read exactly, Met on the confirming run of the zone retune with means 9.24 and 6.34; docs/reviews/simulator-report.md, section 1); no Chapter 6 rule adds ODM use.
