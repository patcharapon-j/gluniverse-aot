    through the end), and 0.842 and 0.078 with it (0.088 through the end; 1 Titan Engagement in 12;
    decision batch 4, OQ-104; docs/reviews/simulator-report.md, section 6.9). The probes, under each
    entry's fixed need, gave 0.83 and 0.065, and 0.85 and 0.070. Background Titans are not counted
    (OQ-115).
  four_strikers: >-
    Reported beside the prepared-Squad target, not tuned (ADR-0014, as amended in decision batch 4b;
    decision batch 4b, 4b-2; OQ-112). The target is read under the baseline Squad, two cutters and
    two strikers. On the final full rerun under Attack Dice (docs/reviews/simulator-report.md,
    sections 5.1, 6.8, and 9; under the retreat clock; deaths during the fight) four eager strikers and
    no cutters beat it on every table: Chapter 5's reference Titan median round 2 on the boundary,
    78.3% by round 3, 0.43 Critical Injuries, 0.020 deaths, against its baseline's 62.5%, 0.70, 0.064;
    the standard Small Titan 91.1%, 0.63, 0.023, against 81.3%, 0.86, 0.060; the standard Medium Titan
    median round 3 on the boundary, 78.6%, 0.44, 0.025, against 62.4%, 0.69, 0.066; the standard Large
    Titan median round 2 on the boundary, 78.7%, 2.6% with no kill, 0.76, 0.063, against 62.5%, 12.9%,
    1.19, 0.141; the Sprinting Abnormal median round 2, 92.2%, 0.62, 0.019, against 71.1%, 0.83, 0.088.
    The Medium and Large medians sit on the boundary of rounds 2 and 3: in the bar's twin runs the
    Medium row is round 3 on the boundary with the cutters first and round 2 with the strikers first,
    and the Large row round 2 in both. The Sprinting Abnormal's four-striker row holds its bar against
    the standard Titans' four-striker rows in both orders. The probes, under each entry's fixed need,
    gave the standard Medium Titan's row 77.3%, 0.44, 0.016 against 61.7%, 0.69, 0.046.
  gas: Unchanged from Chapter 5 (medians 8 and 6 rounds, read exactly, Met on the final full rerun under Attack Dice with means 9.24 and 6.34; docs/reviews/simulator-report.md, section 1); no Chapter 6 rule adds ODM use.
