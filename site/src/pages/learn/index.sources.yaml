# Sources for the page beside this file (scripts/check-sync.mjs).
#
# Learn to Play is a page, not a content entry, so it has no frontmatter to
# carry its `sources`. This sidecar records them instead: `<page>.sources.yaml`
# beside `<page>.astro`. Astro does not route a .yaml under src/pages, so the
# file is only ever read by the resync check.
#
# The page states no rule of its own. Every rule on it is the simple case of a
# rule a finished chapter already owns, so its sources are those chapters, which
# carry their own `docs/rules` and `data/` shas in their frontmatter, plus the
# few tables the page reads directly. What it claims, line by line, is in
# site/design/claims/learn-to-play.md.
sources:
