# Player wording for Talents whose table text points at files, sections, or ids.
# Keyed by the Talent's id in data/character/talents.yaml. Every Rule Talent needs a trigger and an
# effect here; a Dice Talent's effect is built from its row, and it appears here only to reword a
# condition. A Talent with no wording, or wording that still carries a reference, fails the build
# (site/src/lib/shared-data.ts, site/src/lib/player-text.ts).
#
# Never change a rule's meaning. When a source below changes, check the wording against it and
# record the new sha from `git hash-object <path>` (scripts/check-sync.mjs lists what changed).
sources:
  - path: data/character/talents.yaml
    sha: "4d63533a7910acc0dcb8bb0ee1f5e6e5b0340c4b"
  - path: data/character/action-catalog.yaml
    sha: "747752afe49fd764d041b05362412356a62fe355"
  - path: data/engagement/read.yaml
    sha: "5cbfdd4940f123fe6d0ec2bbeacbe25db25d6f66"
  - path: data/engagement/grab.yaml
    sha: "7361e0322fd2bdd2018b54efc3704e30b849dbe3"
  - path: data/gear/falls.yaml
    sha: "7508711ebe1cb5f4afd6468ffeef8b443d5e5420"
  - path: data/harm/death-rolls.yaml
    sha: "66dd2a154f48e9036242cd6c26de2ef46c4ee9a6"
  - path: data/mind/fear-rolls.yaml
    sha: "6b6e4d5d77bf9c68bdd2ef02fd9c4229d0e1dd99"

talents:
  # ---------------------------------------------------------------- Slayer
  relentless:
    trigger: Your Nape strike falls short of the struck Titan's Nape Depth with at least 1 success.
    effect: The strike creates 1 more Opening than its successes give it. It does not change the roll, its successes, or whether the Titan dies.
  blade-discipline:
    trigger: A Pushed roll for one of these Actions, made with a Blade Set as its gear item, is about to wear that Blade Set.
    effect: Ignore 1 point of that wear.
  flat-of-the-blade:
    trigger: Your Fight made with a Blade Set lands on a Foe in a Skirmish.
    effect: You may make its damage Crush instead of Cut. A Foe it brings to 0 Health is out cold, as Crush damage leaves a Foe, and not dead.
  ready-blade:
    trigger: You declare that Hook and Cut makes you its striking comrade, and your action this round is already spent.
    effect: Hook and Cut may still be used with you as that comrade. Its Nape strike spends the action of your next turn instead. Every other condition of Hook and Cut still applies.
  wrist-cut:
    trigger: Your Body Part strike against an arm that holds a Grabbed comrade has at least 1 success.
    effect: The strike gains 1 success.

  # ---------------------------------------------------------------- Flier and Engineer
  well-kept-rig:
    trigger: A Pushed roll for one of these Actions, made with your ODM Gear as its gear item, is about to wear your ODM Gear.
    effect: Ignore 1 point of that wear.

  # ---------------------------------------------------------------- Flier
  light-trigger:
    trigger: Your Gas Roll this round would be three dice because you made a Pushed roll whose gear item was ODM Gear.
    effect: The Gas Roll is two dice instead.
  mid-air-catch:
    trigger: >-
      In a Titan Engagement, a comrade falls while holding the same Position as you, relative to the Titan the
      fall is measured from, and you are airborne, not carried, and carrying no comrade.
    effect: >-
      Before the fall's damage is rolled, you may make a Fly roll with your own ODM Gear, needing 1 success.
      It spends nothing, can be Pushed, cannot be Helped, and counts as using your ODM Gear. On a success the
      fall counts as a low fall, whatever its height would give. A Jam on this roll makes you fall, as any Jam
      does.
  lookout-tree:
    trigger: >-
      A Leg roll succeeds, the Waypoint the Leg leads to is Forest or Giant forest, and you are not Down and your
      ODM Gear is not Jammed and has a Gas Rating above 0.
    effect: This Leg's hazard roll is 1 lower. It is lowered once, however many soldiers hold Lookout Tree.
  close-pass:
    trigger: You declare a Break Attention that names a Feint.
    effect: The Feint adds nothing to what the roll needs. Every other need still applies.

  # ---------------------------------------------------------------- Hunter
  hunters-eye:
    trigger: You declare a Read.
    effect: The roll may use Perception instead of Instinct. It is still a Read, so a Talent that names Read still adds its dice.
  flare-discipline:
    trigger: Your Break Attention that names a flare decoy succeeds.
    effect: The decoy holds the Titan's Attention for 1 more of its cards than its Tempo.
  forager:
    trigger: The camp roll at a Night Camp succeeds, and you made it or Helped it.
    effect: >-
      The Night Camp spends no ration, and a camp that finds Squad Supply with no rations counts as having its
      ration. This applies once for the camp, however many soldiers hold Forager.
  saw-it-coming:
    trigger: A Titan Engagement begins from a row of the Leg Hazard table or the Night table, and you take part in it and are not Down.
    effect: >-
      Before round 1, the first Focus Titan's Next Behavior is revealed to every soldier, as a Read reveals it.
      No Call It can be made on it. It is revealed once, however many soldiers hold Saw It Coming.

  # ---------------------------------------------------------------- Tactician
  sharp-call:
    trigger: You declare Call It.
    effect: >-
      Call It needs one fewer success from your Read than it otherwise does, to a minimum of 1: the success that
      revealed the Next Behavior is enough.
  wide-awareness:
    trigger: You declare Help for a roll in a Titan Engagement.
    effect: You may be up to two Position steps from the roller instead of one. Every other Help requirement still applies.
  formation-drill:
    trigger: You declare that the Squadmate on your Wing Helps a roll of yours in a Titan Engagement.
    effect: The Squadmate may be up to two Position steps from you instead of one. Every other Help requirement still applies.
  change-the-order:
    trigger: The swap step of a round in a Titan Engagement begins, and you hold a card this round and are neither Down nor Grabbed.
    effect: >-
      You may name two comrades who each hold a card this round, are neither Down nor Grabbed, and both agree.
      They exchange cards whatever Positions they hold. It is the one swap each of them takes part in this round,
      and you take no part in it.
  break-their-nerve:
    trigger: Your Size Up of a Foe group in a Skirmish succeeds.
    effect: >-
      For the rest of that Skirmish, the group's Grit counts as 1 lower when testing whether it breaks, to a
      minimum of 1. What a Parley against it needs does not change.

  # ---------------------------------------------------------------- Leader
  unshaken-command:
    trigger: In a Titan Engagement, a comrade who holds your Position or a Position one step from you makes a Fear Roll, and you are not Down.
    effect: That Fear Roll uses your Resolve in place of the comrade's, if yours is higher.
  shout-them-off:
    trigger: You declare Draw Attention in a Titan Engagement.
    effect: You may spend your move on it instead of your action, so the shout and a blade can fall in the same turn. Once per Titan Engagement.
  carrying-voice:
    trigger: You declare Rally.
    effect: >-
      You may target a comrade one Position step farther from you than Rally otherwise allows. In a Skirmish,
      which has no Positions, you may target any soldier taking part in it.
  shoulder-the-load:
    trigger: You declare that you Cover a comrade's Push in a Titan Engagement.
    effect: You may be up to two Position steps from the Pushing soldier instead of one. Every other Covering requirement still applies.
  put-in-a-word:
    trigger: You declare that you Help a comrade's Requisition roll.
    effect: >-
      If you are a player character, the Help does not spend your own Requisition this Downtime, and you may Help
      even if you have already made your own Requisition roll. Every other Help requirement of that roll still
      applies.
  campfire-talk:
    trigger: The camp roll at a Night Camp succeeds, and you are not Down.
    effect: >-
      Camp Relief lowers the Stress of every soldier on the Expedition by 2 instead of 1, never below a soldier's
      minimum Stress. This applies once for the camp, however many soldiers hold Campfire Talk.

  # ---------------------------------------------------------------- Medic
  careful-nursing:
    trigger: Your Treat Injury roll succeeds on a comrade's Critical Injury.
    effect: That Critical Injury's healing time is halved, rounding up. Each Critical Injury can be halved only once.
  sure-hands:
    trigger: You have Pushed a Treat Injury roll, and no Stress Die shows 1.
    effect: You may Push that roll a second time, following the Push steps again. A roll never causes more than one Stress Response.
  triage:
    trigger: Your Treat Injury roll in a care window treats a Critical Injury and succeeds with at least 2 successes.
    effect: >-
      One more untreated Critical Injury of the same patient, one that roll could have named, also becomes
      treated, as treating gives. It uses no soldier's roll in the window.
  friends-in-the-infirmary:
    trigger: You declare a Requisition roll for a medical kit or for medical supplies.
    effect: The roll needs 1 fewer success than its Scarcity and the Ledger give, to a minimum of 1.
  tourniquet:
    trigger: In a Titan Engagement, your Treat Injury roll on a comrade's lethal Critical Injury with a turn limit fails.
    effect: >-
      That Critical Injury's time limit slows one step: instead of running out at the end of each of the
      patient's turns, it runs out once, when the Titan Engagement ends. It stays untreated and keeps its Health
      box crossed off.

  # ---------------------------------------------------------------- Engineer
  make-do:
    trigger: You declare a Field Repair roll with no tool kit that counts as had, so the roll would use Wits alone.
    effect: The roll still adds dice from one Talent that names Field Repair.
  quick-refit:
    trigger: You declare Change Canister in a Titan Engagement.
    effect: If changing a canister would spend your action, you may spend your move on it instead.
  spare-parts:
    trigger: Your Field Repair roll in a Titan Engagement succeeds.
    effect: The named item's current rating rises by 1 more, to at most its rating.
  gunsmith:
    trigger: A Pushed Shoot roll, made with your firearm as its gear item, is about to wear that firearm.
    effect: Ignore 1 point of that wear.

  # ---------------------------------------------------------------- Rider
  loose-the-horse:
    trigger: You declare a Break Attention roll with your horse as its gear item.
    effect: The roll may use Agility instead of Perception.
  sure-seat:
    trigger: A Pushed roll for one of these Actions, made with your horse as its gear item, is about to wear your horse.
    effect: Ignore 1 point of that wear.
  rescue-ride:
    trigger: You declare Lift Comrade while mounted.
    effect: You may take it as part of your move instead of as your action.
  horse-whistle:
    trigger: >-
      You declare a move in a Titan Engagement that mounts your own horse, while you hold Distant or In Reach
      relative to the Focus Titan recorded with the horse's Position.
    effect: >-
      Before the move, your horse holds the Position you hold, if it is not lame and holds a Position, so the move
      can mount it. Every other mount requirement still applies.
  hard-rider:
    trigger: Your Ride roll as Lead on a Hard Ride succeeds.
    effect: The Leg spends 1 ration fewer than a successful Hard Ride spends.

  # ---------------------------------------------------------------- Brawler
  pry-loose:
    trigger: You declare Break Free on behalf of a Grabbed comrade who holds your Position, and you are not Grabbed.
    effect: >-
      You may take Break Free as your action on that comrade's behalf, although you are not Grabbed. You roll
      your own pool, including your Dice Talent that names Break Free. If the roll succeeds, the comrade is freed
      exactly as if they had succeeded themselves. It never applies to a comrade Held by a Foe in a Skirmish.
  strong-back:
    trigger: You carry a comrade you lifted with Lift Comrade.
    effect: The comrade's own 5 items do not count toward the items you carry. The items that comrade carries still count.
  headlock:
    trigger: Your Grapple lands on a Foe in a Skirmish, and that Foe becomes Held by you.
    effect: >-
      While you hold that Foe, it counts as out of the Skirmish for its group's breaking test. If the group
      breaks while you hold it, that Foe does not leave: it surrenders and is out of the Skirmish. Only that Foe
      surrenders, and the group's other Foes break as its breaking test gives.
  shoulder-charge:
    trigger: Your Break Free roll in a Titan Engagement frees a Grabbed soldier.
    effect: The Titan that had them Grabbed gains 1 Opening, created by you.

  # ---------------------------------------------------------------- General
  iron-nerve:
    trigger: You roll for a Stress Response.
    effect: Your Resolve counts as 1 higher for that roll.
  steady-heart:
    trigger: You make a Fear Roll because a comrade becomes Grabbed or a comrade dies.
    effect: Your Resolve counts as 1 higher for that roll.
  got-your-back:
    trigger: You declare that you Cover a comrade's Push in a Titan Engagement.
    effect: >-
      If you have Covered no other comrade's Push in this Titan Engagement, you may Cover it from any number of
      Position steps away. Every other Covering requirement still applies.
  gallows-humour:
    trigger: You roll for a Stress Response.
    effect: Once the total is known, you may roll the D6 a second time. Use the second total.
  stay-with-the-column:
    trigger: You have Pushed the Endure roll a Straggler row calls for, and no Stress Die shows 1.
    effect: You may Push that roll a second time, following the Push steps again. A roll never causes more than one Stress Response.
  light-sleeper:
    trigger: A Skirmish begins at a Night Camp with its Foes holding the ambush, and you are not Down.
    effect: The ambush does not stop your Reactions. In round 1 you may make a Reaction against a Foe's attack, as the Reaction rules allow.
  nothing-wasted:
    trigger: You declare Take Item in a Titan Engagement for a dead comrade's left items.
    effect: The take spends your move instead of your action.
  not-like-this:
    trigger: You declare Break Free while you are Grabbed and have been lifted.
    effect: The roll takes no penalty for being lifted.
