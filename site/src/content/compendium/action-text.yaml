# Player wording for the Action Catalog entries, keyed by the entry's id in
# data/character/action-catalog.yaml. The Catalog's requirement and effect text points at other tables
# and sections, so every entry needs wording here: `does` and `pages` at least. An entry with no
# wording, or wording that still carries a reference, fails the build (site/src/lib/shared-data.ts).
#
#   requires   what the soldier must meet, one sentence per item
#   needs      the successes the roll needs
#   does       what it does, one paragraph per item
#   help       who can Help it where the usual Help rules do not decide
#   gear_note  a sentence added after the gear line
#   pages      the Player's Guide chapters holding the full rules ("rules-of-play#help" for an anchor)
#
# Kind, attribute, gear, and the Talents that name an entry come from the Catalog itself.
# Never change a rule's meaning. When a source below changes, check the wording against it and record
# the new sha from `git hash-object <path>` (scripts/check-sync.mjs lists what changed).
