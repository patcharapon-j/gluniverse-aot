# Player wording for the gear tables, keyed by each row's id in the shared gear tables.
# The tables hold the items, the numbers, and the order; the sentences a player reads are here.
# A row with no wording, or wording that still carries a reference, fails the build
# (site/src/lib/gear-tables.ts). Lists must match their table's rows one for one, so a new row
# cannot go missing from a page.
#
#   items        one entry per gear item: what it is, when it counts as not had, what 0 means,
#                what brings it back, what it counts as toward your carrying limit, and the
#                extra lines its Compendium card shows
#   carrying     what each thing counts as toward the carrying limit
#   passing      what can be passed and taken, and what never moves
#   falls        the height bands and the landings
#   supply       the four kinds of Squad Supply and what spends each
#   issue        the steps of receiving Standard Issue
#
# Never change a rule's meaning. When a source below changes, check the wording against it and
# record the new sha from `git hash-object <path>` (scripts/check-sync.mjs lists what changed).
sources:
  - path: data/gear/items.yaml
    sha: "a4422fa6230a092d786f8e3d3c3fd02849a96b57"
  - path: data/gear/odm-gear.yaml
