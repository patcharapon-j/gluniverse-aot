# The website's Titan specimen wording, ported for the Titan field notes journal: the page keeps it
# in an Astro component (site/src/components/TitanSpecimen.astro), which the build cannot import.
# Keep each sentence as the website words it. When the build warns that the component changed,
# copy the new wording and record the component's new sha (`git hash-object <path>`).
